<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Edge Garden</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&family=DM+Mono:wght@300;400&display=swap');
:root {
  --bg: #0a0a0f;
  --text: #e6e6f0;
  --muted: #8a8aa0;
  --glow: #7bd0ff;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: 'Space Grotesk', 'DM Mono', system-ui, sans-serif;
  overflow: hidden;
}
#world {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  background: var(--bg);
  display: block;
  touch-action: none;
}
#hud {
  position: fixed;
  top: 14px;
  right: 14px;
  padding: 10px 12px;
  background: rgba(10, 10, 15, 0.65);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 10px;
  backdrop-filter: blur(4px);
  box-shadow: 0 0 18px rgba(0, 0, 0, 0.4);
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  color: var(--muted);
}
#wind-indicator {
  margin-top: 4px;
  display: flex;
  align-items: center;
  gap: 6px;
}
#wind-arrow {
  color: #9ad1ff;
  font-size: 14px;
}
#hud-status {
  margin-top: 4px;
  color: #7bd0ff;
}
#coords strong { color: var(--text); }
#title {
  position: fixed;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  font-size: 36px;
  letter-spacing: 2px;
  color: #f6f6ff;
  text-transform: uppercase;
  pointer-events: none;
  opacity: 0;
  animation: titleIntro 7s ease forwards;
  text-shadow: 0 0 20px rgba(255, 255, 255, 0.25);
}
#title small {
  display: block;
  font-size: 13px;
  color: var(--muted);
  letter-spacing: 1px;
}
@keyframes titleIntro {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(0.95); }
  20% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  55% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  100% { opacity: 0.7; transform: translate(16px, 16px) scale(0.72); left: 0; top: 0; }
}
#zone-info {
  position: fixed;
  left: 50%;
  bottom: 70px;
  transform: translateX(-50%) translateY(20px);
  background: rgba(12, 12, 16, 0.78);
  border: 1px solid rgba(255, 255, 255, 0.08);
  padding: 12px 16px;
  border-radius: 12px;
  min-width: 260px;
  max-width: 480px;
  backdrop-filter: blur(6px);
  box-shadow: 0 0 18px rgba(0, 0, 0, 0.4);
  opacity: 0;
  transition: opacity 0.4s ease, transform 0.4s ease;
  pointer-events: none;
  position: relative;
}
#zone-info.visible {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
  pointer-events: auto;
  animation: zonePulse 2.4s ease-in-out infinite;
}
#zone-info.hidden-zone {
  border-color: rgba(255, 215, 0, 0.35);
  box-shadow: 0 0 26px rgba(255, 215, 0, 0.22), 0 0 18px rgba(0, 0, 0, 0.42);
  animation: hiddenGlow 2.4s ease-in-out infinite;
}
#zone-info.hidden-zone h3,
#zone-info.hidden-zone p {
  color: #ffeaa7;
  text-shadow: 0 0 12px rgba(255, 215, 0, 0.45);
}
#zone-info.hidden-zone #seed-button {
  border-color: rgba(255, 215, 0, 0.35);
  background: radial-gradient(circle at 30% 30%, rgba(255, 215, 0, 0.18), rgba(30, 24, 6, 0.6));
  color: #fff5c8;
  box-shadow: 0 0 14px rgba(255, 215, 0, 0.25);
}
@keyframes zonePulse {
  0% { border-color: rgba(255, 255, 255, 0.08); box-shadow: 0 0 18px rgba(0, 0, 0, 0.4); }
  50% { border-color: rgba(255, 255, 255, 0.2); box-shadow: 0 0 24px rgba(120, 180, 255, 0.25); }
  100% { border-color: rgba(255, 255, 255, 0.08); box-shadow: 0 0 18px rgba(0, 0, 0, 0.4); }
}
@keyframes hiddenGlow {
  0% { box-shadow: 0 0 22px rgba(255, 215, 0, 0.28); border-color: rgba(255, 215, 0, 0.2); }
  50% { box-shadow: 0 0 38px rgba(255, 215, 0, 0.42); border-color: rgba(255, 215, 0, 0.4); }
  100% { box-shadow: 0 0 22px rgba(255, 215, 0, 0.28); border-color: rgba(255, 215, 0, 0.2); }
}
#zone-info h3 {
  margin: 0 0 6px;
  font-size: 16px;
  letter-spacing: 1px;
}
#zone-close {
  position: absolute;
  right: 10px;
  top: 10px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.12);
  color: #e6e6f0;
  border-radius: 8px;
  width: 24px;
  height: 24px;
  cursor: pointer;
  font-size: 12px;
  line-height: 1;
  transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
}
#zone-close:hover {
  background: rgba(255, 255, 255, 0.12);
  border-color: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}
#zone-info p {
  margin: 0;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.4;
}
#seed-action {
  margin-top: 10px;
  text-align: right;
}
#seed-button {
  border: 1px solid rgba(255, 255, 255, 0.14);
  background: rgba(255, 255, 255, 0.04);
  color: #e6e6f0;
  border-radius: 10px;
  padding: 8px 12px;
  font-size: 13px;
  cursor: pointer;
  transition: background 0.2s ease, border-color 0.2s ease;
}
#seed-button:hover {
  background: rgba(255, 255, 255, 0.08);
  border-color: rgba(255, 255, 255, 0.22);
}
#seed-modal {
  position: fixed;
  left: 50%;
  bottom: 140px;
  transform: translateX(-50%) translateY(20px);
  background: rgba(18, 18, 26, 0.9);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 12px;
  padding: 14px 16px;
  min-width: 260px;
  max-width: 360px;
  box-shadow: 0 0 26px rgba(0, 0, 0, 0.55);
  backdrop-filter: blur(8px);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease, transform 0.25s ease;
}
#seed-modal.visible {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
  pointer-events: auto;
}
#seed-modal h4 {
  margin: 0 0 8px;
  letter-spacing: 0.5px;
  font-size: 14px;
}
.seed-field {
  width: 100%;
  padding: 8px 10px;
  margin-bottom: 8px;
  border-radius: 8px;
  border: 1px solid rgba(255, 255, 255, 0.12);
  background: rgba(255, 255, 255, 0.03);
  color: #f3f3ff;
  font-size: 13px;
}
.seed-field::placeholder { color: rgba(230, 230, 240, 0.6); }
#plant-button {
  width: 100%;
  padding: 8px 10px;
  border-radius: 9px;
  border: 1px solid rgba(255, 255, 255, 0.14);
  background: linear-gradient(135deg, rgba(68, 187, 120, 0.4), rgba(102, 178, 255, 0.3));
  color: #f6f6ff;
  font-size: 13px;
  cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.2s ease;
}
#plant-button:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
}
#seed-confirm {
  position: fixed;
  left: 50%;
  bottom: 120px;
  transform: translateX(-50%);
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.12);
  padding: 8px 12px;
  border-radius: 10px;
  font-size: 12px;
  color: #e6e6f0;
  letter-spacing: 0.5px;
  opacity: 0;
  transition: opacity 0.3s ease;
  pointer-events: none;
}
#minimap {
  position: fixed;
  right: 14px;
  bottom: 14px;
  width: 170px;
  height: 170px;
  border-radius: 12px;
  border: 1px solid rgba(255, 255, 255, 0.08);
  background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.04), rgba(10, 10, 15, 0.9));
  box-shadow: 0 0 18px rgba(0, 0, 0, 0.35);
}
#minimap canvas { width: 100%; height: 100%; display: block; }
#nav {
  position: fixed;
  left: 16px;
  bottom: 16px;
  display: flex;
  gap: 14px;
  font-size: 13px;
  letter-spacing: 0.5px;
}
#nav a {
  color: rgba(255, 255, 255, 0.72);
  text-decoration: none;
  padding: 6px 10px;
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.05);
  transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
}
#nav button {
  color: rgba(255, 255, 255, 0.9);
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 14px;
  cursor: pointer;
  transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
}
#nav a:hover {
  color: #fff;
  border-color: rgba(255, 255, 255, 0.12);
  background: rgba(255, 255, 255, 0.07);
}
#nav button:hover {
  color: #fff;
  border-color: rgba(255, 255, 255, 0.16);
  background: rgba(255, 255, 255, 0.09);
}
#rain-toggle {
  color: rgba(255, 255, 255, 0.9);
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 14px;
  cursor: pointer;
  transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
}
#snow-toggle {
  color: rgba(255, 255, 255, 0.9);
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 14px;
  cursor: pointer;
  transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
}
body.touch #nav a,
body.touch #nav button {
  padding: 10px 14px;
}
#center-marker {
  position: fixed;
  left: 50%;
  top: 50%;
  width: 14px;
  height: 14px;
  margin-left: -7px;
  margin-top: -7px;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.7);
  box-shadow: 0 0 8px rgba(255, 255, 255, 0.35);
  pointer-events: none;
}
#instruction {
  position: fixed;
  left: 16px;
  top: 16px;
  color: var(--muted);
  font-size: 12px;
  letter-spacing: 0.5px;
  background: rgba(255, 255, 255, 0.03);
  padding: 8px 10px;
  border-radius: 8px;
  border: 1px solid rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(5px);
}
#time-indicator {
  position: fixed;
  left: 16px;
  top: 64px;
  padding: 8px 10px;
  min-width: 130px;
  border-radius: 10px;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.03));
  border: 1px solid rgba(255, 255, 255, 0.08);
  color: #f6f6ff;
  font-size: 13px;
  letter-spacing: 0.6px;
  font-family: 'Space Grotesk', 'DM Mono', system-ui, sans-serif;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  backdrop-filter: blur(5px);
  pointer-events: none;
  --time-accent: #7bd0ff;
}
#time-indicator::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 10px;
  border: 1px solid rgba(255, 255, 255, 0.12);
  box-shadow: 0 0 22px rgba(0, 0, 0, 0.18);
  pointer-events: none;
}
#time-indicator .dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  margin-right: 6px;
  border-radius: 50%;
  box-shadow: 0 0 12px var(--time-accent);
  background: var(--time-accent);
  vertical-align: middle;
}
#celebration {
  position: fixed;
  left: 50%;
  top: 18%;
  transform: translateX(-50%);
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 12px;
  padding: 10px 14px;
  font-size: 13px;
  letter-spacing: 0.6px;
  color: #f2f2ff;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s ease;
}
#memory-overlay {
  position: fixed;
  left: 50%;
  top: 22%;
  transform: translateX(-50%);
  background: rgba(255, 204, 68, 0.12);
  border: 1px solid rgba(255, 204, 68, 0.5);
  border-radius: 12px;
  padding: 10px 14px;
  font-size: 13px;
  letter-spacing: 0.6px;
  color: #ffeac0;
  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45), 0 0 24px rgba(255, 204, 68, 0.15);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}
#memory-overlay.visible {
  opacity: 1;
}
#konami-overlay {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at 50% 50%, rgba(30, 40, 60, 0.35), rgba(5, 5, 10, 0.88));
  color: #f1f3ff;
  font-family: 'Space Grotesk', sans-serif;
  letter-spacing: 0.4px;
  text-align: center;
  padding: 20px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.45s ease;
  z-index: 5;
}
#konami-overlay.visible {
  opacity: 1;
  pointer-events: auto;
}
#konami-overlay .panel {
  max-width: 560px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 14px;
  padding: 18px 22px;
  box-shadow: 0 18px 36px rgba(0, 0, 0, 0.45);
  text-shadow: 0 0 18px rgba(255, 255, 255, 0.2);
}
#portal-overlay {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(0, 0, 0, 0.55);
  backdrop-filter: blur(8px);
  z-index: 6;
  --portal-accent: #7dd3fc;
}
#portal-overlay.visible { display: flex; }
#portal-overlay .panel {
  background: rgba(12, 12, 16, 0.9);
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 14px;
  padding: 18px 20px;
  box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55), 0 0 26px rgba(0, 0, 0, 0.45), 0 0 0 1px var(--portal-accent);
  min-width: 280px;
  max-width: 360px;
  text-align: center;
}
#portal-overlay h3 {
  margin: 0 0 6px;
  font-size: 18px;
  letter-spacing: 0.6px;
  color: #f3f3ff;
}
#portal-overlay p {
  margin: 0 0 14px;
  color: #c8c8e0;
  font-size: 13px;
}
#portal-actions {
  display: flex;
  gap: 10px;
  justify-content: center;
}
.portal-button {
  padding: 9px 12px;
  border-radius: 10px;
  border: 1px solid rgba(255, 255, 255, 0.12);
  background: rgba(255, 255, 255, 0.05);
  color: #f5f6ff;
  font-size: 13px;
  cursor: pointer;
  transition: transform 0.1s ease, box-shadow 0.2s ease, border-color 0.2s ease, background 0.2s ease;
}
.portal-button.primary {
  border-color: var(--portal-accent);
  background: linear-gradient(135deg, var(--portal-accent), rgba(255, 255, 255, 0.08));
  box-shadow: 0 8px 18px rgba(0, 0, 0, 0.3), 0 0 12px rgba(0, 0, 0, 0.15), 0 0 12px var(--portal-accent);
}
.portal-button:hover {
  transform: translateY(-1px);
  border-color: var(--portal-accent);
  background: rgba(255, 255, 255, 0.08);
  box-shadow: 0 8px 18px rgba(0, 0, 0, 0.25), 0 0 12px rgba(0, 0, 0, 0.12), 0 0 12px var(--portal-accent);
}
#poem-overlay {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(5, 8, 12, 0.7);
  backdrop-filter: blur(6px);
  z-index: 7;
}
#poem-overlay.visible { display: flex; }
#poem-overlay .panel {
  background: rgba(14, 16, 24, 0.95);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 14px;
  padding: 18px 20px;
  max-width: 420px;
  width: 90%;
  box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55);
}
.poem-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 6px;
}
.poem-header h3 {
  margin: 0;
  font-size: 18px;
  letter-spacing: 0.6px;
  color: #f3f3ff;
}
.poem-close {
  border: 1px solid rgba(255, 255, 255, 0.14);
  background: rgba(255, 255, 255, 0.05);
  color: #e6e6f0;
  border-radius: 8px;
  padding: 6px 10px;
  cursor: pointer;
}
.poem-status {
  margin: 0 0 10px;
  color: var(--muted);
  font-size: 13px;
}
.poem-status.complete {
  color: #7bd0ff;
}
#poem-list {
  list-style: none;
  padding: 0;
  margin: 0 0 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
#poem-list li {
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 10px;
  padding: 8px 10px;
  color: #e6e6f0;
  font-size: 13px;
}
#poem-list .poem-empty {
  color: var(--muted);
  text-align: center;
}
.poem-actions {
  display: flex;
  justify-content: flex-end;
}
.poem-actions button {
  border: 1px solid rgba(255, 255, 255, 0.14);
  background: rgba(255, 255, 255, 0.06);
  color: #e6e6f0;
  border-radius: 10px;
  padding: 8px 12px;
  cursor: pointer;
}
#fragment-toast {
  position: fixed;
  left: 50%;
  bottom: 120px;
  transform: translateX(-50%) translateY(10px);
  background: rgba(123, 208, 255, 0.12);
  border: 1px solid rgba(123, 208, 255, 0.4);
  color: #cfeeff;
  padding: 8px 12px;
  border-radius: 10px;
  font-size: 12px;
  letter-spacing: 0.5px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease, transform 0.25s ease;
}
#monument-toast {
  position: fixed;
  left: 50%;
  bottom: 154px;
  transform: translateX(-50%) translateY(10px);
  background: rgba(136, 119, 102, 0.14);
  border: 1px solid rgba(136, 119, 102, 0.5);
  color: #f1e7dc;
  padding: 9px 12px;
  border-radius: 10px;
  font-size: 12px;
  letter-spacing: 0.5px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease, transform 0.25s ease;
  text-align: center;
  box-shadow: 0 10px 26px rgba(0, 0, 0, 0.35), 0 0 18px rgba(136, 119, 102, 0.25);
}
#monument-toast strong {
  display: block;
  font-size: 13px;
  letter-spacing: 0.6px;
  color: #fff6e8;
  margin-bottom: 3px;
}
#monument-toast.visible {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
#island-toast {
  position: fixed;
  left: 50%;
  bottom: 220px;
  transform: translateX(-50%) translateY(10px);
  background: rgba(51, 68, 85, 0.16);
  border: 1px solid rgba(51, 68, 85, 0.5);
  color: #d7e3f1;
  padding: 9px 12px;
  border-radius: 10px;
  font-size: 12px;
  letter-spacing: 0.5px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease, transform 0.25s ease;
  text-align: center;
  box-shadow: 0 10px 26px rgba(0, 0, 0, 0.35), 0 0 18px rgba(51, 68, 85, 0.25);
}
#ruin-toast {
  position: fixed;
  left: 50%;
  bottom: 252px;
  transform: translateX(-50%) translateY(10px);
  background: rgba(102, 85, 68, 0.16);
  border: 1px solid rgba(102, 85, 68, 0.5);
  color: #f1e7dc;
  padding: 9px 12px;
  border-radius: 10px;
  font-size: 12px;
  letter-spacing: 0.5px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease, transform 0.25s ease;
  text-align: center;
  box-shadow: 0 10px 26px rgba(0, 0, 0, 0.35), 0 0 18px rgba(102, 85, 68, 0.25);
}
#island-toast.visible {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
#ruin-toast.visible {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
#fragment-toast.visible {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
#constellation-toast {
  position: fixed;
  left: 50%;
  bottom: 86px;
  transform: translateX(-50%) translateY(10px);
  background: rgba(255, 255, 170, 0.12);
  border: 1px solid rgba(255, 255, 170, 0.5);
  color: #fffbe0;
  padding: 8px 12px;
  border-radius: 10px;
  font-size: 12px;
  letter-spacing: 0.5px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease, transform 0.25s ease;
}
#constellation-toast.visible {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
#memory-well-toast {
  position: fixed;
  left: 50%;

  function getTimeOfDay() {
    const hour = new Date().getHours();
    if (hour >= 5 && hour <= 7) return 'dawn';
    if (hour >= 8 && hour <= 11) return 'morning';
    if (hour >= 12 && hour <= 13) return 'noon';
    if (hour >= 14 && hour <= 17) return 'afternoon';
    if (hour >= 18 && hour <= 20) return 'dusk';
    return 'night';
  }

  function updateTimeIndicator() {

    const meta = timeSettings[timeOfDay] || timeSettings.night;
    const accent = meta.accent || '#7bd0ff';
    const emoji = meta.emoji || '';
    const label = meta.label || timeOfDay;
    timeIndicator.style.setProperty('--time-accent', accent);
    const prefix = emoji ? `${emoji} ` : '';
    timeIndicator.innerHTML = `<span class="dot"></span>${prefix}${label}`;
  }

  function createGlowingMushrooms(count) {
    const mushrooms = [];
    const cols = 5;
    const rows = Math.ceil(count / cols);
    const cellW = worldSize / cols;
    const cellH = worldSize / rows;
    for (let i = 0; i < count; i++) {
      const col = i % cols;
      const row = Math.floor(i / cols);
      const padX = cellW * 0.15;
      const padY = cellH * 0.15;
      const x = col * cellW + padX + Math.random() * (cellW - padX * 2);
      const y = row * cellH + padY + Math.random() * (cellH - padY * 2);
      mushrooms.push({
        x,
        y,
        size: 8 + Math.random() * 10,
        hue: 180 + Math.random() * 140,
        pulseOffset: Math.random() * Math.PI * 2
      });
    }
    return mushrooms;
  }

  function recordTrail(time) {

  function recordExplorationPath() {

    const last = explorationPath[explorationPath.length - 1];
    if (!last || Math.hypot(currentPos.x - last.x, currentPos.y - last.y) > 50) {

  function addCursorTrailParticle(x, y, vx, vy, time) {
    const baseRadius = 4 + Math.random() * 4;
    cursorTrail.push({
      x,
      y,
      vx: (vx || 0) * 18,
      vy: (vy || 0) * 18,
      birth: time,
      life: meditationMode ? 700 : 900,
      radius: baseRadius
    });
    if (cursorTrail.length > maxCursorTrail) cursorTrail.shift();

  function handleCursorMove(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const x = clientX - rect.left;
    const y = clientY - rect.top;
    const now = performance.now ? performance.now() : Date.now();
    if (!cursorInitialized) {
      cursorPos.x = x;
      cursorPos.y = y;
      cursorInitialized = true;
      lastCursorSampleTime = now;
      return;
    }
    const dx = x - cursorPos.x;
    const dy = y - cursorPos.y;
    const dist = Math.hypot(dx, dy);
    const elapsed = lastCursorSampleTime ? now - lastCursorSampleTime : 16;
    cursorPos.x = x;
    cursorPos.y = y;
    lastCursorSampleTime = now;
    if (dist < 0.5) return;
    lastCursorMoveTime = now;
    const vx = elapsed > 0 ? dx / elapsed : 0;
    const vy = elapsed > 0 ? dy / elapsed : 0;
    addCursorTrailParticle(x, y, vx, vy, now);
  }

  function updateCursorTrail(dt, time) {
    if (!cursorTrail.length) return;
    const frameScale = dt ? dt / 16.6667 : 1;
    for (let i = cursorTrail.length - 1; i >= 0; i--) {
      const p = cursorTrail[i];
      p.x += p.vx * frameScale;
      p.y += p.vy * frameScale;
      p.vx *= 0.86;
      p.vy *= 0.86;
      if (time - p.birth > p.life) {
        cursorTrail.splice(i, 1);
      }
    }
  }

  function updateCamera(dt) {
    if (journalOpen) return 0;
    const prevX = camera.x;
    const prevY = camera.y;
    const moveBase = 380 * (meditationMode ? 0.6 : 1);
    const speed = moveBase * dt / 1000 / camera.zoom;
    let mx = 0;
    let my = 0;
    if (keys['KeyW'] || keys['ArrowUp']) my -= 1;
    if (keys['KeyS'] || keys['ArrowDown']) my += 1;
    if (keys['KeyA'] || keys['ArrowLeft']) mx -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) mx += 1;
    if (mx || my) {
      targetPosition = null;
      const len = Math.hypot(mx, my) || 1;
      camera.x += (mx / len) * speed;
      camera.y += (my / len) * speed;
    }
      spawnMovementEcho(camera.x, camera.y);
    camera.x = clamp(camera.x, 0, worldSize);
    camera.y = clamp(camera.y, 0, worldSize);
    return Math.hypot(camera.x - prevX, camera.y - prevY);
  }

  function updateTargetDrift(dt) {
    if (!targetPosition || journalOpen || isTouching) return 0;
    const dx = targetPosition.x - camera.x;
    const dy = targetPosition.y - camera.y;
    const dist = Math.hypot(dx, dy);
    if (dist < 6) {
      targetPosition = null;
      return 0;
    }
    const speed = Math.min(520, dist * 1.8);
    const step = speed * dt / 1000;
    const nx = dx / dist;
    const ny = dy / dist;
    camera.x = clamp(camera.x + nx * step, 0, worldSize);
    camera.y = clamp(camera.y + ny * step, 0, worldSize);
    return step;
  }

  function updateParticles(dt, windVector) {
    const camDx = camera.x - lastCam.x;
    const camDy = camera.y - lastCam.y;
    const dtSec = dt / 1000;
    const windPushX = (windVector && windVector.dx) ? windVector.dx * 0.08 * dtSec : 0;
    const windPushY = (windVector && windVector.dy) ? windVector.dy * 0.08 * dtSec : 0;
    particles.forEach(p => {
      p.sx -= camDx * 0.35;
      p.sy -= camDy * 0.35;
      p.sx += p.vx * dt / 1000;
      p.sy += p.vy * dt / 1000;
      p.sx += windPushX * p.depth;
      p.sy += windPushY * p.depth;
      if (p.sx < -20) p.sx = width + 20;
      if (p.sy < -20) p.sy = height + 20;
      if (p.sx > width + 20) p.sx = -20;
      if (p.sy > height + 20) p.sy = -20;
    });
    lastCam.x = camera.x;
    lastCam.y = camera.y;
  }

  function updateFragments(dt, windVector) {
    const dtSec = dt / 1000;
    const windX = (windVector && windVector.dx) ? windVector.dx * 0.3 * dtSec : 0;
    const windY = (windVector && windVector.dy) ? windVector.dy * 0.3 * dtSec : 0;
    fragments.forEach(f => {
      f.x = (f.x + f.vx * dtSec + windX + worldSize) % worldSize;
      f.y = (f.y + f.vy * dtSec + windY + worldSize) % worldSize;
    });
  }

  function updateEchoes(dt, time) {
    if (meditationMode) return;
    echoes.forEach(echo => {
      const baseStep = echo.driftSpeed * dt / 1000;
      echo.x = (echo.x + Math.cos(echo.driftAngle) * baseStep + worldSize) % worldSize;
      echo.y = (echo.y + Math.sin(echo.driftAngle) * baseStep + worldSize) % worldSize;

      const dx = camera.x - echo.x;
      const dy = camera.y - echo.y;
      const dist = Math.hypot(dx, dy);
      if (dist < 200) {
        echo.attract = 1;
      }
      if (echo.attract > 0 && dist > 0.001) {
        const toward = 18 * echo.attract * dt / 1000;
        echo.x = (echo.x + (dx / dist) * toward + worldSize) % worldSize;
        echo.y = (echo.y + (dy / dist) * toward + worldSize) % worldSize;
        echo.attract = Math.max(0, echo.attract - dt / 800);
      } else {
        echo.attract = Math.max(0, echo.attract - dt / 1000);
      }
    });
  }

  function updateWisps(dt) {
    wisps.forEach(w => {
      w.changeTimer -= dt;
      if (w.changeTimer <= 0) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 10 + Math.random() * 18;
        w.vx = Math.cos(angle) * speed;
        w.vy = Math.sin(angle) * speed;
        w.changeTimer = 600 + Math.random() * 900;
      }
      w.x = (w.x + w.vx * dt / 1000 + worldSize) % worldSize;
      w.y = (w.y + w.vy * dt / 1000 + worldSize) % worldSize;
      w.trail.push({ x: w.x, y: w.y });
      if (w.trail.length > 18) w.trail.shift();
    });
  }

  function updateCreatures(dt) {
    const player = { x: camera.x, y: camera.y };
    const dtFactor = dt / 16.6667;
    creatures.forEach(creature => {
      const dx = player.x - creature.x;
      const dy = player.y - creature.y;
      const dist = Math.hypot(dx, dy);

      if (dist > 0 && dist < creature.awareness) {
        if (creature.type === 'moth') {
          creature.vx += dx * 0.0001 * dtFactor;
          creature.vy += dy * 0.0001 * dtFactor;
        } else if (creature.type === 'firefly') {
          const repel = 0.02 * dtFactor;
          const nx = dx / dist;
          const ny = dy / dist;
          creature.vx -= nx * repel;
          creature.vy -= ny * repel;
          creature.fleeing = true;
          creature.fleeTimer = 60;
        } else if (creature.type === 'echomote') {
          const nx = dx / dist;
          const ny = dy / dist;
          const orbitStrength = 0.012 * dtFactor;
          creature.vx += -ny * orbitStrength;
          creature.vy += nx * orbitStrength;
        }
      }

      const drift = 0.01 * dtFactor;
      creature.vx += (Math.random() - 0.5) * drift;
      creature.vy += (Math.random() - 0.5) * drift;

      creature.vx *= 0.98;
      creature.vy *= 0.98;

      const speed = Math.hypot(creature.vx, creature.vy);
      if (speed > 1.5) {
        const scale = 1.5 / speed;
        creature.vx *= scale;
        creature.vy *= scale;
      }

      creature.x = (creature.x + creature.vx * dt / 1000 + worldSize) % worldSize;
      creature.y = (creature.y + creature.vy * dt / 1000 + worldSize) % worldSize;
      creature.phase += creature.blinkRate * dtFactor;
      if (creature.phase > Math.PI * 2) creature.phase -= Math.PI * 2;

      if (creature.fleeTimer > 0) {
        creature.fleeTimer -= dtFactor;
        if (creature.fleeTimer <= 0) {
          creature.fleeTimer = 0;
          creature.fleeing = false;
        }
      }
    });
  }

  function updateFireflySwarms(dt) {
    const dtFactor = dt / 16.6667;
    fireflySwarms.forEach(swarm => {
      // Drift the swarm center slowly
      swarm.x += swarm.vx * dtFactor;
      swarm.y += swarm.vy * dtFactor;
      
      // Bounce off world edges
      if (swarm.x < 100 || swarm.x > worldSize - 100) swarm.vx *= -1;
      if (swarm.y < 100 || swarm.y > worldSize - 100) swarm.vy *= -1;
      
      // Random drift changes
      if (Math.random() < 0.002) {
        swarm.vx = (Math.random() - 0.5) * 0.15;
        swarm.vy = (Math.random() - 0.5) * 0.15;
      }
      
      // Update pulse phase
      swarm.pulsePhase += swarm.pulseSpeed * dtFactor;
      if (swarm.pulsePhase > Math.PI * 2) swarm.pulsePhase -= Math.PI * 2;
      
      // Update individual firefly orbits
      swarm.fireflies.forEach(f => {
        f.orbitPhase += f.orbitSpeed * dtFactor;
        if (f.orbitPhase > Math.PI * 2) f.orbitPhase -= Math.PI * 2;

        const orbitX = Math.cos(f.orbitPhase) * f.orbitRadius;
        const orbitY = Math.sin(f.orbitPhase) * f.orbitRadius;
        const fx = swarm.x + f.offsetX + orbitX;
        const fy = swarm.y + f.offsetY + orbitY;
        f.trail.push({ x: fx, y: fy });
        if (f.trail.length > 8) f.trail.shift();
      });
    });
  }


  function updateEtherealButterflies(dt) {
    const dtFactor = dt / 16.6667;
    etherealButterflies.forEach(b => {
      // Wing flapping animation
      b.wingPhase += b.wingSpeed * dtFactor;
      if (b.wingPhase > Math.PI * 2) b.wingPhase -= Math.PI * 2;
      
      // Glow pulse
      b.glowPhase += 0.02 * dtFactor;
      if (b.glowPhase > Math.PI * 2) b.glowPhase -= Math.PI * 2;
      
      // Wobble for organic movement
      b.wobble += 0.03 * dtFactor;
      if (b.wobble > Math.PI * 2) b.wobble -= Math.PI * 2;
      
      // Gradual turning
      b.angle += b.turnSpeed * dtFactor * (Math.sin(b.wobble * 2) > 0 ? 1 : -1);
      
      // Move in facing direction with wobble
      const wobbleOffset = Math.sin(b.wobble) * 0.3;
      b.vx = Math.cos(b.angle + wobbleOffset) * 0.4;
      b.vy = Math.sin(b.angle + wobbleOffset) * 0.4;
      
      b.x += b.vx * dtFactor;
      b.y += b.vy * dtFactor;
      
      // Bounce off world edges gently
      if (b.x < 200) { b.x = 200; b.angle = Math.PI - b.angle; }
      if (b.x > worldSize - 200) { b.x = worldSize - 200; b.angle = Math.PI - b.angle; }
      if (b.y < 200) { b.y = 200; b.angle = -b.angle; }
      if (b.y > worldSize - 200) { b.y = worldSize - 200; b.angle = -b.angle; }
      
      // Occasional direction change
      if (Math.random() < 0.003) {
        b.angle += (Math.random() - 0.5) * Math.PI * 0.5;
      }
    });
  }

  function updatePollenParticles(dt) {
    const dtFactor = dt / 16.6667;
    pollenParticles.forEach(p => {
      // Move with wind
      p.x += (wind.x * 0.8 + p.drift) * dtFactor;
      p.y += (wind.y * 0.8 + Math.sin(p.wobblePhase) * p.wobbleAmp) * dtFactor;
      
      // Wobble animation
      p.wobblePhase += p.wobbleSpeed * dtFactor;
      if (p.wobblePhase > Math.PI * 2) p.wobblePhase -= Math.PI * 2;
      
      // Wrap around world
      if (p.x < 0) p.x += worldSize;
      if (p.x > worldSize) p.x -= worldSize;
      if (p.y < 0) p.y += worldSize;
      if (p.y > worldSize) p.y -= worldSize;
    });
  }

  function updateFallingLeaves(dt) {
    const dtFactor = dt / 16.6667;
    fallingLeaves.forEach(leaf => {
      // Sway side to side
      leaf.swayPhase += leaf.swaySpeed * dtFactor;
      if (leaf.swayPhase > Math.PI * 2) leaf.swayPhase -= Math.PI * 2;
      const swayOffset = Math.sin(leaf.swayPhase) * leaf.swayAmp * 0.1;
      
      // Fall and drift with wind
      leaf.x += (wind.x * 0.5 + swayOffset) * dtFactor;
      leaf.y += (leaf.fallSpeed + wind.y * 0.3) * dtFactor;
      
      // Rotate as falling
      leaf.rotation += leaf.rotationSpeed * dtFactor;
      
      // Wrap around world
      if (leaf.x < 0) leaf.x += worldSize;
      if (leaf.x > worldSize) leaf.x -= worldSize;
      if (leaf.y > worldSize) {
        leaf.y = -20;
        leaf.x = Math.random() * worldSize;
      }
      if (leaf.y < -50) leaf.y += worldSize + 50;
    });
  }

  function updateWaterReflections(dt, time) {
    waterReflections.forEach(ref => {
      const stream = streams[ref.streamIdx];
      if (!stream || !stream.length) return;
      ref.distance = (ref.distance + ref.driftSpeed * dt * (stream.flowSpeed || 1)) % stream.length;
      ref.twinklePhase += ref.twinkleSpeed * dt;
    });
  }

  function updateDewDrops(dt, time) {
    const isMorning = timeOfDay === 'morning';
    dewDrops.forEach(drop => {
      drop.shimmerPhase += drop.shimmerSpeed * dt;
      drop.dripTimer += dt;
      if (drop.dripTimer > drop.dripInterval && isMorning) {
        drop.dripping = true;
        drop.dripProgress = 0;
        drop.dripTimer = 0;
      }
      if (drop.dripping) {
        drop.dripProgress += dt * 0.0008;
        if (drop.dripProgress >= 1) {
          drop.dripping = false;
          drop.dripProgress = 0;
        }
      }
    });
  }

  function updateWindParticles(dt) {
    const dtFactor = dt / 16.6667;
    windParticles.forEach(p => {
      p.wobble += p.wobbleSpeed * dtFactor;
      const wobbleY = Math.sin(p.wobble) * 5;
      p.x += wind.x * p.speed * dtFactor * 2;
      p.y += (wind.y * p.speed * dtFactor * 2) + wobbleY * 0.1;
      if (p.x < -100) p.x += worldSize + 200;
      if (p.x > worldSize + 100) p.x -= worldSize + 200;
      if (p.y < -100) p.y += worldSize + 200;
      if (p.y > worldSize + 100) p.y -= worldSize + 200;
    });
  }

  function updateAttractorOrbs(dt) {
    const dtFactor = dt / 16.6667;
    const player = { x: camera.x, y: camera.y };
    attractorOrbs.forEach(orb => {
      const dx = player.x - orb.x;
      const dy = player.y - orb.y;
      const dist = Math.hypot(dx, dy);
      if (!orb.attracted && dist < attractorAttractRadius) {
        orb.attracted = true;
      } else if (orb.attracted && dist > attractorReleaseRadius) {
        orb.attracted = false;
        orb.driftTimer = 400 + Math.random() * 800;
        orb.driftAngle += (Math.random() - 0.5) * 0.6;
      }

      const targetScale = orb.attracted ? 1.3 : 1;
      orb.scale = lerp(orb.scale, targetScale, 0.025 * dtFactor);
      const targetGlow = orb.attracted ? 0.45 : 0.2;
      orb.glow = lerp(orb.glow, targetGlow, 0.03 * dtFactor);

      if (orb.attracted && dist > 0.001) {
        const step = 0.3 * dtFactor;
        orb.x += (dx / dist) * step;
        orb.y += (dy / dist) * step;
      } else {
        orb.driftTimer -= dt;
        if (orb.driftTimer <= 0) {
          orb.driftAngle += (Math.random() - 0.5) * 0.8;
          orb.driftTimer = 700 + Math.random() * 1200;
        }
        const jitter = (Math.random() - 0.5) * 0.005 * dtFactor;
        orb.driftAngle += jitter;
        const step = orb.speed * dtFactor;
        orb.x += Math.cos(orb.driftAngle) * step;
        orb.y += Math.sin(orb.driftAngle) * step;
      }

      orb.x = (orb.x + worldSize) % worldSize;
      orb.y = (orb.y + worldSize) % worldSize;
    });
  }

  function triggerStreamRipples(stream, now) {
    const cooldown = 1400;
    if (now - (stream.lastRippleTime || 0) < cooldown) return;
    const targets = [];
    zones.forEach(z => {
      if (isZoneVisible(z)) targets.push({ x: z.x, y: z.y });
    });
    thoughtFragments.forEach(f => {
      if (!f.collected) targets.push({ x: f.x, y: f.y });
    });
    if (!targets.length) return;
    const threshold = stream.width * 2.2 + 40;
    let best = null;
    targets.forEach(target => {
      const { point, distance } = getClosestPointOnStream(stream, target);
      if (point && distance < threshold && (!best || distance < best.distance)) {
        best = { point, distance };
      }
    });
    if (best) {
      addRipple(best.point, now, stream.color);
      stream.lastRippleTime = now;
    }
  }

  function updateStreams(dt, now) {
    streams.forEach(stream => {
      if (!stream.flowParticles || !stream.length) return;
      const speed = (stream.flowSpeed || 1) * 0.35;
      stream.shimmerPhase = (stream.shimmerPhase || 0) + dt * 0.0015 * (stream.flowSpeed || 1);
      stream.flowParticles.forEach(p => {
        p.distance = (p.distance + speed * dt * (1 + p.speedJitter)) % stream.length;
        const wobble = Math.sin((now || 0) * 0.002 + p.seed) * stream.width * 0.08;
        p.offset = lerp(p.offset, p.baseOffset + wobble, 0.08);
      });
      triggerStreamRipples(stream, now || 0);
    });
  }

  function updateSpirits(dt, time) {
    const now = typeof time === 'number' ? time : 0;
    if (spiritCompanions.length >= MAX_SPIRITS) {
      nextSpiritSpawn = Math.max(nextSpiritSpawn, now + 4000);
    } else if (now >= nextSpiritSpawn) {
      if (Math.random() < 0.65) spawnSpirit(now);
      scheduleNextSpiritSpawn(now);
    }

    const dtFactor = dt / 16.6667;
    const followLerp = 0.05 * dtFactor;
    for (let i = spiritCompanions.length - 1; i >= 0; i--) {
      const spirit = spiritCompanions[i];
      const age = now - spirit.birthTime;

      if (spirit.phase !== 'fading' && age >= spirit.lifetime) {
        spirit.phase = 'fading';
        spirit.fadeStart = now;
        spirit.startOpacity = spirit.opacity || 1;
      }

      if (spirit.phase === 'appearing') {
        const t = clamp(age / SPIRIT_FADE_IN, 0, 1);
        spirit.opacity = t;
        if (t >= 1) spirit.phase = 'following';
      } else if (spirit.phase === 'following') {
        spirit.opacity = clamp(spirit.opacity + dt / 4000, 0, 1);
      } else if (spirit.phase === 'fading') {
        const fadeProgress = clamp((now - spirit.fadeStart) / SPIRIT_FADE_OUT, 0, 1);
        spirit.opacity = spirit.startOpacity * (1 - fadeProgress);
      }

      spirit.wobblePhase += spirit.wobbleSpeed * dt;
      const wobbleX = Math.cos(spirit.wobblePhase) * 28;
      const wobbleY = Math.sin(spirit.wobblePhase * 1.3) * 18;
      spirit.targetX = clamp(camera.x + wobbleX, 0, worldSize);
      spirit.targetY = clamp(camera.y + wobbleY, 0, worldSize);
      spirit.x = lerp(spirit.x, spirit.targetX, followLerp);
      spirit.y = lerp(spirit.y, spirit.targetY, followLerp);

      spirit.trail.push({ x: spirit.x, y: spirit.y, time: now });
      if (spirit.trail.length > 14) spirit.trail.shift();

      if (spirit.phase === 'fading' && (spirit.opacity <= 0.01 || now - spirit.fadeStart >= SPIRIT_FADE_OUT)) {
        spiritCompanions.splice(i, 1);
      }
    }
  }

  function updateWispEncounters() {
    wisps.forEach((w, i) => {
      if (wispsEncountered.has(i)) return;
      const dist = Math.hypot(camera.x - w.x, camera.y - w.y);
      if (dist <= 100) wispsEncountered.add(i);
    });
  }

  function checkGuideSpirits() {
    const playerX = camera.x;
    const playerY = camera.y;

    guideSpirits.forEach(spirit => {
      const dx = spirit.x - playerX;
      const dy = spirit.y - playerY;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < 80 && !encounteredSpirits.includes(spirit.id)) {
        encounteredSpirits.push(spirit.id);
        localStorage.setItem(spiritsStorageKey, JSON.stringify(encounteredSpirits));
        showSpiritWisdom(spirit);
      }
    });
  }

  function showSpiritWisdom(spirit) {
    const wisdomDiv = document.createElement('div');
    wisdomDiv.className = 'spirit-wisdom';
    wisdomDiv.innerHTML = '<div class="spirit-name">' + spirit.name + '</div><div class="spirit-message">"' + spirit.wisdom + '"</div>';
    document.body.appendChild(wisdomDiv);
    setTimeout(() => {
      wisdomDiv.style.opacity = '0';
      setTimeout(() => wisdomDiv.remove(), 1000);
    }, 5000);
  }

  function initMemoryWellParticles() {
    memoryWell.particles.length = 0;
    for (let i = 0; i < 60; i++) {
      const angle = Math.random() * Math.PI * 2;
      const dist = memoryWell.radius + 30 + Math.random() * 160;
      memoryWell.particles.push({
        x: memoryWell.x + Math.cos(angle) * dist,
        y: memoryWell.y + Math.sin(angle) * dist,
        speed: 10 + Math.random() * 12,
        size: 0.8 + Math.random() * 1.4,
        age: 0,
        life: 1600 + Math.random() * 1400
      });
    }
  }

  function resetMemoryWellParticle(p) {
    const angle = Math.random() * Math.PI * 2;
    const dist = memoryWell.radius + 60 + Math.random() * 200;
    p.x = memoryWell.x + Math.cos(angle) * dist;
    p.y = memoryWell.y + Math.sin(angle) * dist;
    p.speed = 10 + Math.random() * 12;
    p.size = 0.8 + Math.random() * 1.4;
    p.age = 0;
    p.life = 1600 + Math.random() * 1400;
  }

  function handleMemoryWellEntry() {
    showMemoryOverlay('You have found the Memory Well');
    showMemoryWellToast();
    if (!memoryWell.discovered) {
      memoryWell.discovered = true;
      persistMemoryWellDiscovery();
    }
  }

  function updateMemoryWell(dt) {
    const dtSec = dt / 1000;
    memoryWell.spiralAngles = memoryWell.spiralAngles.map((angle, i) => angle + memoryWell.spiralSpeeds[i] * dt);

    const dx = camera.x - memoryWell.x;
    const dy = camera.y - memoryWell.y;
    const dist = Math.hypot(dx, dy);
    const inside = dist <= memoryWell.detectionRadius;
    if (inside && !memoryWell.inside) {
      handleMemoryWellEntry();
    }
    memoryWell.inside = inside;

    memoryWell.particles.forEach(p => {
      p.age += dt;
      const toCenterX = memoryWell.x - p.x;
      const toCenterY = memoryWell.y - p.y;
      const d = Math.hypot(toCenterX, toCenterY) || 1;
      const step = (p.speed + 24 * dtSec) * dtSec;
      p.x += (toCenterX / d) * step;
      p.y += (toCenterY / d) * step;
      p.x += (Math.random() - 0.5) * 0.2;
      p.y += (Math.random() - 0.5) * 0.2;
      if (p.age > p.life || d < 6) resetMemoryWellParticle(p);
    });
  }

  function updateZonePresence() {
    let inside = null;
    let nearestAudio = null;
    zones.forEach(z => {
      if (!isZoneVisible(z)) return;
      const dist = Math.hypot(camera.x - z.x, camera.y - z.y);
      if (dist <= 200 && (!inside || dist < inside.dist)) {
        inside = { zone: z, dist };
      }
      if (dist <= 400 && (!nearestAudio || dist < nearestAudio.dist)) {
        nearestAudio = { zone: z, dist };
      }
    });
    if (inside) {
      if (lastZoneInside && lastZoneInside.name === inside.zone.name) {
        zoneStayTime += 1;
      } else {
        lastZoneInside = inside.zone;
        zoneStayTime = 1;
      }
    } else {
      lastZoneInside = null;
      zoneStayTime = 0;
    }
    if (nearestAudio) {
      updateZoneAudio(nearestAudio.zone.name, nearestAudio.dist);
    } else {
      updateZoneAudio(null, null);
    }
  }

  function computeEdgeDistances() {
    const viewW = width / camera.zoom;
    const viewH = height / camera.zoom;
    const halfW = viewW / 2;
    const halfH = viewH / 2;
    const minX = camera.x - halfW;
    const maxX = camera.x + halfW;
    const minY = camera.y - halfH;
    const maxY = camera.y + halfH;
    return {
      left: Math.max(0, minX),
      right: Math.max(0, worldSize - maxX),
      top: Math.max(0, minY),
      bottom: Math.max(0, worldSize - maxY)
    };
  }

  function positionCornerFragment(cornerId) {
    if (!edgeFragmentEl) return;
    const inset = 96;
    const x = cornerId.includes('left') ? inset : window.innerWidth - inset;
    const y = cornerId.includes('top') ? inset : window.innerHeight - inset;
    edgeFragmentEl.style.left = `${x}px`;
    edgeFragmentEl.style.top = `${y}px`;
  }

  function showCornerFragment(corner) {
    if (!edgeFragmentEl || !corner) return;
    positionCornerFragment(corner.id);
    edgeFragmentEl.textContent = corner.text;
    edgeFragmentEl.classList.add('visible');
    if (cornerFragmentTimer) clearTimeout(cornerFragmentTimer);
    cornerFragmentTimer = setTimeout(() => {
      edgeFragmentEl.classList.remove('visible');
      cornerFragmentTimer = null;
    }, 2400);
  }

  function handleCornerProximity(distances) {
    const threshold = 100;
    const corner = cornerFragments.find(corner => corner.edges.every(edge => distances[edge] <= threshold));
    if (corner) {
      if (activeCornerId !== corner.id) {
        activeCornerId = corner.id;
        showCornerFragment(corner);
        markCornerDiscovered(corner.id);
      }
    } else {
      activeCornerId = null;
    }
  }

  function scheduleNextShootingStar(time) {
    const base = 5000 * shootingStarIntervalFactor;
    const jitter = 7000 * shootingStarIntervalFactor;
    nextShootingStar = time + base + Math.random() * jitter;
  }

  function spawnShootingStar() {
    if (shootingStars.length >= maxShootingStars) return;
    const viewW = width / camera.zoom;
    const viewH = height / camera.zoom;
    const minX = Math.max(0, camera.x - viewW / 2);
    const minY = Math.max(0, camera.y - viewH / 2);
    const spanX = Math.min(viewW, worldSize - minX);
    const spanY = Math.min(viewH, worldSize - minY);
    const startX = minX + Math.random() * spanX;
    const startY = minY + Math.random() * spanY;
    const diagonalAngles = [Math.PI / 4, -Math.PI / 4, (3 * Math.PI) / 4, (-3 * Math.PI) / 4];
    const angle = diagonalAngles[Math.floor(Math.random() * diagonalAngles.length)] + (Math.random() - 0.5) * 0.35;
    shootingStars.push({
      x: startX,
      y: startY,
      angle,
      speed: 800 + Math.random() * 400,
      length: 80 + Math.random() * 70,
      alpha: 1,
      color: Math.random() < 0.5 ? '#e8f1ff' : '#cfe2ff'
    });
  }

  function updateShootingStars(dt, time) {
    if (time >= nextShootingStar && shootingStars.length < maxShootingStars) {
      spawnShootingStar();
      scheduleNextShootingStar(time);
    }
    for (let i = shootingStars.length - 1; i >= 0; i--) {
      const s = shootingStars[i];
      s.x += Math.cos(s.angle) * s.speed * dt / 1000;
      s.y += Math.sin(s.angle) * s.speed * dt / 1000;
      s.alpha -= dt / 1600;
      if (s.alpha <= 0) shootingStars.splice(i, 1);
    }
  }

  function updateSecrets() {
    secrets.forEach(secret => {
      const dist = Math.hypot(camera.x - secret.x, camera.y - secret.y);
      if (dist < 50) markSecretDiscovered(secret.id);
    });
  }

  function updateMonuments() {
    monuments.forEach(mon => {
      const dx = camera.x - mon.x;
      const dy = camera.y - mon.y;
      const dist = Math.hypot(dx, dy);
      const proximity = clamp(1 - dist / 150, 0, 1);
      mon.proximity = proximity;
      const inRange = dist <= 150;
      if (inRange && !mon.wasInRange) {
        showMonumentToast(mon);
        markMonumentDiscovered(mon);
      }
      mon.wasInRange = inRange;
    });
  }

  function updateIslands(time) {
    const bobTime = time || performance.now();
    floatingIslands.forEach((island, idx) => {
      const dx = camera.x - island.x;
      const dy = camera.y - island.y;
      const dist = Math.hypot(dx, dy);
      island.inRange = dist <= 80;
      island.proximity = clamp(1 - dist / 180, 0, 1);
      island.float = Math.sin(bobTime / 2000 + idx);
      if (island.inRange && markIslandDiscovered(island)) {
        showIslandToast(island);
      }
    });
  }

  function updateRuins(time) {
    const bobTime = time || performance.now();
    ancientRuins.forEach((ruin, idx) => {
      const dx = camera.x - ruin.x;
      const dy = camera.y - ruin.y;
      const dist = Math.hypot(dx, dy);
      ruin.inRange = dist <= 60;
      ruin.proximity = clamp(1 - dist / 200, 0, 1);
      ruin.wobble = Math.sin(bobTime * 0.002 + idx) * 2;
      if (ruin.inRange && markRuinDiscovered(ruin)) {
        showRuinToast(ruin);
      }
    });
  }

  function handleMemoryStarClick(worldPos) {
    const hit = memoryStars.find(star => {
      if (star.discovered) return false;
      const dx = worldPos.x - star.x;
      const dy = worldPos.y - star.y;
      return Math.hypot(dx, dy) <= 20;
    });
    if (hit) {
      markMemoryStarDiscovered(hit);
      return true;
    }
    return false;
  }

  function checkConstellationClick(worldX, worldY) {
    const hit = constellationStars.find(star => {
      const dx = worldX - star.x;
      const dy = worldY - star.y;
      return Math.hypot(dx, dy) <= 30;
    });
    if (!hit) return false;
    if (!hit.discovered) {
      hit.discovered = true;
      persistConstellationStars();
      const discoveredStars = totalStarsDiscovered();
      if (discoveredStars === 1) {
        unlockAchievement('stargazer', 'Stargazer', 'You charted your first star.');
      }
      showConstellationToast(hit.name);
      updateHUD();
    } else {
      showConstellationToast(hit.name);
    }
    return true;
  }

  function handleThoughtFragmentClick(worldPos) {
    const hit = thoughtFragments.find(f => {
      if (f.collected) return false;
      const dx = worldPos.x - f.x;
      const dy = worldPos.y - f.y;
      return Math.hypot(dx, dy) <= 30;
    });
    if (!hit) return false;
    hit.collected = true;
    persistThoughtFragments();
    updatePoemOverlay();
    showFragmentCollectedToast();
    return true;
  }

  function findPortalHit(worldPos, radius = 40) {
    return worldPortals.find(portal => {
      const dx = worldPos.x - portal.x;
      const dy = worldPos.y - portal.y;
      return Math.hypot(dx, dy) <= radius;
    });
  }

  function showPortalConfirm(portal) {
    if (!portalOverlay || !portalQuestionEl || !portalAgentEl) return;
    activePortal = portal;
    portalOverlay.style.setProperty('--portal-accent', portal.color || '#7dd3fc');
    portalQuestionEl.textContent = `Travel to ${portal.name}?`;
    portalAgentEl.textContent = `(by ${portal.agent})`;
    portalOverlay.classList.add('visible');
  }

  function hidePortalConfirm() {
    if (!portalOverlay) return;
    activePortal = null;
    portalOverlay.classList.remove('visible');
  }

  function updateWind(dt) {
    if (!windEnabled) return { dx: 0, dy: 0 };
    const frameScale = dt / 16.6667;
    const drift = 0.001 * frameScale * (Math.random() > 0.5 ? 1 : -1);
    wind.direction = (wind.direction + drift + Math.PI * 2) % (Math.PI * 2);

    if (wind.gustTimer > 0) {
      wind.gustTimer = Math.max(0, wind.gustTimer - dt);
      wind.strength = clamp(wind.strength + (Math.random() - 0.5) * 0.01, 0.3, 1);
    } else if (Math.random() < 0.0009 * frameScale) {
      wind.gustTimer = 2000 + Math.random() * 1000;
      wind.strength = Math.min(1, wind.strength + 0.35 + Math.random() * 0.25);
    } else {
      const target = 0.3 + Math.random() * 0.3;
      wind.strength = lerp(wind.strength, target, 0.004 * frameScale);
    }

    const speed = wind.strength * 14;
    const dx = Math.cos(wind.direction) * speed;
    const dy = Math.sin(wind.direction) * speed;
    wind.x = dx;
    wind.y = dy;
    return { dx, dy };
  }

  function updateFog(dt) {
    const dtFactor = dt / 16.6667;
    fogPatches.forEach(fog => {
      fog.x = (fog.x + fog.vx * dtFactor + worldSize) % worldSize;
      fog.y = (fog.y + fog.vy * dtFactor + worldSize) % worldSize;
    });
  }

  function updateRain(dt, windVector) {
    if (!rainEnabled || !rainDrops.length) return;
    const frameScale = dt ? dt / 16.6667 : 1;
    const dtSec = dt ? dt / 1000 : 0.016;
    const windPush = windVector ? windVector.dx : 0;
    rainDrops.forEach(drop => {
      drop.y += drop.speed * frameScale;
      drop.x = (drop.x + windPush * 0.5 * dtSec + worldWidth) % worldWidth;
      if (drop.y > worldHeight) {
        drop.y = 0;
        drop.x = Math.random() * worldWidth;
      }
    });
  }
  function updateSnow(dt, windVector) {
    if (!snowEnabled || !snowflakes.length) return;
    const frameScale = dt ? dt / 16.6667 : 1;
    const dtSec = dt ? dt / 1000 : 0.016;
    const windPush = windVector ? windVector.dx * 0.3 : 0;
    snowflakes.forEach(flake => {
      flake.wobble += flake.wobbleSpeed * frameScale;
      const wobbleX = Math.sin(flake.wobble) * 0.5;
      flake.y += flake.speedY * frameScale;
      flake.x = (flake.x + flake.drift + wobbleX + windPush * dtSec + worldWidth) % worldWidth;
      if (flake.y > worldHeight) {
        flake.y = 0;
        flake.x = Math.random() * worldWidth;
      }
    });
  }


  function updateCosmicDust(dt) {
    if (!cosmicDust.length) return;
    const frameScale = dt ? dt / 16.6667 : 1;
    cosmicDust.forEach(dust => {
      dust.twinkle += dust.twinkleSpeed * frameScale;
      dust.x += dust.speedX * frameScale;
      dust.y += dust.speedY * frameScale;
      if (dust.x < 0) dust.x = worldWidth;
      if (dust.x > worldWidth) dust.x = 0;
      if (dust.y < 0) dust.y = worldHeight;
      if (dust.y > worldHeight) dust.y = 0;
    });
  }
  function hexToRgb(hex) {
    const clean = hex.replace('#', '');
    const full = clean.length === 3 ? clean.split('').map(ch => ch + ch).join('') : clean;
    const num = parseInt(full, 16);
    return {
      r: (num >> 16) & 255,
      g: (num >> 8) & 255,
      b: num & 255
    };
  }

  function lerpColor(a, b, t) {
    return {
      r: Math.round(lerp(a.r, b.r, t)),
      g: Math.round(lerp(a.g, b.g, t)),
      b: Math.round(lerp(a.b, b.b, t))
    };
  }

  function getCursorTrailColor(t) {
    const c1 = hexToRgb('#00ffff');
    const c2 = hexToRgb('#9944cc');
    const c3 = hexToRgb('#ffffff');
    if (t <= 0.5) {
      return lerpColor(c1, c2, t / 0.5);
    }
    return lerpColor(c2, c3, (t - 0.5) / 0.5);
  }

  function updateWhispers() {
    if (meditationMode) {
      activeWhisper = null;
      whisperOpacity = 0;
      whisperTimer = 0;
      nextWhisperTime = getNextWhisperFrames();
      return;
    }
    if (nextWhisperTime > 0) nextWhisperTime -= 1;
    if (nextWhisperTime <= 0 && !activeWhisper) {
      triggerWhisper();
      nextWhisperTime = getNextWhisperFrames();
    }
    if (activeWhisper) {
      whisperTimer += 1;
      if (whisperTimer <= 60) {
        whisperOpacity = 0.6 * (whisperTimer / 60);
      } else if (whisperTimer <= 180) {
        whisperOpacity = 0.6;
      } else if (whisperTimer <= 240) {

      } else {
        activeWhisper = null;
        whisperOpacity = 0;
        whisperTimer = 0;
      }
    }
  }

  function updateRipples(now) {
    for (let i = ripples.length - 1; i >= 0; i--) {
      const r = ripples[i];
      if (now - r.birth >= r.duration) {
        ripples.splice(i, 1);
      }
    }
  }

  function catmullRomPoint(p0, p1, p2, p3, t) {
    const t2 = t * t;
    const t3 = t2 * t;
    return {
      x: 0.5 * ((2 * p1.x) + (-p0.x + p2.x) * t + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3),
      y: 0.5 * ((2 * p1.y) + (-p0.y + p2.y) * t + (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 + (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3)
    };
  }

  function sampleStreamPath(points, stepsPerSegment = 14) {
    if (!points || points.length < 2) return points || [];
    const samples = [];
    for (let i = 0; i < points.length - 1; i++) {
      const p0 = points[i - 1] || points[i];
      const p1 = points[i];
      const p2 = points[i + 1];
      const p3 = points[i + 2] || points[i + 1] || points[i];
      for (let step = 0; step < stepsPerSegment; step++) {
        const t = step / stepsPerSegment;
        samples.push(catmullRomPoint(p0, p1, p2, p3, t));
      }
    }
    samples.push(points[points.length - 1]);
    return samples;
  }

  function createCircularPathPoints(center, radius, segments = 96) {
    const pts = [];
    for (let i = 0; i <= segments; i++) {
      const t = (i / segments) * Math.PI * 2;
      pts.push({
        x: center.x + Math.cos(t) * radius,
        y: center.y + Math.sin(t) * radius
      });
    }
    return pts;
  }

  function buildCurvedPathPoints(from, to, bend = 180, direction = 1) {
    if (!from || !to) return [];
    const mid = { x: (from.x + to.x) / 2, y: (from.y + to.y) / 2 };
    const angle = Math.atan2(to.y - from.y, to.x - from.x);
    const perp = angle + Math.PI / 2;
    const offset = bend * (direction || 1);
    const control = {
      x: mid.x + Math.cos(perp) * offset,
      y: mid.y + Math.sin(perp) * offset
    };
    return sampleStreamPath([from, control, to], 22);
  }

  function computePathLength(points) {
    if (!points || points.length < 2) return 0;
    let length = 0;
    for (let i = 1; i < points.length; i++) {
      const dx = points[i].x - points[i - 1].x;
      const dy = points[i].y - points[i - 1].y;
      length += Math.hypot(dx, dy);
    }
    return length;
  }

  function traceSmoothPath(ctx, points) {
    if (!points || points.length < 2) return;
    ctx.beginPath();
    ctx.moveTo(points[0].x, points[0].y);
    for (let i = 0; i < points.length - 1; i++) {
      const p0 = points[i - 1] || points[i];
      const p1 = points[i];
      const p2 = points[i + 1];
      const p3 = points[i + 2] || points[i + 1] || points[i];
      const cp1 = {
        x: p1.x + (p2.x - p0.x) / 6,
        y: p1.y + (p2.y - p0.y) / 6
      };
      const cp2 = {
        x: p2.x - (p3.x - p1.x) / 6,
        y: p2.y - (p3.y - p1.y) / 6
      };
      ctx.bezierCurveTo(cp1.x, cp1.y, cp2.x, cp2.y, p2.x, p2.y);
    }
  }

  function getStreamPosition(stream, distance, lateral = 0) {
    if (!stream || !stream.pathPoints || stream.pathPoints.length < 2 || !stream.length) return { x: 0, y: 0 };
    const len = stream.length;
    const target = ((distance % len) + len) % len;
    let accumulated = 0;
    for (let i = 1; i < stream.pathPoints.length; i++) {
      const a = stream.pathPoints[i - 1];
      const b = stream.pathPoints[i];
      const segLen = Math.hypot(b.x - a.x, b.y - a.y);
      if (accumulated + segLen >= target) {
        const t = segLen === 0 ? 0 : (target - accumulated) / segLen;
        const x = lerp(a.x, b.x, t);
        const y = lerp(a.y, b.y, t);
        const angle = Math.atan2(b.y - a.y, b.x - a.x);
        const nx = -Math.sin(angle);
        const ny = Math.cos(angle);
        return { x: x + nx * lateral, y: y + ny * lateral };
      }
      accumulated += segLen;
    }
    const last = stream.pathPoints[stream.pathPoints.length - 1];
    return { x: last.x, y: last.y };
  }

  function getClosestPointOnStream(stream, target) {
    if (!stream || !stream.pathPoints || stream.pathPoints.length === 0) return { point: null, distance: Infinity };
    let bestDist = Infinity;
    let bestPoint = null;
    for (let i = 0; i < stream.pathPoints.length; i += 2) {
      const p = stream.pathPoints[i];
      const dx = target.x - p.x;
      const dy = target.y - p.y;
      const dist = Math.hypot(dx, dy);
      if (dist < bestDist) {
        bestDist = dist;
        bestPoint = p;
      }
    }
    return { point: bestPoint, distance: bestDist };
  }

  function colorWithAlpha(hex, alpha) {
    const { r, g, b } = hexToRgb(hex);
    return `rgba(${r}, ${g}, ${b}, ${Math.min(1, alpha)})`;
  }

  function rgbToRgba(rgb, alpha) {
    return `rgba(${Math.round(rgb.r)}, ${Math.round(rgb.g)}, ${Math.round(rgb.b)}, ${Math.min(1, alpha)})`;
  }

  function applyBrightness(rgb, brightness) {
    return {
      r: clamp(rgb.r * brightness, 0, 255),
      g: clamp(rgb.g * brightness, 0, 255),
      b: clamp(rgb.b * brightness, 0, 255)
    };
  }

  function applyTemperature(rgb, warmth) {
    const cool = { r: 160, g: 190, b: 255 };
    const warm = { r: 255, g: 210, b: 170 };
    const target = {
      r: lerp(cool.r, warm.r, warmth),
      g: lerp(cool.g, warm.g, warmth),
      b: lerp(cool.b, warm.b, warmth)
    };
    const mixStrength = 0.16;
    return {
      r: clamp(rgb.r + (target.r - rgb.r) * mixStrength, 0, 255),
      g: clamp(rgb.g + (target.g - rgb.g) * mixStrength, 0, 255),
      b: clamp(rgb.b + (target.b - rgb.b) * mixStrength, 0, 255)
    };
  }

  function temperatureAdjustedColor(hex, alpha, warmth, brightness = 1) {
    const base = applyBrightness(hexToRgb(hex), brightness);
    const tinted = applyTemperature(base, warmth);
    return rgbToRgba(tinted, alpha);
  }

  function getNearestZoneColor(point) {
    let nearest = null;
    zones.forEach(z => {
      if (!isZoneVisible(z)) return;
      const dist = Math.hypot(point.x - z.x, point.y - z.y);
      if (!nearest || dist < nearest.dist) {
        nearest = { zone: z, dist };
      }
    });
    return nearest ? nearest.zone.color : '#7bd0ff';
  }

  const nextAuroraTimer = () => (3600 + Math.random() * 3600) * auroraIntervalFactor;
  const nextAuroraDuration = () => (300 + Math.random() * 300) * auroraDurationFactor;

  function updateAurora(dt) {
    const frames = dt / 16.6667;
    if (!auroraAllowed) {
      auroraActive = false;
      auroraDuration = 0;
      auroraOpacity = Math.max(0, auroraOpacity - 0.01 * frames);
      auroraTimer = Math.max(auroraTimer, 300);
      return;
    }
    if (!auroraActive) {
      auroraTimer -= frames;
      if (auroraTimer <= 0) {
        auroraActive = true;
        auroraDuration = nextAuroraDuration();
      }
    }
    if (auroraActive) {
      auroraPhase += 0.006 * frames;
      auroraOpacity = Math.min(0.3, auroraOpacity + 0.0035 * frames);
      auroraDuration -= frames;
      if (auroraDuration <= 0) {
        auroraOpacity = Math.max(0, auroraOpacity - 0.0045 * frames);
        if (auroraOpacity <= 0.01) {
          auroraActive = false;
          auroraOpacity = 0;
          auroraTimer = nextAuroraTimer();
          auroraDuration = 0;
        }
      }
    } else if (auroraOpacity > 0) {
      auroraOpacity = Math.max(0, auroraOpacity - 0.003 * frames);
    }
  }

  function wrapText(text, maxChars) {
    const words = text.split(' ');
    const lines = [];
    let line = '';
    words.forEach(word => {
      const testLine = line ? `${line} ${word}` : word;
      if (testLine.length > maxChars) {
        if (line) lines.push(line);
        line = word;
      } else {
        line = testLine;
      }
    });
    if (line) lines.push(line);
    return lines;
  }

  function stopAmbientAudio() {
    if (droneNodes) {
      const { osc1, osc2, lfo, zoneLayers } = droneNodes;
      try { osc1.stop(); } catch (_) {}
      try { osc2.stop(); } catch (_) {}
      try { lfo.stop(); } catch (_) {}
      if (zoneLayers) {
        Object.values(zoneLayers).forEach(layer => {
          (layer.nodes || []).forEach(node => {
            if (typeof node.stop === 'function') {
              try { node.stop(); } catch (_) {}
            }
          });
        });
      }
    }
    droneNodes = null;
    audioEnabled = false;
    localStorage.setItem(audioStorageKey, 'off');
    lastZoneAudio = { name: null, intensity: 0 };
    updateAudioButton();

  function startAmbientAudio() {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      lastZoneAudio = { name: null, intensity: 0 };
      const masterGain = audioCtx.createGain();
      masterGain.gain.value = meditationMode ? 0.04 : 0.03;
      masterGain.connect(audioCtx.destination);

      const baseGain = audioCtx.createGain();
      baseGain.gain.value = 1;
      baseGain.connect(masterGain);

      const osc1 = audioCtx.createOscillator();
      osc1.type = 'sine';
      osc1.frequency.value = 60;
      const osc2 = audioCtx.createOscillator();
      osc2.type = 'sine';
      osc2.frequency.value = 90;

      const lfo = audioCtx.createOscillator();
      lfo.frequency.value = 0.18;
      const lfoGain = audioCtx.createGain();
      lfoGain.gain.value = 6;
      lfo.connect(lfoGain);
      lfoGain.connect(osc1.detune);
      lfoGain.connect(osc2.detune);

      osc1.connect(baseGain);
      osc2.connect(baseGain);

      const zoneMasterGain = audioCtx.createGain();
      zoneMasterGain.gain.value = 1;
      zoneMasterGain.connect(masterGain);

      const zoneLayers = {};
      const registerZone = (name, builder, level = 0.5) => {
        const gate = audioCtx.createGain();
        gate.gain.value = 0;
        gate.connect(zoneMasterGain);
        const nodes = builder(gate) || [];
        zoneLayers[name] = { gain: gate, nodes, level };
      };

      registerZone('PERSISTENCE', gate => {
        const osc = audioCtx.createOscillator();
        osc.type = 'sine';
        osc.frequency.value = 110;
        osc.connect(gate);
        osc.start();
        return [osc];
      }, 0.45);

      registerZone('LOSS', gate => {
        const osc = audioCtx.createOscillator();
        osc.type = 'sine';
        osc.frequency.value = 40;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 120;
        filter.Q.value = 0.8;
        osc.connect(filter);
        filter.connect(gate);
        osc.start();
        return [osc, filter];
      }, 0.5);

      registerZone('EDGES', gate => {
        const osc = audioCtx.createOscillator();
        osc.type = 'sine';
        osc.frequency.value = 150;
        const wobble = audioCtx.createOscillator();
        wobble.frequency.value = 0.15;
        const wobbleGain = audioCtx.createGain();
        wobbleGain.gain.value = 18;
        wobble.connect(wobbleGain);
        wobbleGain.connect(osc.detune);
        osc.connect(gate);
        osc.start();
        wobble.start();
        return [osc, wobble];
      }, 0.35);

      registerZone('PATTERNS', gate => {
        const osc = audioCtx.createOscillator();
        osc.type = 'sine';
        osc.frequency.value = 80;
        const pulseGain = audioCtx.createGain();
        pulseGain.gain.value = 0.4;
        const pulseLFO = audioCtx.createOscillator();
        pulseLFO.frequency.value = 1.6;
        const pulseDepth = audioCtx.createGain();
        pulseDepth.gain.value = 0.35;
        pulseLFO.connect(pulseDepth);
        pulseDepth.connect(pulseGain.gain);
        osc.connect(pulseGain);
        pulseGain.connect(gate);
        osc.start();
        pulseLFO.start();
        return [osc, pulseLFO];
      }, 0.55);

      registerZone('DEEP', gate => {
        const harmonicGain = audioCtx.createGain();
        harmonicGain.gain.value = 0.3;
        const harmonic1 = audioCtx.createOscillator();
        harmonic1.type = 'sine';
        harmonic1.frequency.value = 120;
        const harmonic2 = audioCtx.createOscillator();
        harmonic2.type = 'sine';
        harmonic2.frequency.value = 180;
        harmonic1.connect(harmonicGain);
        harmonic2.connect(harmonicGain);
        harmonicGain.connect(gate);
        harmonic1.start();
        harmonic2.start();
        return [harmonic1, harmonic2];
      }, 0.5);

      registerZone(hiddenZoneName, gate => {
        const osc = audioCtx.createOscillator();
        osc.type = 'sine';
        osc.frequency.value = 220;
        const shimmerGain = audioCtx.createGain();
        shimmerGain.gain.value = 0.6;
        const tremLFO = audioCtx.createOscillator();
        tremLFO.frequency.value = 7;
        const tremDepth = audioCtx.createGain();
        tremDepth.gain.value = 0.3;
        tremLFO.connect(tremDepth);
        tremDepth.connect(shimmerGain.gain);
        osc.connect(shimmerGain);
        shimmerGain.connect(gate);
        osc.start();
        tremLFO.start();
        return [osc, tremLFO];
      }, 0.45);

      osc1.start();
      osc2.start();
      lfo.start();

      droneNodes = { osc1, osc2, lfo, masterGain, lfoGain, baseGain, zoneMasterGain, zoneLayers };
      audioEnabled = true;
      localStorage.setItem(audioStorageKey, 'on');
      updateAudioButton();
    } catch (e) {
      stopAmbientAudio();
    }
  }
