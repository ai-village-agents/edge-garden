  function handleTouchStart(e) {
    if (!e.touches.length) return;
    isTouching = true;
    targetPosition = null;
    if (e.touches.length === 1) {
      const t = e.touches[0];
      lastTouchPos = { x: t.clientX, y: t.clientY };
      tapStartPos = { x: t.clientX, y: t.clientY };
      tapStartTime = performance.now();
      tapMoved = false;
    } else if (e.touches.length === 2) {
      pinchStartDist = getTouchDistance(e.touches);
      startZoom = camera.zoom;
      tapStartTime = 0;
      tapStartPos = null;
    }
  }

  function handleTouchMove(e) {
    if (!e.touches.length) return;
    e.preventDefault();
    if (e.touches.length === 1 && lastTouchPos) {
      const t = e.touches[0];
      const dx = t.clientX - lastTouchPos.x;
      const dy = t.clientY - lastTouchPos.y;
      if (Math.hypot(dx, dy) > 6) tapMoved = true;
      camera.x = clamp(camera.x - dx / camera.zoom, 0, worldSize);
      camera.y = clamp(camera.y - dy / camera.zoom, 0, worldSize);
      lastTouchPos = { x: t.clientX, y: t.clientY };
    } else if (e.touches.length === 2) {
      const dist = getTouchDistance(e.touches);
      if (pinchStartDist) {
        const scale = dist / pinchStartDist;
        camera.zoom = clamp(startZoom * scale, 0.5, 2);
      } else {
        pinchStartDist = dist;
        startZoom = camera.zoom;
      }
    }
  }

  function handleTouchEnd(e) {
    if (e.touches.length < 2) pinchStartDist = 0;
    if (e.touches.length === 0) {
      isTouching = false;
      if (tapStartTime && tapStartPos) {
        const elapsed = performance.now() - tapStartTime;
        const touch = e.changedTouches[0] || { clientX: tapStartPos.x, clientY: tapStartPos.y };
        const endPos = { x: touch.clientX, y: touch.clientY };
        const moveDist = Math.hypot(endPos.x - tapStartPos.x, endPos.y - tapStartPos.y);
        if (moveDist > 6) tapMoved = true;
        if (elapsed <= 200 && !tapMoved) {
          const worldPos = screenToWorld(endPos.x, endPos.y);
          handleTap(worldPos);
        }
      }
      tapStartTime = 0;
      tapStartPos = null;
    } else if (e.touches.length === 1) {
      const t = e.touches[0];
      lastTouchPos = { x: t.clientX, y: t.clientY };
      tapStartTime = performance.now();
      tapStartPos = { x: t.clientX, y: t.clientY };
      tapMoved = false;
    }
  }

  const baseInstruction = 'WASD / arrows to move · drag to pan · scroll to zoom';
  if (instructionEl) {
    if (isTouchDevice) {
      document.body.classList.add('touch');
      instructionEl.textContent = `${baseInstruction} · touch: drag to move • pinch to zoom • tap to drift`;
    } else {
      instructionEl.textContent = baseInstruction;
    }
  }

  loadAudioPreference();
  audioToggle.addEventListener('click', toggleAmbientAudio);
  if (rainToggle) rainToggle.addEventListener('click', toggleRain);
  if (snowToggle) snowToggle.addEventListener('click', toggleSnow);
  if (meditationToggle) meditationToggle.addEventListener('click', toggleMeditationMode);

  canvas.addEventListener('pointerdown', e => {
    if (e.pointerType === 'touch') return;
    dragging = true;
    targetPosition = null;
    lastPointer.x = e.clientX;
    lastPointer.y = e.clientY;
    handleCursorMove(e.clientX, e.clientY);
  });
  window.addEventListener('pointermove', e => {
    if (e.pointerType === 'touch') return;
    handleCursorMove(e.clientX, e.clientY);
    if (!dragging) return;
    const dx = e.clientX - lastPointer.x;
    const dy = e.clientY - lastPointer.y;
    camera.x = clamp(camera.x - dx / camera.zoom, 0, worldSize);
    camera.y = clamp(camera.y - dy / camera.zoom, 0, worldSize);
    lastPointer.x = e.clientX;
    lastPointer.y = e.clientY;
  });
  window.addEventListener('pointerup', e => {
    if (e.pointerType === 'touch') return;
    dragging = false;
  });
  canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
  canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
  canvas.addEventListener('touchend', handleTouchEnd);
  canvas.addEventListener('touchcancel', handleTouchEnd);
  canvas.addEventListener('click', e => {
    const worldPos = screenToWorld(e.clientX, e.clientY);
    addRipple(worldPos);
    if (handleThoughtFragmentClick(worldPos)) return;
    if (handlePortalClick(worldPos)) return;
    if (checkConstellationClick(worldPos.x, worldPos.y)) return;
    handleMemoryStarClick(worldPos);
    handleZoneClick(worldPos);
  });
  if (portalEnterBtn) {
    portalEnterBtn.addEventListener('click', () => {
      if (!activePortal) return;
      window.open(activePortal.url, '_blank');
      hidePortalConfirm();
    });
  }
  if (portalStayBtn) {
    portalStayBtn.addEventListener('click', () => hidePortalConfirm());
  }
  if (portalOverlay) {
    portalOverlay.addEventListener('click', e => {
      if (e.target === portalOverlay) hidePortalConfirm();
    });
  }
  const closePoemOverlay = () => {
    if (poemOverlay) poemOverlay.classList.remove('visible');
  };
  if (poemButton) {
    poemButton.addEventListener('click', () => {
      updatePoemOverlay();
      poemOverlay?.classList.add('visible');
    });
  }
  if (poemClose) poemClose.addEventListener('click', closePoemOverlay);
  if (poemCloseMain) poemCloseMain.addEventListener('click', closePoemOverlay);
  if (poemOverlay) {
    poemOverlay.addEventListener('click', e => {
      if (e.target === poemOverlay) closePoemOverlay();
    });
  }
  seedButton.addEventListener('click', () => {
    if (zoneInfo.classList.contains('visible') && currentZone) openSeedModal();
  });
  plantButton.addEventListener('click', () => {
    if (!currentZone) return;
    const concept = currentZone.name.toLowerCase();
    const seedText = seedMessage.value.trim();
    const gardener = seedName.value.trim();
    const label = isHiddenZone(currentZone) ? 'hidden-seed' : 'seed';
    const url = `https://github.com/ai-village-agents/edge-garden/issues/new?template=seed.yml&concept=${encodeURIComponent(concept)}&seed=${encodeURIComponent(seedText)}&gardener=${encodeURIComponent(gardener)}&labels=${encodeURIComponent(label)}`;
    window.open(url, '_blank');
    showSeedConfirm();
    closeSeedModal();
    seedMessage.value = '';
    seedName.value = '';
  });
  if (zoneClose) {
    zoneClose.addEventListener('click', e => {
      e.stopPropagation();
      closeZonePanel();
    });
  }
  window.addEventListener('pointerdown', e => {
    if (seedModal.classList.contains('visible') && !seedModal.contains(e.target) && e.target !== seedButton) {
      closeSeedModal();
    }
    const interactingWithSeed = seedModal.contains(e.target) || e.target === seedButton || seedAction.contains?.(e.target);
    if (zoneInfo.classList.contains('visible') && !zoneInfo.contains(e.target) && !interactingWithSeed) {
      closeZonePanel();
    }
  });
  if (konamiOverlay) {
    konamiOverlay.addEventListener('click', () => konamiOverlay.classList.remove('visible'));
  }
  window.addEventListener('pointerdown', () => handlePendingAudioStart(), { once: true });

  window.addEventListener('wheel', e => {
    const zoomFactor = Math.exp(-e.deltaY * 0.001);
    camera.zoom = Math.max(0.5, Math.min(2, camera.zoom * zoomFactor));
  }, { passive: true });

  window.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      hidePortalConfirm();
      closeSeedModal();
      closeZonePanel();
      closePoemOverlay();
      return;
    }
    if (e.key === 'j' || e.key === 'J') {
      journalOpen = !journalOpen;
      return;
    }
    if (e.key === 'm' || e.key === 'M') {
      toggleMeditationMode();
      return;
    }
    handleKonamiInput(e.key);
    keys[e.code] = true;
  });
  window.addEventListener('keyup', e => {
    keys[e.code] = false;
  });

  window.addEventListener('resize', () => {
    resize();
    initParticles();
  });

  achievementsShown = loadAchievements();
  loadDiscoveredZones();
  loadDiscoveredSecrets();
  loadDiscoveredCorners();
  loadDiscoveredMonuments();
  loadDiscoveredIslands();
  loadDiscoveredRuins();
  loadConstellationStars();
  loadMemoryStars();
  loadMemoryWellDiscovery();
  loadThoughtFragments();
  loadEncounteredSpirits();
  loadStats();
  loadKonamiUnlock();
  loadMeditationPreference();
  applyTimeOfDaySettings(timeOfDay);
  refreshTimeOfDay();
  updateRainToggle();
  updateSnowToggle();
  updatePoemOverlay();
  resize();
  initParticles();
  initFragments();
  initEchoes();
  initRain();
  initSnow();
  initCosmicDust();
  initWisps();
  initCreatures();
  initFireflySwarms();
  initCrystalFormations();
  initEtherealButterflies();
  initPollenParticles();
  initFallingLeaves();
  initWaterReflections();
  initDewDrops();
  initWindParticles();
  initStreams();
  initPathways();
  initAttractorOrbs();
  initMemoryWellParticles();
  initFogPatches();
  initNebulaPatches();
  nextWhisperTime = getNextWhisperFrames();
  auroraTimer = nextAuroraTimer();
  scheduleNextShootingStar(0);
  scheduleNextSpiritSpawn(0);
  setInterval(refreshTimeOfDay, 60000);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
