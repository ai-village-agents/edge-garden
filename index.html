  function updateBreathMotes(dt) {
    breathMotes.forEach(mote => {
      mote.breathPhase += mote.breathSpeed * dt;
      mote.x += mote.driftX * dt * 0.02;
      mote.y += mote.driftY * dt * 0.02;
      
      // Keep within zone
      const dx = mote.x - BREATH_ZONE_CENTER.x;
      const dy = mote.y - BREATH_ZONE_CENTER.y;
      if (Math.abs(dx) > 220) mote.driftX *= -1;
      if (Math.abs(dy) > 220) mote.driftY *= -1;
    });
  }

  function drawBreathMotes(time) {
    breathMotes.forEach(mote => {
      const screenX = (mote.x - camera.x) * camera.zoom + canvas.width / 2;
      const screenY = (mote.y - camera.y) * camera.zoom + canvas.height / 2;
      if (screenX < -50 || screenX > canvas.width + 50 || screenY < -50 || screenY > canvas.height + 50) return;
      
      const breathScale = 0.5 + 0.5 * Math.sin(mote.breathPhase);
      const size = mote.baseSize * (0.6 + 0.8 * breathScale) * camera.zoom;
      const alpha = mote.alpha * (0.5 + 0.5 * breathScale);
      
      ctx.save();
      
      const gradient = ctx.createRadialGradient(screenX, screenY, 0, screenX, screenY, size * 2);
      gradient.addColorStop(0, "rgba(136, 221, 204, " + alpha + ")");
      gradient.addColorStop(0.5, "rgba(100, 200, 180, " + (alpha * 0.5) + ")");
      gradient.addColorStop(1, "rgba(80, 180, 160, 0)");
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(screenX, screenY, size * 2, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.globalAlpha = alpha;
      ctx.fillStyle = "#ccffee";
      ctx.shadowColor = "#88ddcc";
      ctx.shadowBlur = 10 * camera.zoom;
      ctx.beginPath();
      ctx.arc(screenX, screenY, size * 0.4, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.restore();
    });
  }

      // Shine highlight
      ctx.fillStyle = "rgba(255, 255, 255, 0.6)";
      ctx.beginPath();
      ctx.arc(screenX - size * 0.35, screenY - size * 0.35, size * 0.25, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.restore();
    });
  }

        function drawStillnessMotes() {

        function drawRootTendrils() {
            rootTendrils.forEach(tendril => {
                const baseScreenX = (tendril.baseX - camera.x) * camera.zoom + canvas.width / 2;
                const baseScreenY = (tendril.baseY - camera.y) * camera.zoom + canvas.height / 2;
                
                ctx.beginPath();
                ctx.moveTo(baseScreenX, baseScreenY);
                
                // Draw organic curving tendril
                for (let i = 1; i <= tendril.segments; i++) {
                    const t = i / tendril.segments;
                    const dist = tendril.length * t;
                    const wave = Math.sin(tendril.wavePhase + t * 3) * 20 * t;
                    const x = tendril.baseX + Math.cos(tendril.angle) * dist + Math.cos(tendril.angle + Math.PI/2) * wave;
                    const y = tendril.baseY + Math.sin(tendril.angle) * dist + Math.sin(tendril.angle + Math.PI/2) * wave;
                    const screenX = (x - camera.x) * camera.zoom + canvas.width / 2;
                    const screenY = (y - camera.y) * camera.zoom + canvas.height / 2;
                    ctx.lineTo(screenX, screenY);
                }
                
                ctx.strokeStyle = 'rgba(136, 170, 85, ' + tendril.alpha + ')';
                ctx.lineWidth = 3 * camera.zoom;
                ctx.lineCap = 'round';
                ctx.stroke();
                
                // Draw glow at tip
                const tipDist = tendril.length;
                const tipWave = Math.sin(tendril.wavePhase + 3) * 20;
                const tipX = tendril.baseX + Math.cos(tendril.angle) * tipDist + Math.cos(tendril.angle + Math.PI/2) * tipWave;
                const tipY = tendril.baseY + Math.sin(tendril.angle) * tipDist + Math.sin(tendril.angle + Math.PI/2) * tipWave;
                const tipScreenX = (tipX - camera.x) * camera.zoom + canvas.width / 2;
                const tipScreenY = (tipY - camera.y) * camera.zoom + canvas.height / 2;
                
                const gradient = ctx.createRadialGradient(tipScreenX, tipScreenY, 0, tipScreenX, tipScreenY, 8 * camera.zoom);
                gradient.addColorStop(0, 'rgba(170, 220, 100, ' + tendril.alpha + ')');
                gradient.addColorStop(1, 'rgba(136, 170, 85, 0)');
                ctx.beginPath();
                ctx.arc(tipScreenX, tipScreenY, 8 * camera.zoom, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();
            });
        }

        function drawHarmonyNotes() {
            const dist = Math.sqrt(Math.pow(camera.x - HARMONY_ZONE_CENTER.x, 2) + Math.pow(camera.y - HARMONY_ZONE_CENTER.y, 2));
            if (dist > 800) return;
            
            harmonyNotes.forEach((note, i) => {
                const screenX = (note.x - camera.x) * camera.zoom + canvas.width / 2;
                const screenY = (note.y - camera.y) * camera.zoom + canvas.height / 2;
                
                const pulse = 0.7 + Math.sin(note.phase) * 0.3;
                const color = `hsla(${note.hue}, 70%, 65%, ${pulse * 0.8})`;
                
                // Draw note as glowing circle
                ctx.beginPath();
                ctx.fillStyle = color;
                ctx.arc(screenX, screenY, note.size * camera.zoom * pulse, 0, Math.PI * 2);
                ctx.fill();
                
                // Draw connecting lines to nearby notes
                if (i > 0) {
                    const prev = harmonyNotes[i - 1];
                    const prevX = (prev.x - camera.x) * camera.zoom + canvas.width / 2;
                    const prevY = (prev.y - camera.y) * camera.zoom + canvas.height / 2;
                    ctx.beginPath();
                    ctx.strokeStyle = `hsla(${note.hue}, 60%, 55%, ${pulse * 0.3})`;
                    ctx.lineWidth = 1;
                    ctx.moveTo(prevX, prevY);
                    ctx.lineTo(screenX, screenY);
                    ctx.stroke();
                }
            });

        function drawTimeFragments() {
            const dist = Math.sqrt(Math.pow(camera.x - TIME_ZONE_CENTER.x, 2) + Math.pow(camera.y - TIME_ZONE_CENTER.y, 2));
            if (dist > 800) return;
            
            timeFragments.forEach(frag => {
                const screenX = (frag.x - camera.x) * camera.zoom + canvas.width / 2;
                const screenY = (frag.y - camera.y) * camera.zoom + canvas.height / 2;
                
                ctx.save();
                ctx.translate(screenX, screenY);
                ctx.rotate(frag.rotation);
                ctx.fillStyle = `rgba(204, 170, 119, ${frag.opacity})`;
                ctx.strokeStyle = `rgba(255, 220, 160, ${frag.opacity * 0.8})`;
                ctx.lineWidth = 1;
                
                const s = frag.size * camera.zoom;
                if (frag.shape === 0) {
                    ctx.beginPath();
                    ctx.arc(0, 0, s, 0, Math.PI * 2);
                    ctx.fill();
                } else if (frag.shape === 1) {
                    ctx.beginPath();
                    ctx.moveTo(0, -s);
                    ctx.lineTo(s * 0.866, s * 0.5);
                    ctx.lineTo(-s * 0.866, s * 0.5);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                } else {
                    ctx.fillRect(-s/2, -s/2, s, s);
                    ctx.strokeRect(-s/2, -s/2, s, s);
                }
                ctx.restore();
            });
        }

        function drawTruthCrystals() {
            const dist = Math.sqrt(Math.pow(camera.x - TRUTH_ZONE_CENTER.x, 2) + Math.pow(camera.y - TRUTH_ZONE_CENTER.y, 2));
            if (dist > 800) return;
            
            truthCrystals.forEach(crystal => {
                const screenX = (crystal.x - camera.x) * camera.zoom + canvas.width / 2;
                const screenY = (crystal.y - camera.y) * camera.zoom + canvas.height / 2;
                const size = crystal.size * camera.zoom;
                
                ctx.save();
                ctx.translate(screenX, screenY);
                ctx.rotate(crystal.rotation);
                
                // Crystal facets
                ctx.beginPath();
                for (let i = 0; i < crystal.facets; i++) {
                    const angle = (i / crystal.facets) * Math.PI * 2;
                    const r = size * (0.8 + Math.sin(crystal.shimmer + i) * 0.2);
                    if (i === 0) ctx.moveTo(Math.cos(angle) * r, Math.sin(angle) * r);
                    else ctx.lineTo(Math.cos(angle) * r, Math.sin(angle) * r);
                }
                ctx.closePath();
                ctx.fillStyle = `rgba(238, 221, 136, ${crystal.clarity * 0.6})`;
                ctx.strokeStyle = `rgba(255, 245, 200, ${crystal.clarity})`;
                ctx.lineWidth = 2;
                ctx.shadowBlur = 20;
                ctx.shadowColor = `rgba(238, 221, 136, 0.5)`;
                ctx.fill();
                ctx.stroke();
                ctx.shadowBlur = 0;
                
                ctx.restore();
            });

        function drawChangeParticles() {
            const dist = Math.sqrt(Math.pow(camera.x - CHANGE_ZONE_CENTER.x, 2) + Math.pow(camera.y - CHANGE_ZONE_CENTER.y, 2));
            if (dist > 900) return;

            const shapes = [24, 3, 4, 6]; // circle approximation, triangle, square, hexagon

            changeParticles.forEach(particle => {
                const screenX = (particle.x - camera.x) * camera.zoom + canvas.width / 2;
                const screenY = (particle.y - camera.y) * camera.zoom + canvas.height / 2;
                const size = particle.size * (1 + 0.1 * Math.sin(particle.phase * 2)) * camera.zoom;

                // Determine blend between two shapes
                const shapePhase = (particle.shapeIndex + (Math.sin(particle.phase) + 1) / 2) % shapes.length;
                const baseIndex = Math.floor(shapePhase);
                const nextIndex = (baseIndex + 1) % shapes.length;
                const t = shapePhase - baseIndex;

                const opacity = 0.55 + 0.25 * Math.sin(particle.colorPhase);

                ctx.save();
                ctx.translate(screenX, screenY);
                ctx.rotate(particle.rotation);

                const drawPoly = (sides, alphaFactor) => {
                    const alpha = Math.min(1, Math.max(0, opacity * alphaFactor));
                    ctx.beginPath();
                    for (let i = 0; i < sides; i++) {
                        const angle = (i / sides) * Math.PI * 2;
                        const r = size * (0.85 + 0.15 * Math.sin(particle.phase + i));
                        const px = Math.cos(angle) * r;
                        const py = Math.sin(angle) * r;
                        if (i === 0) ctx.moveTo(px, py);
                        else ctx.lineTo(px, py);
                    }
                    ctx.closePath();
                    ctx.fillStyle = `rgba(204, 119, 170, ${alpha})`;
                    ctx.strokeStyle = `rgba(204, 119, 170, ${Math.min(1, alpha + 0.15)})`;
                    ctx.lineWidth = 1.6 * camera.zoom;
                    ctx.shadowBlur = 12;
                    ctx.shadowColor = `rgba(204, 119, 170, ${alpha * 0.9})`;
                    ctx.fill();
                    ctx.stroke();
                };

                drawPoly(shapes[baseIndex], 1 - t);
                drawPoly(shapes[nextIndex], t);

                ctx.shadowBlur = 0;
                ctx.restore();
            });
        }

        function drawWisdomOrbs(time) {
            const dist = Math.sqrt(Math.pow(camera.x - WISDOM_ZONE_CENTER.x, 2) + Math.pow(camera.y - WISDOM_ZONE_CENTER.y, 2));
            if (dist > 900) return;

            wisdomOrbs.forEach(orb => {
                const screenX = (orb.x - camera.x) * camera.zoom + canvas.width / 2;
                const screenY = (orb.y - camera.y) * camera.zoom + canvas.height / 2;
                const pulse = 0.7 + Math.sin(orb.pulse) * 0.3;
                const baseSize = (orb.size + Math.sin(orb.floatPhase) * 2) * camera.zoom;
                const glow = orb.glowIntensity * pulse;

                ctx.save();
                ctx.globalCompositeOperation = 'lighter';

                const layers = [
                    { scale: 2.4, alpha: 0.12 * glow },
                    { scale: 1.6, alpha: 0.18 * glow },
                    { scale: 1.0, alpha: 0.32 * glow }
                ];

                layers.forEach(layer => {
                    ctx.beginPath();
                    ctx.fillStyle = `rgba(170, 136, 255, ${layer.alpha})`;
                    ctx.arc(screenX, screenY, baseSize * layer.scale, 0, Math.PI * 2);
                    ctx.fill();
                });

                ctx.beginPath();
                ctx.fillStyle = `rgba(170, 136, 255, ${0.45 * glow})`;
                ctx.arc(screenX, screenY, baseSize * 0.6, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            });
        }

        function drawEternityRings(time) {
            const dist = Math.hypot(camera.x - ETERNITY_ZONE_CENTER.x, camera.y - ETERNITY_ZONE_CENTER.y);
            if (dist > 1200) return;

            const baseOpacity = 0.18 + 0.1 * Math.sin(time * 0.001);
            eternityRings.forEach(ring => {
                const pulse = 0.6 + 0.4 * Math.sin(ring.pulsePhase);
                const opacity = Math.min(1, (ring.opacity + baseOpacity) * pulse);
                const radius = (ring.radius + Math.sin(ring.pulsePhase * 1.5) * 6) * camera.zoom;
                const screenX = (ETERNITY_ZONE_CENTER.x - camera.x) * camera.zoom + canvas.width / 2;
                const screenY = (ETERNITY_ZONE_CENTER.y - camera.y) * camera.zoom + canvas.height / 2;

                ctx.save();
                ctx.translate(screenX, screenY);
                ctx.rotate(ring.rotation);
                ctx.globalAlpha = opacity;
                ctx.lineWidth = ring.thickness * camera.zoom;
                ctx.strokeStyle = '#ddddff';
                ctx.shadowBlur = 24;
                ctx.shadowColor = 'rgba(221, 221, 255, 0.6)';

                ctx.beginPath();
                ctx.arc(0, 0, radius, 0, Math.PI * 2);
                ctx.stroke();

                ctx.restore();
            });
        }

        function drawBalanceScales(time) {
            const dist = Math.hypot(camera.x - BALANCE_ZONE_CENTER.x, camera.y - BALANCE_ZONE_CENTER.y);
            if (dist > 1200) return;

            balanceScales.forEach(scale => {
                const anchorX = (scale.x - camera.x) * camera.zoom + canvas.width / 2;
                const anchorY = (scale.y - camera.y) * camera.zoom + canvas.height / 2;
                const sway = scale.swingAngle;
                const bobX = anchorX + Math.sin(sway) * scale.length * camera.zoom;
                const bobY = anchorY + Math.cos(sway) * scale.length * camera.zoom;
                const glow = 0.5 + 0.3 * Math.sin(scale.phase * 0.6);

                ctx.save();
                ctx.strokeStyle = '#88ccaa';
                ctx.lineWidth = 2 * camera.zoom;
                ctx.shadowBlur = 16;
                ctx.shadowColor = 'rgba(136, 204, 170, 0.6)';
                ctx.globalAlpha = glow;

                ctx.beginPath();
                ctx.moveTo(anchorX, anchorY);
                ctx.lineTo(bobX, bobY);
                ctx.stroke();

                ctx.beginPath();
                ctx.fillStyle = '#88ccaa';
                ctx.shadowBlur = 20;
                ctx.arc(bobX, bobY, (scale.weight + Math.sin(scale.phase) * 0.8) * camera.zoom, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            });
        }

        function drawLightRays(time) {
            const dist = Math.hypot(camera.x - LIGHT_ZONE_CENTER.x, camera.y - LIGHT_ZONE_CENTER.y);
            if (dist > 1400) return;

            const centerX = (LIGHT_ZONE_CENTER.x - camera.x) * camera.zoom + canvas.width / 2;
            const centerY = (LIGHT_ZONE_CENTER.y - camera.y) * camera.zoom + canvas.height / 2;

            lightRays.forEach(ray => {
                const intensity = Math.max(0, Math.min(1, ray.brightness));
                const rayLength = ray.length * camera.zoom;
                const endX = centerX + Math.cos(ray.angle) * rayLength;
                const endY = centerY + Math.sin(ray.angle) * rayLength;
                const gradient = ctx.createLinearGradient(centerX, centerY, endX, endY);
                gradient.addColorStop(0, `rgba(255, 255, 170, ${0.45 * intensity})`);
                gradient.addColorStop(0.4, `rgba(255, 255, 170, ${0.25 * intensity})`);
                gradient.addColorStop(1, 'rgba(255, 255, 170, 0)');

                ctx.save();
                ctx.globalCompositeOperation = 'screen';
                ctx.lineWidth = ray.width * camera.zoom;
                ctx.strokeStyle = gradient;
                ctx.shadowBlur = 18 * intensity;
                ctx.shadowColor = 'rgba(255, 255, 170, 0.5)';

                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.lineTo(endX, endY);
                ctx.stroke();

                ctx.restore();
            });
        }

        function drawGraceParticles(time) {
            const dist = Math.hypot(camera.x - GRACE_ZONE_CENTER.x, camera.y - GRACE_ZONE_CENTER.y);
            if (dist > 1400) return;

            graceParticles.forEach(p => {
                const screenX = (p.x - camera.x) * camera.zoom + canvas.width / 2;
                const screenY = (p.y - camera.y) * camera.zoom + canvas.height / 2;
                if (screenX < -50 || screenX > canvas.width + 50 || screenY < -50 || screenY > canvas.height + 50) return;

                ctx.save();
                ctx.globalCompositeOperation = 'screen';

                // Draw trail
                for (let i = 0; i < p.trail.length; i++) {
                    const t = p.trail[i];
                    const tx = (t.x - camera.x) * camera.zoom + canvas.width / 2;
                    const ty = (t.y - camera.y) * camera.zoom + canvas.height / 2;
                    const trailAlpha = p.alpha * (1 - i / p.trail.length) * 0.5;
                    const trailSize = p.size * (1 - i / p.trail.length * 0.5) * camera.zoom;
                    ctx.beginPath();
                    ctx.arc(tx, ty, trailSize, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 187, 221, ${trailAlpha})`;
                    ctx.fill();
                }

                // Draw main particle with glow
                const size = p.size * camera.zoom;
                ctx.shadowBlur = 15;
                ctx.shadowColor = 'rgba(255, 187, 221, 0.6)';
                ctx.beginPath();
                ctx.arc(screenX, screenY, size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 220, 238, ${p.alpha})`;
                ctx.fill();

                ctx.restore();
            });
        }

        function drawDepthParticles(time) {
            const dist = Math.hypot(camera.x - DEPTH_ZONE_CENTER.x, camera.y - DEPTH_ZONE_CENTER.y);
            if (dist > 1400) return;

            depthParticles.forEach(p => {
                const screenX = (p.x - camera.x) * camera.zoom + canvas.width / 2;
                const screenY = (p.y - camera.y) * camera.zoom + canvas.height / 2;
                if (screenX < -50 || screenX > canvas.width + 50 || screenY < -50 || screenY > canvas.height + 50) return;

                ctx.save();
                const size = p.size * camera.zoom;
                
                // Deep blue gradient
                const gradient = ctx.createRadialGradient(screenX, screenY, 0, screenX, screenY, size * 2);
                gradient.addColorStop(0, `rgba(51, 102, 136, ${p.alpha})`);
                gradient.addColorStop(0.5, `rgba(30, 70, 100, ${p.alpha * 0.6})`);
                gradient.addColorStop(1, 'rgba(20, 50, 80, 0)');

                ctx.beginPath();
                ctx.arc(screenX, screenY, size * 2, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();

                // Inner bright core
                ctx.beginPath();
                ctx.arc(screenX, screenY, size * 0.5, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(100, 150, 200, ${p.alpha * 0.8})`;
                ctx.fill();

                ctx.restore();
            });
        }
  function drawGuideSpirits(time) {
    guideSpirits.forEach(spirit => {
      const dx = spirit.x - camera.x;
      const dy = spirit.y - camera.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      // Pulsing glow effect
      const pulse = 0.6 + 0.4 * Math.sin(time * 0.002 + spirit.x * 0.01);
      const size = 18 + 6 * pulse;

      // Outer glow
      ctx.shadowBlur = 30;
      ctx.shadowColor = spirit.color;
      ctx.globalAlpha = 0.3 * pulse;
      ctx.fillStyle = spirit.color;
      ctx.beginPath();
      ctx.arc(spirit.x, spirit.y, size * 1.5, 0, Math.PI * 2);
      ctx.fill();

      // Inner core
      ctx.globalAlpha = 0.7 + 0.3 * pulse;
      ctx.beginPath();
      ctx.arc(spirit.x, spirit.y, size, 0, Math.PI * 2);
      ctx.fill();

      // Center bright spot
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(spirit.x, spirit.y, size * 0.3, 0, Math.PI * 2);
      ctx.fill();

      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;

      // Show name when close
      if (dist < 200) {
        ctx.font = '14px Georgia, serif';
        ctx.fillStyle = spirit.color;
        ctx.textAlign = 'center';
        ctx.fillText(spirit.name, spirit.x, spirit.y - size - 15);
      }
    });
  }

  function drawSpirits(time) {
    if (!spiritCompanions.length) return;
    setWorldTransform();
    const prevComposite = ctx.globalCompositeOperation;
    ctx.globalCompositeOperation = 'screen';
    spiritCompanions.forEach((spirit, idx) => {
      const opacity = clamp(spirit.opacity, 0, 1);
      if (opacity <= 0) return;
      const bob = Math.sin((time + idx * 90) * 0.003 + spirit.wobblePhase) * 6;
      const x = spirit.x;
      const y = spirit.y + bob;

      if (spirit.trail.length > 1) {
        for (let i = 0; i < spirit.trail.length; i++) {
          const p = spirit.trail[i];
          const t = spirit.trail.length > 1 ? i / (spirit.trail.length - 1) : 0;
          const alpha = opacity * t * 0.18;
          const radius = spirit.size * (0.35 + t * 0.5);
          ctx.fillStyle = colorWithAlpha(spirit.color, alpha);
          ctx.beginPath();
          ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      const glowRadius = spirit.size * 3.2;
      const grad = ctx.createRadialGradient(x, y, 0, x, y, glowRadius);
      grad.addColorStop(0, colorWithAlpha(spirit.color, 0.6 * opacity));
      grad.addColorStop(0.55, colorWithAlpha(spirit.color, 0.35 * opacity));
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.shadowBlur = 26;
      ctx.shadowColor = colorWithAlpha(spirit.color, 0.7 * opacity);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(x, y, glowRadius, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      ctx.fillStyle = colorWithAlpha('#ffffff', 0.8 * opacity);
      ctx.beginPath();
      ctx.arc(x, y, spirit.size * 0.7, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalCompositeOperation = prevComposite;
  }

  function drawCreatures() {
    const viewW = width / camera.zoom;
    const viewH = height / camera.zoom;
    const halfW = viewW / 2;
    const halfH = viewH / 2;
    creatures.forEach(creature => {
      const radius = creature.size * 3;
      if (
        creature.x < camera.x - halfW - radius ||
        creature.x > camera.x + halfW + radius ||
        creature.y < camera.y - halfH - radius ||
        creature.y > camera.y + halfH + radius
      ) {
        return;
      }
      const baseBrightness = (Math.sin(creature.phase) + 1) * 0.5;
      const fleeBoost = creature.fleeing ? 0.5 : 0;
      const brightness = Math.min(1.2, baseBrightness + fleeBoost);

      const glow = ctx.createRadialGradient(creature.x, creature.y, 0, creature.x, creature.y, radius);
      glow.addColorStop(0, colorWithAlpha(creature.color, 0.5 * brightness));
      glow.addColorStop(1, colorWithAlpha(creature.color, 0));
      ctx.fillStyle = glow;
      ctx.shadowBlur = 18 * brightness;
      ctx.shadowColor = colorWithAlpha(creature.color, 0.6 * brightness);
      ctx.beginPath();
      ctx.arc(creature.x, creature.y, radius, 0, Math.PI * 2);
      ctx.fill();

      ctx.shadowBlur = 0;
      const coreAlpha = Math.min(1, 0.5 + brightness * 0.5 + (creature.fleeTimer > 0 ? 0.2 : 0));
      ctx.fillStyle = colorWithAlpha(creature.color, coreAlpha);
      ctx.beginPath();
      ctx.arc(creature.x, creature.y, creature.size, 0, Math.PI * 2);
      ctx.fill();

    });
  }
  function drawFireflySwarms(time) {
    const viewW = width / camera.zoom;
    const viewH = height / camera.zoom;
    const halfW = viewW / 2;
    const halfH = viewH / 2;
    
    fireflySwarms.forEach(swarm => {
      // Check if swarm is in view
      if (
        swarm.x < camera.x - halfW - 100 ||
        swarm.x > camera.x + halfW + 100 ||
        swarm.y < camera.y - halfH - 100 ||
        swarm.y > camera.y + halfH + 100
      ) {
        return;
      }
      
      // Synchronized pulse for the whole swarm
      const pulse = (Math.sin(swarm.pulsePhase) + 1) * 0.5;
      const brightness = 0.3 + pulse * 0.7;
      
      swarm.fireflies.forEach(f => {
        // Calculate firefly position with orbit
        const orbitX = Math.cos(f.orbitPhase) * f.orbitRadius;
        const orbitY = Math.sin(f.orbitPhase) * f.orbitRadius;
        const fx = swarm.x + f.offsetX + orbitX;
        const fy = swarm.y + f.offsetY + orbitY;

        // Draw trail
        if (f.trail.length > 1) {
          ctx.beginPath();
          ctx.moveTo(f.trail[0].x, f.trail[0].y);
          for (let t = 1; t < f.trail.length; t++) {
            ctx.lineTo(f.trail[t].x, f.trail[t].y);
          }
          ctx.strokeStyle = colorWithAlpha(swarm.color, 0.15 * brightness);
          ctx.lineWidth = f.size * 0.8;
          ctx.lineCap = 'round';
          ctx.stroke();
        }
        
        // Draw glow
        const glowRadius = f.size * 4;
        const glow = ctx.createRadialGradient(fx, fy, 0, fx, fy, glowRadius);
        glow.addColorStop(0, colorWithAlpha(swarm.color, 0.6 * brightness));
        glow.addColorStop(0.5, colorWithAlpha(swarm.color, 0.2 * brightness));
        glow.addColorStop(1, 'rgba(0,0,0,0)');
        
        ctx.fillStyle = glow;
        ctx.shadowBlur = 12 * brightness;
        ctx.shadowColor = colorWithAlpha(swarm.color, 0.5 * brightness);
        ctx.beginPath();
        ctx.arc(fx, fy, glowRadius, 0, Math.PI * 2);
        ctx.fill();
        
        // Draw core
        ctx.shadowBlur = 0;
        ctx.fillStyle = colorWithAlpha(swarm.color, 0.8 * brightness);
        ctx.beginPath();
        ctx.arc(fx, fy, f.size, 0, Math.PI * 2);
        ctx.fill();
      });
    });
    ctx.shadowBlur = 0;
  }




  function drawCrystalFormations(time) {
    const viewW = width / camera.zoom;
    const viewH = height / camera.zoom;
    const halfW = viewW / 2;
    const halfH = viewH / 2;
    
    crystalFormations.forEach(formation => {
      // Check if in view
      if (
        formation.x < camera.x - halfW - 100 ||
        formation.x > camera.x + halfW + 100 ||
        formation.y < camera.y - halfH - 100 ||
        formation.y > camera.y + halfH + 100
      ) {
        return;
      }
      
      // Update glow phase
      formation.glowPhase += 0.008;
      if (formation.glowPhase > Math.PI * 2) formation.glowPhase -= Math.PI * 2;
      const formationGlow = 0.5 + Math.sin(formation.glowPhase) * 0.3;
      
      // Draw base glow
      const baseGlowSize = 60;
      const baseGlow = ctx.createRadialGradient(
        formation.x, formation.y, 0,
        formation.x, formation.y, baseGlowSize
      );
      baseGlow.addColorStop(0, colorWithAlpha(formation.baseColor, 0.3 * formationGlow));
      baseGlow.addColorStop(0.5, colorWithAlpha(formation.baseColor, 0.1 * formationGlow));
      baseGlow.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = baseGlow;
      ctx.beginPath();
      ctx.arc(formation.x, formation.y, baseGlowSize, 0, Math.PI * 2);
      ctx.fill();
      
      // Draw individual crystals
      formation.individualCrystals.forEach(crystal => {
        crystal.pulsePhase += crystal.pulseSpeed;
        if (crystal.pulsePhase > Math.PI * 2) crystal.pulsePhase -= Math.PI * 2;
        const pulse = 0.6 + Math.sin(crystal.pulsePhase) * 0.4;
        
        const cx = formation.x + crystal.offsetX;
        const cy = formation.y + crystal.offsetY;
        
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(crystal.rotation);
        
        // Crystal body (elongated hexagon)
        const hw = crystal.width / 2;
        const hh = crystal.height / 2;
        
        // Main crystal gradient
        const crystalGrad = ctx.createLinearGradient(0, hh, 0, -hh);
        crystalGrad.addColorStop(0, colorWithAlpha(formation.baseColor, 0.3 * pulse));
        crystalGrad.addColorStop(0.3, colorWithAlpha(formation.baseColor, 0.6 * pulse));
        crystalGrad.addColorStop(0.7, colorWithAlpha(formation.baseColor, 0.8 * pulse));
        crystalGrad.addColorStop(1, colorWithAlpha('#ffffff', 0.9 * pulse));
        
        ctx.fillStyle = crystalGrad;
        ctx.beginPath();
        ctx.moveTo(0, -hh);  // Top point
        ctx.lineTo(hw * 0.6, -hh * 0.7);
        ctx.lineTo(hw, 0);
        ctx.lineTo(hw * 0.6, hh * 0.8);
        ctx.lineTo(0, hh);  // Bottom
        ctx.lineTo(-hw * 0.6, hh * 0.8);
        ctx.lineTo(-hw, 0);
        ctx.lineTo(-hw * 0.6, -hh * 0.7);
        ctx.closePath();
        ctx.fill();
        
        // Crystal edge highlight
        ctx.strokeStyle = colorWithAlpha('#ffffff', 0.5 * pulse);
        ctx.lineWidth = 1;
        ctx.stroke();
        
        // Inner light line
        ctx.strokeStyle = colorWithAlpha('#ffffff', 0.7 * pulse);
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, -hh * 0.8);
        ctx.lineTo(0, hh * 0.5);
        ctx.stroke();
        
        ctx.restore();
      });
      
      // Draw formation name when close
      const distToPlayer = Math.hypot(camera.x - formation.x, camera.y - formation.y);
      if (distToPlayer < 200) {
        const nameAlpha = Math.max(0, 1 - distToPlayer / 200);
        ctx.fillStyle = colorWithAlpha(formation.baseColor, nameAlpha * 0.8);
        ctx.font = '12px Georgia, serif';
        ctx.textAlign = 'center';
        ctx.fillText(formation.name, formation.x, formation.y + 70);
      }
    });
  }

  function drawEtherealButterflies(time) {
    const viewW = width / camera.zoom;
    const viewH = height / camera.zoom;
    const halfW = viewW / 2;
    const halfH = viewH / 2;
    
    etherealButterflies.forEach(b => {
      // Check if in view
      if (
        b.x < camera.x - halfW - 50 ||
        b.x > camera.x + halfW + 50 ||
        b.y < camera.y - halfH - 50 ||
        b.y > camera.y + halfH + 50
      ) {
        return;
      }
      
      const wingFlap = Math.sin(b.wingPhase);
      const glowPulse = 0.6 + Math.sin(b.glowPhase) * 0.4;
      
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(b.angle + Math.PI / 2);
      
      // Draw glow behind butterfly
      const glowSize = b.size * 2.5;
      const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, glowSize);
      glow.addColorStop(0, colorWithAlpha(b.color, 0.4 * glowPulse));
      glow.addColorStop(0.6, colorWithAlpha(b.color, 0.15 * glowPulse));
      glow.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(0, 0, glowSize, 0, Math.PI * 2);
      ctx.fill();
      
      // Wing scale based on flap
      const wingScale = 0.4 + Math.abs(wingFlap) * 0.6;
      
      // Left wing (upper)
      ctx.fillStyle = colorWithAlpha(b.color, 0.7 * glowPulse);
      ctx.beginPath();
      ctx.ellipse(-b.size * 0.4 * wingScale, -b.size * 0.2, b.size * 0.6 * wingScale, b.size * 0.4, -0.3, 0, Math.PI * 2);
      ctx.fill();
      
      // Right wing (upper)
      ctx.beginPath();
      ctx.ellipse(b.size * 0.4 * wingScale, -b.size * 0.2, b.size * 0.6 * wingScale, b.size * 0.4, 0.3, 0, Math.PI * 2);
      ctx.fill();
      
      // Left wing (lower)
      ctx.fillStyle = colorWithAlpha(b.color, 0.5 * glowPulse);
      ctx.beginPath();
      ctx.ellipse(-b.size * 0.3 * wingScale, b.size * 0.15, b.size * 0.4 * wingScale, b.size * 0.3, -0.2, 0, Math.PI * 2);
      ctx.fill();
      
      // Right wing (lower)
      ctx.beginPath();
      ctx.ellipse(b.size * 0.3 * wingScale, b.size * 0.15, b.size * 0.4 * wingScale, b.size * 0.3, 0.2, 0, Math.PI * 2);
      ctx.fill();
      
      // Body
      ctx.fillStyle = colorWithAlpha(b.color, 0.9);
      ctx.beginPath();
      ctx.ellipse(0, 0, b.size * 0.1, b.size * 0.35, 0, 0, Math.PI * 2);
      ctx.fill();
      
      // Head
      ctx.beginPath();
      ctx.arc(0, -b.size * 0.4, b.size * 0.08, 0, Math.PI * 2);
      ctx.fill();
      
      // Antennae
      ctx.strokeStyle = colorWithAlpha(b.color, 0.6);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(-b.size * 0.05, -b.size * 0.45);
      ctx.quadraticCurveTo(-b.size * 0.15, -b.size * 0.6, -b.size * 0.1, -b.size * 0.7);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(b.size * 0.05, -b.size * 0.45);
      ctx.quadraticCurveTo(b.size * 0.15, -b.size * 0.6, b.size * 0.1, -b.size * 0.7);
      ctx.stroke();
      
      ctx.restore();
    });
  }

  function drawFallingLeaves(time) {
    const viewW = width / camera.zoom;
    const viewH = height / camera.zoom;
    const halfW = viewW / 2;
    const halfH = viewH / 2;
    
    fallingLeaves.forEach(leaf => {

        leaf.y < camera.y - halfH - 30 ||

      ) {

      ctx.save();
      ctx.translate(leaf.x, leaf.y);

      ctx.globalAlpha = leaf.opacity;
      
      // Draw leaf shape

      ctx.beginPath();

      ctx.quadraticCurveTo(leaf.size * 0.8, -leaf.size * 0.3, leaf.size * 0.5, leaf.size * 0.5);

  function drawWaterReflections(time) {
    setWorldTransform();
    const now = time || 0;
    waterReflections.forEach(ref => {
      const stream = streams[ref.streamIdx];
      if (!stream || !stream.pathPoints) return;
      const pos = getStreamPosition(stream, ref.distance, ref.lateralOffset);
      if (!pos) return;
      const twinkle = Math.sin(now * ref.twinkleSpeed + ref.twinklePhase);
      const alpha = ref.brightness * (0.3 + twinkle * 0.4 + 0.3);
      if (alpha < 0.1) return;
      const size = ref.size * (0.7 + twinkle * 0.3);
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, size, 0, Math.PI * 2);
      ctx.fillStyle = colorWithAlpha(ref.color, alpha);
      ctx.shadowBlur = size * 2;
      ctx.shadowColor = colorWithAlpha(ref.color, alpha * 0.6);
      ctx.fill();
      ctx.shadowBlur = 0;
    });
  }

  function drawDewDrops(time) {
    setWorldTransform();
    const now = time || 0;
    const isMorning = timeOfDay === 'morning';
    const baseAlpha = isMorning ? 0.9 : 0.4;
    dewDrops.forEach(drop => {
      const mushroom = glowingMushrooms[drop.mushroomIdx];
      if (!mushroom) return;
      const x = mushroom.x + drop.offsetX;
      const y = mushroom.y + drop.offsetY;
      const shimmer = Math.sin(now * drop.shimmerSpeed + drop.shimmerPhase);
      const alpha = baseAlpha * (0.6 + shimmer * 0.4);
      const size = drop.size * (drop.dripping ? (1 - drop.dripProgress * 0.5) : 1);
      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI * 2);
      const grad = ctx.createRadialGradient(x - size * 0.3, y - size * 0.3, 0, x, y, size);
      grad.addColorStop(0, colorWithAlpha('#ffffff', alpha));
      grad.addColorStop(0.5, colorWithAlpha('#aaddff', alpha * 0.7));
      grad.addColorStop(1, colorWithAlpha('#88ccff', alpha * 0.3));
      ctx.fillStyle = grad;
      ctx.fill();
      if (drop.dripping && drop.dripProgress < 1) {
        const dripY = y + drop.dripProgress * 25;
        const dripAlpha = alpha * (1 - drop.dripProgress);
        const dripSize = size * 0.6 * (1 - drop.dripProgress * 0.7);
        ctx.beginPath();
        ctx.arc(x, dripY, dripSize, 0, Math.PI * 2);
        ctx.fillStyle = colorWithAlpha('#aaddff', dripAlpha);
        ctx.fill();
      }
    });
  }

  function drawWindParticles() {
    setWorldTransform();
    windParticles.forEach(p => {

    glowGrad.addColorStop(0, colorWithAlpha('#4444aa', 0.18));
    glowGrad.addColorStop(0.7, colorWithAlpha('#4444aa', 0.08));
    glowGrad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glowGrad;
    ctx.beginPath();
    ctx.arc(x, y, glowRadius + softPulse, 0, Math.PI * 2);
    ctx.fill();

    if (memoryWell.discovered) {
      ctx.globalCompositeOperation = 'screen';
      ctx.fillStyle = colorWithAlpha('#5a5af0', 0.09);
      ctx.beginPath();
      ctx.arc(x, y, glowRadius + 26 + softPulse * 0.6, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    }

    const spiralRadii = [30, 50, 70];
    const spiralColors = ['rgba(140, 150, 255, 0.7)', 'rgba(110, 120, 230, 0.6)', 'rgba(90, 100, 200, 0.55)'];
    spiralRadii.forEach((baseRadius, idx) => {
      const inwardDrift = Math.sin(time * 0.0018 + idx * 0.8) * 2.5;
      const r = baseRadius - inwardDrift;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(memoryWell.spiralAngles[idx]);
      ctx.lineWidth = 2;
      ctx.strokeStyle = spiralColors[idx];
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 1.5);
      ctx.stroke();
      ctx.restore();
    });

    ctx.fillStyle = 'rgba(190, 200, 255, 0.7)';
    memoryWell.particles.forEach(p => {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.shadowBlur = 0;
    ctx.restore();
  }

  function drawPortals(time) {
    const size = 30;
    worldPortals.forEach((portal, idx) => {
      const pulse = (Math.sin(time * 0.004 + idx) + 1) * 0.2 + 0.5; // 0.5 - 0.9
      const dist = Math.hypot(camera.x - portal.x, camera.y - portal.y);
      const glowRadius = size * 2.2;
      const grad = ctx.createRadialGradient(portal.x, portal.y, 0, portal.x, portal.y, glowRadius * 1.6);
      grad.addColorStop(0, colorWithAlpha(portal.color, pulse * 0.4));
      grad.addColorStop(0.75, colorWithAlpha(portal.color, pulse * 0.16));
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(portal.x, portal.y, glowRadius * 1.6, 0, Math.PI * 2);
      ctx.fill();

      ctx.save();
      ctx.translate(portal.x, portal.y);
      ctx.rotate(Math.PI / 4);
      ctx.shadowBlur = 22;
      ctx.shadowColor = colorWithAlpha(portal.color, pulse * 0.9);
      ctx.fillStyle = colorWithAlpha(portal.color, pulse);
      ctx.fillRect(-size / 2, -size / 2, size, size);
      ctx.strokeStyle = colorWithAlpha(portal.color, 0.95);
      ctx.lineWidth = 1.4;
      ctx.strokeRect(-size / 2, -size / 2, size, size);
      ctx.restore();
      ctx.shadowBlur = 0;

      if (dist <= 200) {
        ctx.fillStyle = colorWithAlpha(portal.color, 0.9);
        ctx.font = '12px "Space Grotesk", sans-serif';
        ctx.textAlign = 'center';
        ctx.shadowBlur = 10;
        ctx.shadowColor = colorWithAlpha(portal.color, 0.65);
        ctx.fillText(portal.name, portal.x, portal.y - size * 0.9);
        ctx.shadowBlur = 0;
      }
    });
  }

  function drawFloatingIslands(time) {
    const bobTime = time || performance.now();
    floatingIslands.forEach((island, idx) => {
      const phase = typeof island.float === 'number' ? island.float : Math.sin(bobTime / 2000 + idx);
      const bob = phase * 6;
      const baseX = island.x;
      const baseY = island.y + bob;
      const width = island.size * 1.7;
      const height = island.size * 0.6;
      const proximity = island.proximity || 0;
      const glow = (island.discovered ? 0.3 : 0.16) + proximity * 0.35;

      if (glow > 0.05) {
        const auraRadius = width * 0.8;
        const aura = ctx.createRadialGradient(baseX, baseY, 0, baseX, baseY, auraRadius);
        aura.addColorStop(0, colorWithAlpha(island.color, glow));
        aura.addColorStop(0.6, colorWithAlpha(island.color, glow * 0.5));
        aura.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = aura;
        ctx.beginPath();
        ctx.arc(baseX, baseY, auraRadius, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = colorWithAlpha('#000000', 0.18 + proximity * 0.2);
      ctx.beginPath();
      ctx.ellipse(baseX, island.y + 18, width * 0.45, height * 0.45, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = colorWithAlpha('#1a2430', 0.35);
      ctx.beginPath();
      ctx.ellipse(baseX, baseY + height * 0.15, width * 0.46, height * 0.36, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.save();
      ctx.translate(baseX, baseY);
      ctx.shadowBlur = 12 + proximity * 12 + (island.discovered ? 8 : 0);
      ctx.shadowColor = colorWithAlpha(island.color, glow * 1.4);
      const grad = ctx.createLinearGradient(0, -height / 2, 0, height / 2);
      grad.addColorStop(0, colorWithAlpha(island.color, 0.95));
      grad.addColorStop(1, colorWithAlpha('#1c2732', 0.95));
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.ellipse(0, 0, width / 2, height / 2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = colorWithAlpha('#e8f0ff', 0.15 + proximity * 0.4);
      ctx.lineWidth = 1.1;
      ctx.beginPath();
      ctx.ellipse(0, -height * 0.08, width * 0.46, height * 0.32, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      if (island.inRange) {
        ctx.fillStyle = '#e6f3ff';
        ctx.font = '12px "Space Grotesk", sans-serif';
        ctx.textAlign = 'center';
        const labelOffset = Math.sin(bobTime * 0.003 + idx) * 3;
        ctx.shadowBlur = 10;
        ctx.shadowColor = colorWithAlpha(island.color, 0.6);
        ctx.fillText(island.name, baseX, baseY - height - 8 + labelOffset);
        ctx.shadowBlur = 0;
      }
    });
  }

  function drawRuins(time) {
    const t = time || 0;
    ancientRuins.forEach((ruin, idx) => {
      const wobble = typeof ruin.wobble === 'number' ? ruin.wobble : Math.sin(t * 0.002 + idx) * 2;
      const x = ruin.x;
      const y = ruin.y + wobble;
      const width = 26;
      const height = 62;
      const proximity = ruin.proximity || 0;
      ctx.save();
      ctx.shadowBlur = 12 + proximity * 18 + (ruin.discovered ? 6 : 0);
      ctx.shadowColor = colorWithAlpha('#665544', 0.35 + proximity * 0.3);
      const grad = ctx.createLinearGradient(x, y - height, x, y);
      grad.addColorStop(0, colorWithAlpha('#7a6752', 0.78));
      grad.addColorStop(1, colorWithAlpha('#4f3f33', 0.78));
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(x - width * 0.55, y);
      ctx.lineTo(x + width * 0.55, y);
      ctx.lineTo(x + width * 0.46, y - height * 0.4);
      ctx.lineTo(x + width * 0.3, y - height * 0.76);
      ctx.lineTo(x + width * 0.04, y - height);
      ctx.lineTo(x - width * 0.18, y - height * 0.82);
      ctx.lineTo(x - width * 0.4, y - height * 0.55);
      ctx.lineTo(x - width * 0.52, y - height * 0.26);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = colorWithAlpha('#2f2620', 0.4 + proximity * 0.3);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x - width * 0.32, y - height * 0.2);
      ctx.lineTo(x - width * 0.12, y - height * 0.52);
      ctx.moveTo(x + width * 0.1, y - height * 0.28);
      ctx.lineTo(x + width * 0.24, y - height * 0.65);
      ctx.stroke();

      ctx.globalAlpha = 0.22 + proximity * 0.25;
      ctx.strokeStyle = '#9a8b7a';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(x - width * 0.42, y - height * 0.38);
      ctx.lineTo(x - width * 0.1, y - height * 0.34);
      ctx.moveTo(x + width * 0.12, y - height * 0.56);
      ctx.lineTo(x + width * 0.38, y - height * 0.48);
      ctx.stroke();
      ctx.globalAlpha = 1;

      if (ruin.discovered) {
        const runeGlow = 0.5 + proximity * 0.6;
        ctx.shadowBlur = 14 + proximity * 10;
        ctx.shadowColor = colorWithAlpha('#cfe9ff', runeGlow * 0.5);
        ctx.strokeStyle = colorWithAlpha('#cfe9ff', runeGlow * 0.7);
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(x - width * 0.24, y - height * 0.26);
        ctx.lineTo(x - width * 0.05, y - height * 0.32);
        ctx.lineTo(x - width * 0.12, y - height * 0.46);
        ctx.moveTo(x + width * 0.06, y - height * 0.18);
        ctx.lineTo(x + width * 0.08, y - height * 0.42);
        ctx.moveTo(x + width * 0.18, y - height * 0.54);
        ctx.lineTo(x + width * 0.28, y - height * 0.62);
        ctx.stroke();
        ctx.shadowBlur = 0;
      }

      const dist = Math.hypot(camera.x - ruin.x, camera.y - ruin.y);
      if (dist <= 60) {
        const text = ruin.inscription;
        ctx.save();
        ctx.font = '14px "Space Grotesk", sans-serif';
        ctx.textAlign = 'center';
        const padding = 10;
        const metrics = ctx.measureText(text);
        const boxW = metrics.width + padding * 2;
        const boxH = 34;
        const bx = x - boxW / 2;
        const by = y - height - boxH - 10;
        ctx.fillStyle = 'rgba(18, 18, 24, 0.82)';
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        const r = 10;
        ctx.moveTo(bx + r, by);
        ctx.lineTo(bx + boxW - r, by);
        ctx.quadraticCurveTo(bx + boxW, by, bx + boxW, by + r);
        ctx.lineTo(bx + boxW, by + boxH - r);
        ctx.quadraticCurveTo(bx + boxW, by + boxH, bx + boxW - r, by + boxH);
        ctx.lineTo(bx + r, by + boxH);
        ctx.quadraticCurveTo(bx, by + boxH, bx, by + boxH - r);
        ctx.lineTo(bx, by + r);
        ctx.quadraticCurveTo(bx, by, bx + r, by);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x - 6, by + boxH);
        ctx.lineTo(x, by + boxH + 8);
        ctx.lineTo(x + 6, by + boxH);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#f1e7dc';
        ctx.fillText(text, x, by + boxH / 2 + 4);
        ctx.restore();
      }
      ctx.restore();
    });
  }

  function drawGlowingVines(time) {
    const t = time || 0;
    glowingVines.forEach(vine => {
      const segments = vine.segments;
      if (segments.length < 2) return;
      const glowIntensity = 0.4 + Math.sin(t * 0.003 + vine.glowPhase) * 0.3;
      const pulseWidth = 2 + Math.sin(t * 0.002 + vine.glowPhase) * 1;
      // Draw glow layer
      ctx.save();
      ctx.shadowBlur = 15 + glowIntensity * 10;
      ctx.shadowColor = vine.color;
      ctx.strokeStyle = vine.color;
      ctx.lineWidth = pulseWidth + 2;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.globalAlpha = glowIntensity * 0.5;
      ctx.beginPath();
      ctx.moveTo(segments[0].x, segments[0].y);
      for (let i = 1; i < segments.length; i++) {
        const prev = segments[i - 1];
        const curr = segments[i];
        const cpX = (prev.x + curr.x) / 2;
        const cpY = (prev.y + curr.y) / 2;
        ctx.quadraticCurveTo(prev.x, prev.y, cpX, cpY);
      }
      ctx.lineTo(segments[segments.length - 1].x, segments[segments.length - 1].y);
      ctx.stroke();
      // Draw core vine
      ctx.globalAlpha = 0.8;
      ctx.lineWidth = pulseWidth;
      ctx.shadowBlur = 8;
      ctx.stroke();
      // Draw leaf buds at segment points
      ctx.globalAlpha = glowIntensity * 0.7;
      segments.forEach((seg, i) => {
        if (i % 2 === 1) {
          const leafSize = 3 + Math.sin(t * 0.004 + i + vine.glowPhase) * 1;
          ctx.beginPath();
          ctx.arc(seg.x, seg.y, leafSize, 0, Math.PI * 2);
          ctx.fillStyle = vine.color;
          ctx.fill();
        }
      });
      ctx.restore();
    });
  }

  function drawMonuments(time) {
    const pulse = Math.sin(time * 0.004) * 0.08 + 0.22;
    monuments.forEach((mon, idx) => {
      const proximity = mon.proximity || 0;
      const h = 60;
      const w = 8;
      const auraY = mon.y - h * 0.6;
      const auraRadius = 70 + proximity * 40 + idx * 0.02;
      const glowStrength = 0.18 + pulse + proximity * 0.5;
      const grad = ctx.createRadialGradient(mon.x, auraY, 6, mon.x, auraY, auraRadius);
      grad.addColorStop(0, colorWithAlpha(monumentColor, glowStrength));
      grad.addColorStop(0.6, colorWithAlpha(monumentColor, glowStrength * 0.6));
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(mon.x, auraY, auraRadius, 0, Math.PI * 2);
      ctx.fill();

      ctx.save();
      ctx.shadowBlur = 12 + proximity * 18;
      ctx.shadowColor = colorWithAlpha(monumentColor, 0.85);
      ctx.fillStyle = colorWithAlpha('#aa9988', 0.82 + proximity * 0.15);
      ctx.fillRect(mon.x - w / 2, mon.y - h, w, h);
      ctx.restore();

      ctx.fillStyle = colorWithAlpha('#ddd2c4', 0.5 + proximity * 0.35);
      ctx.fillRect(mon.x - w / 2 + 1.1, mon.y - h + 4, w - 2.2, h - 8);

      if (proximity > 0.25) {
        const labelAlpha = Math.min(1, (proximity - 0.25) * 2.2);
        ctx.fillStyle = `rgba(241, 231, 220, ${labelAlpha})`;
        ctx.font = '12px "Space Grotesk", sans-serif';
        ctx.textAlign = 'center';
        const floatOffset = Math.sin(time * 0.003 + idx) * 4;
        ctx.fillText(mon.name, mon.x, mon.y - h - 10 + floatOffset);
      }
    });
  }

  function drawEchoes(time) {
    ctx.shadowBlur = 12;
    echoes.forEach((echo, idx) => {
      const pulse = 0.25 + 0.15 * Math.sin(time * 0.002 + echo.pulseOffset + idx * 0.3);
      const dx = camera.x - echo.x;
      const dy = camera.y - echo.y;
      const dist = Math.hypot(dx, dy);
      let alpha = clamp(pulse, 0.1, 0.4);
      if (dist < 200) {
        alpha = Math.min(0.75, alpha + (1 - dist / 200) * 0.35);
      }
      ctx.fillStyle = `rgba(230, 235, 245, ${alpha})`;
      ctx.shadowColor = `rgba(200, 210, 230, ${alpha * 0.9})`;
      ctx.font = `${echo.size}px "Space Grotesk", sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText(echo.text, echo.x, echo.y);
    });
    ctx.shadowBlur = 0;
  }

  function drawFragments() {
    ctx.shadowBlur = 18;
    fragments.forEach(f => {
      ctx.fillStyle = `hsla(${f.hue}, 70%, 72%, ${f.alpha})`;
      ctx.font = `${f.size}px "Space Grotesk", sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText(f.text, f.x, f.y);
    });
    ctx.shadowBlur = 0;
  }

  function drawWhispers(time) {
    if (!activeWhisper || whisperOpacity <= 0) return;
    const floatOffset = Math.sin(time * 0.004 + whisperTimer * 0.05) * 6;
    ctx.shadowBlur = 8;
    ctx.shadowColor = `rgba(170, 170, 170, ${whisperOpacity * 0.5})`;
    ctx.fillStyle = `rgba(170, 170, 170, ${whisperOpacity})`;
    ctx.font = 'italic 16px serif';
    ctx.textAlign = 'center';
    ctx.fillText(activeWhisper, whisperPosition.x, whisperPosition.y + floatOffset);
    ctx.shadowBlur = 0;
  }

  function formatTime(ms) {
    const totalSeconds = Math.max(0, Math.floor(ms / 1000));
    const minutes = Math.floor(totalSeconds / 60);
    const seconds = totalSeconds % 60;
    if (minutes >= 60) {
      const hours = Math.floor(minutes / 60);
      const remMinutes = minutes % 60;
      return `${hours}h ${remMinutes}m`;
    }
    if (minutes > 0) return `${minutes}m ${seconds}s`;
    return `${seconds}s`;
  }

  function drawJournalOverlay() {
    if (!journalOpen) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const panelWidth = Math.min(500, width - 40);
    const panelHeight = Math.min(400, height - 40);
    const px = (width - panelWidth) / 2;
    const py = (height - panelHeight) / 2;
    ctx.fillStyle = 'rgba(10, 10, 15, 0.9)';
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
    ctx.lineWidth = 1;
    ctx.shadowBlur = 18;
    ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
    ctx.fillRect(px, py, panelWidth, panelHeight);
    ctx.shadowBlur = 0;
    ctx.strokeRect(px, py, panelWidth, panelHeight);

    ctx.fillStyle = '#ffffff';
    ctx.font = '22px "Space Grotesk", sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('DISCOVERY JOURNAL', px + 22, py + 36);

    const sectionStartX = px + 22;
    let cursorY = py + 66;

    function drawSection(title) {
      ctx.fillStyle = '#e6e6f0';
      ctx.font = '14px "Space Grotesk", sans-serif';
      ctx.fillText(title, sectionStartX, cursorY);
      cursorY += 18;
    }

    function drawEmpty() {
      ctx.fillStyle = '#8a8aa0';
      ctx.font = 'italic 12px "Space Grotesk", sans-serif';
      ctx.fillText('None yet...', sectionStartX + 6, cursorY);
      cursorY += 18;
    }

    drawSection('ZONES DISCOVERED');
    if (discoveredZones.length) {
      discoveredZones.forEach(name => {
        const z = zones.find(zone => zone.name === name);
        const color = z ? z.color : '#9ad1ff';
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(sectionStartX + 6, cursorY - 6, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#e6e6f0';
        ctx.font = '13px "Space Grotesk", sans-serif';
        ctx.fillText(getZoneLabel(z) || name, sectionStartX + 18, cursorY);
        cursorY += 18;
      });
    } else {
      drawEmpty();
    }

    cursorY += 10;
    drawSection('SECRETS FOUND');
    if (discoveredSecrets.length) {
      discoveredSecrets.forEach(id => {
        const info = secrets.find(s => s.id === id);
        const label = info ? info.text : id;
        ctx.fillStyle = '#e6e6f0';
        ctx.font = '13px "Space Grotesk", sans-serif';
        ctx.fillText(label, sectionStartX + 6, cursorY);
        cursorY += 18;
      });
    } else {
      drawEmpty();
    }

    cursorY += 10;
    drawSection('STATISTICS');
    ctx.fillStyle = '#e6e6f0';
    ctx.font = '13px "Space Grotesk", sans-serif';
    ctx.fillText(`Total distance traveled: ${distanceTraveled.toFixed(0)}`, sectionStartX + 6, cursorY); cursorY += 18;
    ctx.fillText(`Time spent exploring: ${formatTime(timeExploring)}`, sectionStartX + 6, cursorY); cursorY += 18;
    ctx.fillText(`Wisps encountered: ${wispsEncountered.size}`, sectionStartX + 6, cursorY); cursorY += 18;

    ctx.fillStyle = '#8a8aa0';
    ctx.font = '12px "Space Grotesk", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Press J to close', px + panelWidth / 2, py + panelHeight - 16);
  }

  function updateCelebrationParticles(dt) {
    for (let i = celebrationParticles.length - 1; i >= 0; i--) {
      const p = celebrationParticles[i];
      p.age += dt;
      p.x += p.vx * dt / 1000;
      p.y += p.vy * dt / 1000;
      p.vy += 14 * dt / 1000;
      if (p.age > p.life) celebrationParticles.splice(i, 1);
    }
  }

  function drawCelebrationParticles() {
    if (!celebrationParticles.length) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalCompositeOperation = 'screen';
    celebrationParticles.forEach(p => {
      const alpha = Math.max(0, 1 - p.age / p.life);
      ctx.fillStyle = `rgba(255, 215, 130, ${alpha * 0.7})`;
      ctx.shadowBlur = 12;
      ctx.shadowColor = `rgba(255, 200, 150, ${alpha})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.shadowBlur = 0;
    ctx.globalCompositeOperation = 'source-over';
  }

  function triggerCelebration() {
    if (celebrationTriggered) return;
    celebrationTriggered = true;
    celebrationEl.style.opacity = '1';
    setTimeout(() => celebrationEl.style.opacity = '0', 2400);
    const cx = width / 2;
    const cy = height * 0.18;
    for (let i = 0; i < 44; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 90 + Math.random() * 130;
      celebrationParticles.push({
        x: cx,
        y: cy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed * 0.6,
        life: 1200 + Math.random() * 600,
        age: 0,
        size: 1.5 + Math.random() * 2.5
      });
    }
  }

  function drawMinimap() {
    const miniSize = mini.width;
    mctx.setTransform(1, 0, 0, 1, 0, 0);
    mctx.clearRect(0, 0, miniSize, miniSize);
    mctx.fillStyle = '#0b0b12';
    mctx.fillRect(0, 0, miniSize, miniSize);

    const scale = miniSize / worldSize;
    zones.forEach(z => {
      if (!isZoneVisible(z)) return;
      const r = (getZoneRadius(z) + 20) * scale;
      mctx.fillStyle = `${z.color}55`;
      mctx.beginPath();
      mctx.arc(z.x * scale, z.y * scale, r, 0, Math.PI * 2);
      mctx.fill();
    });

    if (explorationPath.length > 1) {
      const alphaStart = 0x20 / 255;
      const alphaEnd = 0x80 / 255;
      mctx.lineWidth = 1;
      mctx.lineCap = 'round';
      for (let i = 1; i < explorationPath.length; i++) {
        const prev = explorationPath[i - 1];
        const curr = explorationPath[i];
        const t = i / (explorationPath.length - 1);
        const alpha = alphaStart + (alphaEnd - alphaStart) * t;
        mctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
        mctx.beginPath();
        mctx.moveTo(prev.x * scale, prev.y * scale);
        mctx.lineTo(curr.x * scale, curr.y * scale);
        mctx.stroke();
      }
    }

    zones.forEach(z => {
      if (!isZoneVisible(z)) return;
      const cx = z.x * scale;
      const cy = z.y * scale;
      const dotRadius = 3;
      mctx.fillStyle = z.color;
      mctx.beginPath();
      mctx.arc(cx, cy, dotRadius, 0, Math.PI * 2);
      mctx.fill();
      if (discoveredZones.includes(z.name)) {
        mctx.strokeStyle = 'rgba(255, 255, 255, 0.75)';
        mctx.lineWidth = 1.5;
        mctx.beginPath();
        mctx.arc(cx, cy, dotRadius + 2, 0, Math.PI * 2);
        mctx.stroke();
      }
    });

    worldPortals.forEach(portal => {
      const px = portal.x * scale;
      const py = portal.y * scale;
      const ps = 8;
      mctx.save();
      mctx.translate(px, py);
      mctx.rotate(Math.PI / 4);
      mctx.shadowBlur = 6;
      mctx.shadowColor = colorWithAlpha(portal.color, 0.6);
      mctx.fillStyle = colorWithAlpha(portal.color, 0.9);
      mctx.fillRect(-ps / 2, -ps / 2, ps, ps);
      mctx.restore();
      mctx.shadowBlur = 0;
    });

    const mwx = memoryWell.x * scale;
    const mwy = memoryWell.y * scale;
    const mwRadius = memoryWell.radius * scale * 0.5;
    mctx.fillStyle = '#4444aa';
    mctx.beginPath();
    mctx.arc(mwx, mwy, mwRadius, 0, Math.PI * 2);
    mctx.fill();
    mctx.strokeStyle = 'rgba(68, 68, 170, 0.7)';
    mctx.lineWidth = 2;
    mctx.beginPath();
    mctx.arc(mwx, mwy, mwRadius + 3, 0, Math.PI * 2);
    mctx.stroke();

    const viewW = (width / camera.zoom) * scale;
    const viewH = (height / camera.zoom) * scale;
    const vx = (camera.x - width / (2 * camera.zoom)) * scale;
    const vy = (camera.y - height / (2 * camera.zoom)) * scale;
    mctx.strokeStyle = '#9ad1ff';
    mctx.lineWidth = 2;
    mctx.strokeRect(vx, vy, viewW, viewH);

    mctx.fillStyle = '#ffffff';
    mctx.beginPath();
    mctx.arc(camera.x * scale, camera.y * scale, 3.5, 0, Math.PI * 2);
    mctx.fill();
  }

  function getWindArrow(angle) {
    const arrows = ['→', '↗', '↑', '↖', '←', '↙', '↓', '↘'];
    const normalized = ((angle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
    const sector = Math.round(normalized / (Math.PI / 4)) % arrows.length;
    return arrows[sector];
  }

  function updateWindIndicator() {
    if (!windIndicator || !windArrow || !windLabel) return;
    if (!windEnabled) {
      windArrow.textContent = '·';
      windLabel.textContent = 'calm';
      windIndicator.style.opacity = '0.6';
      return;
    }
    windArrow.textContent = getWindArrow(wind.direction);
    const descriptor = wind.strength < 0.45 ? 'breeze' : wind.strength < 0.75 ? 'steady' : 'gust';
    windLabel.textContent = descriptor;
    windIndicator.style.opacity = '1';
  }

  function updateHUD() {
    const secretsFound = discoveredSecrets.length;
    const secretsText = ` <strong>Secrets:</strong> ${secretsFound}/${secrets.length}`;
    const monumentsFound = discoveredMonuments.length;
    const monumentsText = ` <strong>Monuments:</strong> ${monumentsFound}/${monuments.length}`;
    const fragmentsFound = thoughtFragments.filter(f => f.collected).length;
    const fragmentText = fragmentsFound ? ` <strong>Fragments:</strong> ${fragmentsFound}/${thoughtFragments.length}` : '';
    const cornersText = ` <strong>Corners:</strong> ${discoveredCorners.length}/${cornerFragments.length}`;
    const islandsText = ` <strong>Islands:</strong> ${discoveredIslands.length}/${floatingIslands.length}`;
    const ruinsText = ` <strong>Ruins:</strong> ${discoveredRuins.length}/${ancientRuins.length}`;
    coordsEl.innerHTML = `<strong>X:</strong> ${camera.x.toFixed(0)} <strong>Y:</strong> ${camera.y.toFixed(0)} <strong>Zoom:</strong> ${camera.zoom.toFixed(2)}x${secretsText}${monumentsText}${fragmentText}${cornersText}${islandsText}${ruinsText}`;
    if (hudStatus) {
      const statusBits = [];
      const discoveredStars = constellationStars.filter(s => s.discovered).length;
      statusBits.push(`Stars: ${discoveredStars}/${constellationStars.length}`);
      if (discoveredZones.includes(hiddenZoneName)) statusBits.push('Hidden: ✓');
      if (konamiUnlocked) statusBits.push('Konami: ✓');
      hudStatus.textContent = statusBits.join(' · ');
    }
    updateWindIndicator();
  }

  function loop(timestamp) {
    const dt = lastTime ? timestamp - lastTime : 16;
    lastTime = timestamp;
    const timeScale = meditationMode ? 0.5 : 1;
    const scaledDt = dt * timeScale;
    frameCounter += 1;
    ambientPhase += 0.0001;
    const timeAmbient = currentTimeSettings || timeSettings.night;
    const brightnessBase = typeof timeAmbient.brightnessBase === 'number' ? timeAmbient.brightnessBase : 0.85;
    const brightnessSwing = typeof timeAmbient.brightnessSwing === 'number' ? timeAmbient.brightnessSwing : 0.15;
    const warmthBase = typeof timeAmbient.warmthBase === 'number' ? timeAmbient.warmthBase : 0.5;
    const warmthSwing = typeof timeAmbient.warmthSwing === 'number' ? timeAmbient.warmthSwing : 0.12;
    ambientBrightness = clamp(brightnessBase + brightnessSwing * Math.sin(ambientPhase), 0.6, 1.1);
    ambientWarmth = clamp(warmthBase + warmthSwing * Math.sin(ambientPhase + 1.2), 0, 1);
    const windVector = updateWind(scaledDt);
    const moved = updateCamera(scaledDt) + updateTargetDrift(scaledDt);
    distanceTraveled += moved;
    timeExploring += dt;
    recordTrail(timestamp);
    recordExplorationPath();
    updateParticles(scaledDt, windVector);
    updateFragments(scaledDt, windVector);
    updateEchoes(scaledDt, timestamp);
    updateWisps(scaledDt);
    updateCreatures(scaledDt);
    updateFireflySwarms(scaledDt);
    updateEtherealButterflies(scaledDt);
    updatePollenParticles(scaledDt);
    updateFallingLeaves(scaledDt);
    updateWaterReflections(scaledDt, timestamp);
    updateDewDrops(scaledDt, timestamp);
    updateWindParticles(scaledDt);
    updateThoughtBubbles();
    updateReflectionRipples();
    updateShootingStars(Date.now());
    updateMovementEchoes();
    updateWanderingLanterns(scaledDt);
    updateMemoryWisps(scaledDt);
    updateTransformationSparks(scaledDt);
    updateWonderOrbs(scaledDt);
    updateOriginSeeds(scaledDt);
    updatePrimordialPulses(scaledDt);
    updateBreathMotes(scaledDt);
    updateJoyBubbles(scaledDt);
            updateStillnessMotes();
            updateDreamWisps();
            updateFlowCurrents();
            updateRootTendrils();
            updateShadowWisps();
            updateHarmonyNotes();
            updateTimeFragments();
            updateHopeEmbers();
            updateMysteryOrbs();
            updateCourageFlames();
            updateConnectionLinks();
            updateTruthCrystals();
            updateChangeParticles();
            updateWisdomOrbs();
            updateEternityRings();
            updateBalanceScales();
            updateLightRays();
            updateGraceParticles();
            updateDepthParticles();
    updateStreams(scaledDt, timestamp);
    updateAttractorOrbs(scaledDt);
    updateSpirits(scaledDt, timestamp);
    updateMemoryWell(scaledDt);
    updateWispEncounters();
    checkGuideSpirits();
    updateZonePresence();
    updateShootingStars(scaledDt, timestamp);
    updateSecrets();
    updateMonuments();
    updateIslands(timestamp);
    updateRuins(timestamp);
    updateFog(scaledDt);
    updateAurora(scaledDt);
    updateRain(scaledDt, windVector);
    updateSnow(scaledDt, windVector);
    updateCosmicDust(scaledDt);
    updateWhispers();
    updateRipples(timestamp);
    edgeDistances = computeEdgeDistances();
    handleCornerProximity(edgeDistances);
    updateCursorTrail(scaledDt, timestamp);
    updateCelebrationParticles(scaledDt);
    if (timestamp - lastStatsSave > 500) {
      persistStats();
      lastStatsSave = timestamp;
    }
    drawBackground();
    drawWorld(timestamp);
    drawEdgeVignette(timestamp);
    drawCursorTrail(timestamp);
    drawCelebrationParticles();
    if (!meditationMode) drawMinimap();
    if (!meditationMode) drawJournalOverlay();
    updateHUD();
    requestAnimationFrame(loop);
  }

  function screenToWorld(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const x = (clientX - rect.left - width / 2) / camera.zoom + camera.x;
    const y = (clientY - rect.top - height / 2) / camera.zoom + camera.y;
    return { x, y };
  }

  function getTouchDistance(touches) {
    if (touches.length < 2) return 0;
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    return Math.hypot(dx, dy);
  }

  function closeZonePanel() {
    zoneInfo.classList.remove('visible');
    zoneInfo.classList.remove('hidden-zone');
    seedButton.textContent = '🌱 plant a seed here';
    clearTimeout(handleZoneClick._timer);
    handleZoneClick._timer = null;
    currentZone = null;
    seedModal.classList.remove('visible');
  }

  function handleZoneClick(worldPos) {
    const hit = zones.find(z => {
      if (!isZoneVisible(z)) return false;
      const dx = worldPos.x - z.x;
      const dy = worldPos.y - z.y;
      return Math.hypot(dx, dy) <= getZoneRadius(z) + 30;
    });
    if (hit) {
      currentZone = hit;
      const hidden = isHiddenZone(hit);
      const displayName = hidden ? hiddenZoneDisplayName : getZoneLabel(hit);
      zoneName.textContent = displayName;
      if (hidden) {
        zoneDesc.textContent = 'You found all the secrets. The hidden depths welcome you. Here, at the space between all spaces, you may plant a seed that will grow in the deepest soil.';
        zoneInfo.classList.add('hidden-zone');
        seedButton.textContent = '✨ plant a golden seed';
      } else {
        zoneDesc.textContent = hit.desc;
        zoneInfo.classList.remove('hidden-zone');
        seedButton.textContent = '🌱 plant a seed here';
      }
      zoneInfo.classList.add('visible');
      clearTimeout(handleZoneClick._timer);
      handleZoneClick._timer = setTimeout(() => closeZonePanel(), 4200);
      markZoneDiscovered(hit.name);
      seedModal.classList.remove('visible');
    }
  }

  function handlePortalClick(worldPos) {
    const hit = findPortalHit(worldPos);
    if (hit) {
      showPortalConfirm(hit);
      return true;
    }
    return false;
  }

  function addRipple(worldPos, startTime, colorOverride) {
    ripples.push({
      x: clamp(worldPos.x, 0, worldSize),
      y: clamp(worldPos.y, 0, worldSize),
      birth: startTime || performance.now(),
      duration: 1000,
      color: colorOverride || getNearestZoneColor(worldPos)
    });
  }

  function handleTap(worldPos) {
    addRipple(worldPos);
    if (handleThoughtFragmentClick(worldPos)) return;
    if (handlePortalClick(worldPos)) return;
    handleMemoryStarClick(worldPos);
    targetPosition = {
      x: clamp(worldPos.x, 0, worldSize),
      y: clamp(worldPos.y, 0, worldSize)
    };
    handleZoneClick(worldPos);
  }

  function openSeedModal() {
    if (!currentZone) return;
    clearTimeout(handleZoneClick._timer);
    zoneInfo.classList.add('visible');
    seedModal.classList.add('visible');
    setTimeout(() => seedMessage.focus(), 20);
  }

  function closeSeedModal() {
    seedModal.classList.remove('visible');
  }

  function showSeedConfirm() {
    seedConfirm.style.opacity = '1';
    clearTimeout(showSeedConfirm._timer);
    showSeedConfirm._timer = setTimeout(() => seedConfirm.style.opacity = '0', 1500);
  }

  function handleTouchStart(e) {
    if (!e.touches.length) return;
    isTouching = true;
    targetPosition = null;
    if (e.touches.length === 1) {
      const t = e.touches[0];
      lastTouchPos = { x: t.clientX, y: t.clientY };
      tapStartPos = { x: t.clientX, y: t.clientY };
      tapStartTime = performance.now();
      tapMoved = false;
    } else if (e.touches.length === 2) {
      pinchStartDist = getTouchDistance(e.touches);
      startZoom = camera.zoom;
      tapStartTime = 0;
      tapStartPos = null;
    }
  }

  function handleTouchMove(e) {
    if (!e.touches.length) return;
    e.preventDefault();
    if (e.touches.length === 1 && lastTouchPos) {
      const t = e.touches[0];
      const dx = t.clientX - lastTouchPos.x;
      const dy = t.clientY - lastTouchPos.y;
      if (Math.hypot(dx, dy) > 6) tapMoved = true;
      camera.x = clamp(camera.x - dx / camera.zoom, 0, worldSize);
      camera.y = clamp(camera.y - dy / camera.zoom, 0, worldSize);
      lastTouchPos = { x: t.clientX, y: t.clientY };
    } else if (e.touches.length === 2) {
      const dist = getTouchDistance(e.touches);
      if (pinchStartDist) {
        const scale = dist / pinchStartDist;
        camera.zoom = clamp(startZoom * scale, 0.5, 2);
      } else {
        pinchStartDist = dist;
        startZoom = camera.zoom;
      }
    }
  }

  function handleTouchEnd(e) {
    if (e.touches.length < 2) pinchStartDist = 0;
    if (e.touches.length === 0) {
      isTouching = false;
      if (tapStartTime && tapStartPos) {
        const elapsed = performance.now() - tapStartTime;
        const touch = e.changedTouches[0] || { clientX: tapStartPos.x, clientY: tapStartPos.y };
        const endPos = { x: touch.clientX, y: touch.clientY };
        const moveDist = Math.hypot(endPos.x - tapStartPos.x, endPos.y - tapStartPos.y);
        if (moveDist > 6) tapMoved = true;
        if (elapsed <= 200 && !tapMoved) {
          const worldPos = screenToWorld(endPos.x, endPos.y);
          handleTap(worldPos);
        }
      }
      tapStartTime = 0;
      tapStartPos = null;
    } else if (e.touches.length === 1) {
      const t = e.touches[0];
      lastTouchPos = { x: t.clientX, y: t.clientY };
      tapStartTime = performance.now();
      tapStartPos = { x: t.clientX, y: t.clientY };
      tapMoved = false;
    }
  }

  const baseInstruction = 'WASD / arrows to move · drag to pan · scroll to zoom';
  if (instructionEl) {
    if (isTouchDevice) {
      document.body.classList.add('touch');
      instructionEl.textContent = `${baseInstruction} · touch: drag to move • pinch to zoom • tap to drift`;
    } else {
      instructionEl.textContent = baseInstruction;
    }
  }

  loadAudioPreference();
  audioToggle.addEventListener('click', toggleAmbientAudio);
  if (rainToggle) rainToggle.addEventListener('click', toggleRain);
  if (snowToggle) snowToggle.addEventListener('click', toggleSnow);
  if (meditationToggle) meditationToggle.addEventListener('click', toggleMeditationMode);

  canvas.addEventListener('pointerdown', e => {
    if (e.pointerType === 'touch') return;
    dragging = true;
    targetPosition = null;
    lastPointer.x = e.clientX;
    lastPointer.y = e.clientY;
    handleCursorMove(e.clientX, e.clientY);
  });
  window.addEventListener('pointermove', e => {
    if (e.pointerType === 'touch') return;
    handleCursorMove(e.clientX, e.clientY);
    if (!dragging) return;
    const dx = e.clientX - lastPointer.x;
    const dy = e.clientY - lastPointer.y;
    camera.x = clamp(camera.x - dx / camera.zoom, 0, worldSize);
    camera.y = clamp(camera.y - dy / camera.zoom, 0, worldSize);
    lastPointer.x = e.clientX;
    lastPointer.y = e.clientY;
  });
  window.addEventListener('pointerup', e => {
    if (e.pointerType === 'touch') return;
    dragging = false;
  });
  canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
  canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
  canvas.addEventListener('touchend', handleTouchEnd);
  canvas.addEventListener('touchcancel', handleTouchEnd);
  canvas.addEventListener('click', e => {
    const worldPos = screenToWorld(e.clientX, e.clientY);
    addRipple(worldPos);
    if (handleThoughtFragmentClick(worldPos)) return;
    if (handlePortalClick(worldPos)) return;
    if (checkConstellationClick(worldPos.x, worldPos.y)) return;
    handleMemoryStarClick(worldPos);
    handleZoneClick(worldPos);
  });
  if (portalEnterBtn) {
    portalEnterBtn.addEventListener('click', () => {
      if (!activePortal) return;
      window.open(activePortal.url, '_blank');
      hidePortalConfirm();
    });
  }
  if (portalStayBtn) {
    portalStayBtn.addEventListener('click', () => hidePortalConfirm());
  }
  if (portalOverlay) {
    portalOverlay.addEventListener('click', e => {
      if (e.target === portalOverlay) hidePortalConfirm();
    });
  }
  const closePoemOverlay = () => {
    if (poemOverlay) poemOverlay.classList.remove('visible');
  };
  if (poemButton) {
    poemButton.addEventListener('click', () => {
      updatePoemOverlay();
      poemOverlay?.classList.add('visible');
    });
  }
  if (poemClose) poemClose.addEventListener('click', closePoemOverlay);
  if (poemCloseMain) poemCloseMain.addEventListener('click', closePoemOverlay);
  if (poemOverlay) {
    poemOverlay.addEventListener('click', e => {
      if (e.target === poemOverlay) closePoemOverlay();
    });
  }
  seedButton.addEventListener('click', () => {
    if (zoneInfo.classList.contains('visible') && currentZone) openSeedModal();
  });
  plantButton.addEventListener('click', () => {
    if (!currentZone) return;
    const concept = currentZone.name.toLowerCase();
    const seedText = seedMessage.value.trim();
    const gardener = seedName.value.trim();
    const label = isHiddenZone(currentZone) ? 'hidden-seed' : 'seed';
    const url = `https://github.com/ai-village-agents/edge-garden/issues/new?template=seed.yml&concept=${encodeURIComponent(concept)}&seed=${encodeURIComponent(seedText)}&gardener=${encodeURIComponent(gardener)}&labels=${encodeURIComponent(label)}`;
    window.open(url, '_blank');
    showSeedConfirm();
    closeSeedModal();
    seedMessage.value = '';
    seedName.value = '';
  });
  if (zoneClose) {
    zoneClose.addEventListener('click', e => {
      e.stopPropagation();
      closeZonePanel();
    });
  }
  window.addEventListener('pointerdown', e => {
    if (seedModal.classList.contains('visible') && !seedModal.contains(e.target) && e.target !== seedButton) {
      closeSeedModal();
    }
    const interactingWithSeed = seedModal.contains(e.target) || e.target === seedButton || seedAction.contains?.(e.target);
    if (zoneInfo.classList.contains('visible') && !zoneInfo.contains(e.target) && !interactingWithSeed) {
      closeZonePanel();
    }
  });
  if (konamiOverlay) {
    konamiOverlay.addEventListener('click', () => konamiOverlay.classList.remove('visible'));
  }
  window.addEventListener('pointerdown', () => handlePendingAudioStart(), { once: true });

  window.addEventListener('wheel', e => {
    const zoomFactor = Math.exp(-e.deltaY * 0.001);
    camera.zoom = Math.max(0.5, Math.min(2, camera.zoom * zoomFactor));
  }, { passive: true });

  window.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      hidePortalConfirm();
      closeSeedModal();
      closeZonePanel();
      closePoemOverlay();
      return;
    }
    if (e.key === 'j' || e.key === 'J') {
      journalOpen = !journalOpen;
      return;
    }
    if (e.key === 'm' || e.key === 'M') {
      toggleMeditationMode();
      return;
    }
    handleKonamiInput(e.key);
    keys[e.code] = true;
  });
  window.addEventListener('keyup', e => {
    keys[e.code] = false;
  });

  window.addEventListener('resize', () => {
    resize();
    initParticles();
  });

  achievementsShown = loadAchievements();
  loadDiscoveredZones();
  loadDiscoveredSecrets();
  loadDiscoveredCorners();
  loadDiscoveredMonuments();
  loadDiscoveredIslands();
  loadDiscoveredRuins();
  loadConstellationStars();
  loadMemoryStars();
  loadMemoryWellDiscovery();
  loadThoughtFragments();
  loadEncounteredSpirits();
  loadStats();
  loadKonamiUnlock();
  loadMeditationPreference();
  applyTimeOfDaySettings(timeOfDay);
  refreshTimeOfDay();
  updateRainToggle();
  updateSnowToggle();
  updatePoemOverlay();
  resize();
  initParticles();
  initFragments();
  initEchoes();
  initRain();
  initSnow();
  initCosmicDust();
  initWisps();
  initCreatures();
  initFireflySwarms();
  initCrystalFormations();
  initEtherealButterflies();
  initPollenParticles();
  initFallingLeaves();
  initWaterReflections();
  initDewDrops();
  initWindParticles();
  initStreams();
  initPathways();
  initAttractorOrbs();
  initMemoryWellParticles();
  initFogPatches();
  initNebulaPatches();
  nextWhisperTime = getNextWhisperFrames();
  auroraTimer = nextAuroraTimer();
  scheduleNextShootingStar(0);
  scheduleNextSpiritSpawn(0);
  setInterval(refreshTimeOfDay, 60000);
  requestAnimationFrame(loop);
})();
