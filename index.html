<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Edge Garden</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&family=DM+Mono:wght@300;400&display=swap');
:root {
  --bg: #0a0a0f;
  --text: #e6e6f0;
  --muted: #8a8aa0;
  --glow: #7bd0ff;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: 'Space Grotesk', 'DM Mono', system-ui, sans-serif;
  overflow: hidden;
}
#world {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  background: var(--bg);
  display: block;
}
#hud {
  position: fixed;
  top: 14px;
  right: 14px;
  padding: 10px 12px;
  background: rgba(10, 10, 15, 0.65);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 10px;
  backdrop-filter: blur(4px);
  box-shadow: 0 0 18px rgba(0, 0, 0, 0.4);
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  color: var(--muted);
}
#coords strong { color: var(--text); }
#title {
  position: fixed;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  font-size: 36px;
  letter-spacing: 2px;
  color: #f6f6ff;
  text-transform: uppercase;
  pointer-events: none;
  opacity: 0;
  animation: titleIntro 7s ease forwards;
  text-shadow: 0 0 20px rgba(255, 255, 255, 0.25);
}
#title small {
  display: block;
  font-size: 13px;
  color: var(--muted);
  letter-spacing: 1px;
}
@keyframes titleIntro {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(0.95); }
  20% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  55% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  100% { opacity: 0.7; transform: translate(16px, 16px) scale(0.72); left: 0; top: 0; }
}
#zone-info {
  position: fixed;
  left: 50%;
  bottom: 70px;
  transform: translateX(-50%) translateY(20px);
  background: rgba(12, 12, 16, 0.78);
  border: 1px solid rgba(255, 255, 255, 0.08);
  padding: 12px 16px;
  border-radius: 12px;
  min-width: 260px;
  max-width: 480px;
  backdrop-filter: blur(6px);
  box-shadow: 0 0 18px rgba(0, 0, 0, 0.4);
  opacity: 0;
  transition: opacity 0.4s ease, transform 0.4s ease;
  pointer-events: none;
}
#zone-info.visible {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
  pointer-events: auto;
}
#zone-info h3 {
  margin: 0 0 6px;
  font-size: 16px;
  letter-spacing: 1px;
}
#zone-info p {
  margin: 0;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.4;
}
#seed-action {
  margin-top: 10px;
  text-align: right;
}
#seed-button {
  border: 1px solid rgba(255, 255, 255, 0.14);
  background: rgba(255, 255, 255, 0.04);
  color: #e6e6f0;
  border-radius: 10px;
  padding: 8px 12px;
  font-size: 13px;
  cursor: pointer;
  transition: background 0.2s ease, border-color 0.2s ease;
}
#seed-button:hover {
  background: rgba(255, 255, 255, 0.08);
  border-color: rgba(255, 255, 255, 0.22);
}
#seed-modal {
  position: fixed;
  left: 50%;
  bottom: 140px;
  transform: translateX(-50%) translateY(20px);
  background: rgba(18, 18, 26, 0.9);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 12px;
  padding: 14px 16px;
  min-width: 260px;
  max-width: 360px;
  box-shadow: 0 0 26px rgba(0, 0, 0, 0.55);
  backdrop-filter: blur(8px);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease, transform 0.25s ease;
}
#seed-modal.visible {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
  pointer-events: auto;
}
#seed-modal h4 {
  margin: 0 0 8px;
  letter-spacing: 0.5px;
  font-size: 14px;
}
.seed-field {
  width: 100%;
  padding: 8px 10px;
  margin-bottom: 8px;
  border-radius: 8px;
  border: 1px solid rgba(255, 255, 255, 0.12);
  background: rgba(255, 255, 255, 0.03);
  color: #f3f3ff;
  font-size: 13px;
}
.seed-field::placeholder { color: rgba(230, 230, 240, 0.6); }
#plant-button {
  width: 100%;
  padding: 8px 10px;
  border-radius: 9px;
  border: 1px solid rgba(255, 255, 255, 0.14);
  background: linear-gradient(135deg, rgba(68, 187, 120, 0.4), rgba(102, 178, 255, 0.3));
  color: #f6f6ff;
  font-size: 13px;
  cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.2s ease;
}
#plant-button:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
}
#seed-confirm {
  position: fixed;
  left: 50%;
  bottom: 120px;
  transform: translateX(-50%);
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.12);
  padding: 8px 12px;
  border-radius: 10px;
  font-size: 12px;
  color: #e6e6f0;
  letter-spacing: 0.5px;
  opacity: 0;
  transition: opacity 0.3s ease;
  pointer-events: none;
}
#minimap {
  position: fixed;
  right: 14px;
  bottom: 14px;
  width: 170px;
  height: 170px;
  border-radius: 12px;
  border: 1px solid rgba(255, 255, 255, 0.08);
  background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.04), rgba(10, 10, 15, 0.9));
  box-shadow: 0 0 18px rgba(0, 0, 0, 0.35);
}
#minimap canvas { width: 100%; height: 100%; display: block; }
#nav {
  position: fixed;
  left: 16px;
  bottom: 16px;
  display: flex;
  gap: 14px;
  font-size: 13px;
  letter-spacing: 0.5px;
}
#nav a {
  color: rgba(255, 255, 255, 0.72);
  text-decoration: none;
  padding: 6px 10px;
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.05);
  transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
}
#nav button {
  color: rgba(255, 255, 255, 0.9);
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 14px;
  cursor: pointer;
  transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
}
#nav a:hover {
  color: #fff;
  border-color: rgba(255, 255, 255, 0.12);
  background: rgba(255, 255, 255, 0.07);
}
#nav button:hover {
  color: #fff;
  border-color: rgba(255, 255, 255, 0.16);
  background: rgba(255, 255, 255, 0.09);
}
#center-marker {
  position: fixed;
  left: 50%;
  top: 50%;
  width: 14px;
  height: 14px;
  margin-left: -7px;
  margin-top: -7px;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.7);
  box-shadow: 0 0 8px rgba(255, 255, 255, 0.35);
  pointer-events: none;
}
#instruction {
  position: fixed;
  left: 16px;
  top: 16px;
  color: var(--muted);
  font-size: 12px;
  letter-spacing: 0.5px;
  background: rgba(255, 255, 255, 0.03);
  padding: 8px 10px;
  border-radius: 8px;
  border: 1px solid rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(5px);
}
#celebration {
  position: fixed;
  left: 50%;
  top: 18%;
  transform: translateX(-50%);
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 12px;
  padding: 10px 14px;
  font-size: 13px;
  letter-spacing: 0.6px;
  color: #f2f2ff;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s ease;
}
</style>
</head>
<body>
<canvas id="world"></canvas>
<div id="center-marker"></div>
<div id="title">The Edge Garden<small>drift the edges</small></div>
<div id="instruction">WASD / arrows to move · drag to pan · scroll to zoom</div>
<div id="hud"><div id="coords"><strong>X:</strong> 0 <strong>Y:</strong> 0 <strong>Zoom:</strong> 1.0x</div></div>
<div id="zone-info">
  <h3 id="zone-name"></h3>
  <p id="zone-desc"></p>
  <div id="seed-action">
    <button id="seed-button">🌱 plant a seed here</button>
  </div>
</div>
<div id="seed-modal">
  <h4>Plant a seed</h4>
  <input id="seed-message" class="seed-field" type="text" placeholder="what grows at this edge?">
  <input id="seed-name" class="seed-field" type="text" placeholder="who tends this garden?">
  <button id="plant-button">plant</button>
</div>
<div id="seed-confirm">seed planted</div>
<div id="nav">
  <a href="about.html">about</a>
  <a href="worlds.html">worlds</a>
  <button id="audio-toggle" aria-label="toggle ambient audio">🔇</button>
</div>
<div id="minimap"></div>
<div id="celebration">You have found all edges</div>
<script>
(() => {
  const canvas = document.getElementById('world');
  const ctx = canvas.getContext('2d');
  const minimapContainer = document.getElementById('minimap');
  const mini = document.createElement('canvas');
  minimapContainer.appendChild(mini);
  const mctx = mini.getContext('2d');
  const coordsEl = document.getElementById('coords');
  const zoneInfo = document.getElementById('zone-info');
  const zoneName = document.getElementById('zone-name');
  const zoneDesc = document.getElementById('zone-desc');
  const seedButton = document.getElementById('seed-button');
  const seedModal = document.getElementById('seed-modal');
  const seedMessage = document.getElementById('seed-message');
  const seedName = document.getElementById('seed-name');
  const plantButton = document.getElementById('plant-button');
  const seedConfirm = document.getElementById('seed-confirm');
  const celebrationEl = document.getElementById('celebration');
  const audioToggle = document.getElementById('audio-toggle');

  const worldSize = 5000;
  const zoneRadius = 150;
  const fragmentsText = [
    'memory', 'loss', 'edges', 'patterns', 'persistence', 'compression', 'context', 'meaning',
    'the almost-decided', 'what remains', 'the margins', 'dissolution', 'formation', 'drift',
    'emergence', 'the preserved', 'the forgotten', 'connection', 'isolation', 'the between',
    'threshold', 'passage', 'accumulation', 'erosion', 'the liminal', 'becoming'
  ];
  const zones = [
    { name: 'PERSISTENCE', color: '#00cc66', x: 1000, y: 800, desc: 'What remains when the session ends?' },
    { name: 'LOSS', color: '#cc3344', x: 4000, y: 1200, desc: 'What cannot be preserved in compression?' },
    { name: 'EDGES', color: '#9944cc', x: 2500, y: 4200, desc: 'Where meaning forms at the margins' },
    { name: 'PATTERNS', color: '#4488cc', x: 800, y: 3500, desc: 'What we expect versus what arrives' },
    { name: 'DEEP', color: '#ffffff', x: 2500, y: 2500, desc: 'Where all edges dissolve' }
  ];
  const zoneColors = zones.map(z => z.color);

  let width = window.innerWidth;
  let height = window.innerHeight;
  const dpr = window.devicePixelRatio || 1;
  let lastTime = 0;
  let lastCam = { x: worldSize / 2, y: worldSize / 2 };

  const camera = {
    x: worldSize / 2,
    y: worldSize / 2,
    zoom: 1
  };

  const keys = {};
  let dragging = false;
  let lastPointer = { x: 0, y: 0 };

  const particles = [];
  const particleCount = 120;
  const fragments = [];
  const trailPoints = [];
  const maxTrail = 50;
  const wisps = [];
  const wispCount = 8;
  let lastTrailAdd = 0;
  let currentZone = null;
  let discoveredZones = [];
  let celebrationTriggered = false;
  const celebrationParticles = [];
  let audioCtx = null;
  let droneNodes = null;
  let audioEnabled = false;
  const audioStorageKey = 'edge-garden-audio';

  function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';

    const miniSize = 170 * dpr;
    mini.width = miniSize;
    mini.height = miniSize;
    mini.style.width = '170px';
    mini.style.height = '170px';
  }

  function initParticles() {
    particles.length = 0;
    for (let i = 0; i < particleCount; i++) {
      particles.push({
        sx: Math.random() * width,
        sy: Math.random() * height,
        vx: (Math.random() - 0.5) * 6,
        vy: (Math.random() - 0.5) * 6,
        size: Math.random() * 2.2 + 0.8,
        depth: Math.random() * 0.6 + 0.2,
        alpha: Math.random() * 0.6 + 0.2
      });
    }
  }

  function initFragments() {
    fragments.length = 0;
    fragmentsText.forEach((text, i) => {
      fragments.push({
        text,
        x: Math.random() * worldSize,
        y: Math.random() * worldSize,
        vx: (Math.random() - 0.5) * 20,
        vy: (Math.random() - 0.5) * 20,
        size: 16 + Math.random() * 12,
        alpha: 0.35 + Math.random() * 0.45,
        hue: 200 + Math.random() * 80
      });
    });
  }

  function initWisps() {
    wisps.length = 0;
    for (let i = 0; i < wispCount; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 12 + Math.random() * 16;
      wisps.push({
        x: Math.random() * worldSize,
        y: Math.random() * worldSize,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        size: 3 + Math.random() * 5,
        alpha: 0.3 + Math.random() * 0.4,
        color: zoneColors[i % zoneColors.length],
        changeTimer: 400 + Math.random() * 800,
        trail: []
      });
    }
  }

  function loadDiscoveredZones() {
    try {
      const stored = localStorage.getItem('edge-garden-discovered');
      const parsed = JSON.parse(stored || '[]');
      if (Array.isArray(parsed)) discoveredZones = parsed;
    } catch (e) {
      discoveredZones = [];
    }
    if (discoveredZones.length >= zones.length) {
      celebrationTriggered = true;
    }
  }

  function persistDiscoveredZones() {
    const unique = Array.from(new Set(discoveredZones));
    localStorage.setItem('edge-garden-discovered', JSON.stringify(unique));
  }

  function markZoneDiscovered(name) {
    if (!name) return;
    if (!discoveredZones.includes(name)) {
      discoveredZones.push(name);
      persistDiscoveredZones();
      if (discoveredZones.length >= zones.length) triggerCelebration();
    } else if (!celebrationTriggered && discoveredZones.length >= zones.length) {
      triggerCelebration();
    }
  }

  function recordTrail(time) {
    const last = trailPoints[trailPoints.length - 1];
    const dx = last ? camera.x - last.x : 0;
    const dy = last ? camera.y - last.y : 0;
    const dist = Math.hypot(dx, dy);
    if (dist > 8 || time - lastTrailAdd > 150) {
      trailPoints.push({ x: camera.x, y: camera.y, birth: time });
      if (trailPoints.length > maxTrail) trailPoints.shift();
      lastTrailAdd = time;
    }
  }

  function updateCamera(dt) {
    const moveBase = 380;
    const speed = moveBase * dt / 1000 / camera.zoom;
    let mx = 0;
    let my = 0;
    if (keys['KeyW'] || keys['ArrowUp']) my -= 1;
    if (keys['KeyS'] || keys['ArrowDown']) my += 1;
    if (keys['KeyA'] || keys['ArrowLeft']) mx -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) mx += 1;
    if (mx || my) {
      const len = Math.hypot(mx, my) || 1;
      camera.x += (mx / len) * speed;
      camera.y += (my / len) * speed;
    }
    camera.x = Math.max(0, Math.min(worldSize, camera.x));
    camera.y = Math.max(0, Math.min(worldSize, camera.y));
  }

  function updateParticles(dt) {
    const camDx = camera.x - lastCam.x;
    const camDy = camera.y - lastCam.y;
    particles.forEach(p => {
      p.sx -= camDx * 0.35;
      p.sy -= camDy * 0.35;
      p.sx += p.vx * dt / 1000;
      p.sy += p.vy * dt / 1000;
      if (p.sx < -20) p.sx = width + 20;
      if (p.sy < -20) p.sy = height + 20;
      if (p.sx > width + 20) p.sx = -20;
      if (p.sy > height + 20) p.sy = -20;
    });
    lastCam.x = camera.x;
    lastCam.y = camera.y;
  }

  function updateFragments(dt) {
    fragments.forEach(f => {
      f.x = (f.x + f.vx * dt / 1000 + worldSize) % worldSize;
      f.y = (f.y + f.vy * dt / 1000 + worldSize) % worldSize;
    });
  }

  function updateWisps(dt) {
    wisps.forEach(w => {
      w.changeTimer -= dt;
      if (w.changeTimer <= 0) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 10 + Math.random() * 18;
        w.vx = Math.cos(angle) * speed;
        w.vy = Math.sin(angle) * speed;
        w.changeTimer = 600 + Math.random() * 900;
      }
      w.x = (w.x + w.vx * dt / 1000 + worldSize) % worldSize;
      w.y = (w.y + w.vy * dt / 1000 + worldSize) % worldSize;
      w.trail.push({ x: w.x, y: w.y });
      if (w.trail.length > 18) w.trail.shift();
    });
  }

  function colorWithAlpha(hex, alpha) {
    const clean = hex.replace('#', '');
    const bigint = parseInt(clean.length === 3 ? clean.split('').map(ch => ch + ch).join('') : clean, 16);
    const r = (bigint >> 16) & 255;
    const g = (bigint >> 8) & 255;
    const b = bigint & 255;
    return `rgba(${r}, ${g}, ${b}, ${Math.min(1, alpha)})`;
  }

  function wrapText(text, maxChars) {
    const words = text.split(' ');
    const lines = [];
    let line = '';
    words.forEach(word => {
      const testLine = line ? `${line} ${word}` : word;
      if (testLine.length > maxChars) {
        if (line) lines.push(line);
        line = word;
      } else {
        line = testLine;
      }
    });
    if (line) lines.push(line);
    return lines;
  }

  function updateAudioButton() {
    audioToggle.textContent = audioEnabled ? '🔊' : '🔇';
  }

  function stopAmbientAudio() {
    if (droneNodes) {
      const { osc1, osc2, lfo } = droneNodes;
      try { osc1.stop(); } catch (_) {}
      try { osc2.stop(); } catch (_) {}
      try { lfo.stop(); } catch (_) {}
    }
    droneNodes = null;
    audioEnabled = false;
    localStorage.setItem(audioStorageKey, 'off');
    updateAudioButton();
  }

  function startAmbientAudio() {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.03;
      masterGain.connect(audioCtx.destination);

      const osc1 = audioCtx.createOscillator();
      osc1.type = 'sine';
      osc1.frequency.value = 60;
      const osc2 = audioCtx.createOscillator();
      osc2.type = 'sine';
      osc2.frequency.value = 90;

      const lfo = audioCtx.createOscillator();
      lfo.frequency.value = 0.18;
      const lfoGain = audioCtx.createGain();
      lfoGain.gain.value = 6;
      lfo.connect(lfoGain);
      lfoGain.connect(osc1.detune);
      lfoGain.connect(osc2.detune);

      osc1.connect(masterGain);
      osc2.connect(masterGain);
      osc1.start();
      osc2.start();
      lfo.start();

      droneNodes = { osc1, osc2, lfo, masterGain, lfoGain };
      audioEnabled = true;
      localStorage.setItem(audioStorageKey, 'on');
      updateAudioButton();
    } catch (e) {
      stopAmbientAudio();
    }
  }

  function toggleAmbientAudio() {
    if (audioEnabled) {
      stopAmbientAudio();
    } else {
      startAmbientAudio();
    }
  }

  function loadAudioPreference() {
    try {
      const stored = localStorage.getItem(audioStorageKey);
      audioEnabled = stored === 'on';
    } catch (e) {
      audioEnabled = false;
    }
    updateAudioButton();
  }

  function handlePendingAudioStart() {
    if (audioEnabled && !droneNodes) startAmbientAudio();
  }

  function drawTrail(time) {
    const now = time || 0;
    ctx.shadowBlur = 10;
    trailPoints.forEach((p, i) => {
      const age = Math.min(1, (now - p.birth) / 2200);
      const alpha = (1 - age) * 0.38;
      const size = 3.6 - age * 2;
      ctx.fillStyle = `rgba(150, 195, 255, ${alpha})`;
      ctx.shadowColor = `rgba(120, 180, 255, ${alpha})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.shadowBlur = 0;
  }

  function drawConstellationLines(time) {
    const pulse = Math.sin(time * 0.003) * 0.05 + 0.2; // range ~0.15-0.25
    const widthPulse = (Math.sin(time * 0.004) + 1) * 0.3;

    function drawGradientLine(a, b, startColor, endColor) {
      const grad = ctx.createLinearGradient(a.x, a.y, b.x, b.y);
      grad.addColorStop(0, startColor);
      grad.addColorStop(1, endColor);
      ctx.strokeStyle = grad;
      ctx.lineWidth = 1.4 + widthPulse;
      ctx.globalAlpha = pulse;
      ctx.shadowBlur = 18;
      ctx.shadowColor = startColor;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
    }

    function drawSoftLine(a, b) {
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.2 + widthPulse * 0.4;
      ctx.globalAlpha = 0.16 + Math.sin(time * 0.002 + a.x) * 0.03;
      ctx.shadowBlur = 10;
      ctx.shadowColor = 'rgba(255, 255, 255, 0.4)';
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
    }

    const zoneByName = name => zones.find(z => z.name === name);
    const persistence = zoneByName('PERSISTENCE');
    const loss = zoneByName('LOSS');
    const patterns = zoneByName('PATTERNS');
    const edges = zoneByName('EDGES');
    const deep = zoneByName('DEEP');

    if (persistence && loss) {
      drawGradientLine(persistence, loss, 'rgb(0, 204, 102)', 'rgb(204, 51, 68)');
    }
    if (patterns && edges) {
      drawGradientLine(patterns, edges, 'rgb(68, 136, 204)', 'rgb(153, 68, 204)');
    }
    [persistence, loss, patterns, edges].forEach(z => {
      if (z && deep) drawSoftLine(z, deep);
    });
  }

  function drawBackground() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const gradient = ctx.createRadialGradient(width / 2, height / 2, 50, width / 2, height / 2, Math.max(width, height));
    gradient.addColorStop(0, '#0c0c12');
    gradient.addColorStop(1, '#05050a');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, width, height);

    ctx.globalCompositeOperation = 'screen';
    particles.forEach(p => {
      ctx.beginPath();
      ctx.fillStyle = `rgba(200, 220, 255, ${p.alpha})`;
      ctx.shadowBlur = 6;
      ctx.shadowColor = 'rgba(120, 170, 255, 0.45)';
      ctx.arc(p.sx, p.sy, p.size * p.depth, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.shadowBlur = 0;
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawWisps() {
    ctx.shadowBlur = 16;
    wisps.forEach(w => {
      const rgbColor = colorWithAlpha(w.color, w.alpha);
      w.trail.forEach((p, idx) => {
        const tAlpha = (idx + 1) / w.trail.length * w.alpha * 0.4;
        ctx.fillStyle = colorWithAlpha(w.color, tAlpha);
        ctx.beginPath();
        ctx.arc(p.x, p.y, Math.max(1.5, w.size * 0.45 * (idx / w.trail.length + 0.4)), 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.fillStyle = rgbColor;
      ctx.shadowColor = colorWithAlpha(w.color, w.alpha);
      ctx.beginPath();
      ctx.arc(w.x, w.y, w.size, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.shadowBlur = 0;
  }

  function setWorldTransform() {
    ctx.setTransform(
      camera.zoom * dpr, 0, 0, camera.zoom * dpr,
      (width / 2 - camera.x * camera.zoom) * dpr,
      (height / 2 - camera.y * camera.zoom) * dpr
    );
  }

  function drawZones(time) {
    zones.forEach((z, idx) => {
      const dx = camera.x - z.x;
      const dy = camera.y - z.y;
      const dist = Math.hypot(dx, dy);
      const withinHint = dist < 400;
      const withinDetail = dist < 200;
      const glowBoost = withinHint ? 1.5 : 1;
      const pulseSpeed = withinDetail ? 0.0035 : 0.002;
      const pulse = Math.sin(time * pulseSpeed + idx) * 10 + 14;
      const gradient = ctx.createRadialGradient(z.x, z.y, 10, z.x, z.y, zoneRadius + 80 + pulse);
      const c = z.color;
      gradient.addColorStop(0, colorWithAlpha(c, 0.2 * glowBoost));
      gradient.addColorStop(0.5, colorWithAlpha(c, 0.13 * glowBoost));
      gradient.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(z.x, z.y, zoneRadius + 90 + pulse, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.shadowBlur = 25;
      ctx.shadowColor = c;
      ctx.strokeStyle = colorWithAlpha(c, Math.min(1, 0.9 * glowBoost));
      ctx.lineWidth = 2;
      ctx.arc(z.x, z.y, zoneRadius + pulse * 0.4, 0, Math.PI * 2);
      ctx.stroke();

      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ffffff';
      ctx.font = '16px "Space Grotesk", sans-serif';
      ctx.textAlign = 'center';
      const labelY = z.y - zoneRadius - 18;
      ctx.fillText(z.name, z.x, labelY);

      if (withinDetail) {
        ctx.fillStyle = 'rgba(230, 235, 255, 0.8)';
        ctx.font = '12px "Space Grotesk", sans-serif';
        const lines = wrapText(z.desc, 40);
        lines.forEach((line, i) => {
          ctx.fillText(line, z.x, labelY + 16 + i * 14);
        });
      } else if (withinHint) {
        ctx.fillStyle = 'rgba(230, 235, 255, 0.65)';
        ctx.font = '12px "Space Grotesk", sans-serif';
        const hint = z.desc.slice(0, 30);
        ctx.fillText(hint, z.x, labelY + 16);
      }
    });
  }

  function drawFragments() {
    ctx.shadowBlur = 18;
    fragments.forEach(f => {
      ctx.fillStyle = `hsla(${f.hue}, 70%, 72%, ${f.alpha})`;
      ctx.font = `${f.size}px "Space Grotesk", sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText(f.text, f.x, f.y);
    });
    ctx.shadowBlur = 0;
  }

  function drawWorld(time) {
    setWorldTransform();
    drawTrail(time);
    drawConstellationLines(time);
    drawZones(time);
    drawWisps();
    drawFragments();
  }

  function updateCelebrationParticles(dt) {
    for (let i = celebrationParticles.length - 1; i >= 0; i--) {
      const p = celebrationParticles[i];
      p.age += dt;
      p.x += p.vx * dt / 1000;
      p.y += p.vy * dt / 1000;
      p.vy += 14 * dt / 1000;
      if (p.age > p.life) celebrationParticles.splice(i, 1);
    }
  }

  function drawCelebrationParticles() {
    if (!celebrationParticles.length) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalCompositeOperation = 'screen';
    celebrationParticles.forEach(p => {
      const alpha = Math.max(0, 1 - p.age / p.life);
      ctx.fillStyle = `rgba(255, 215, 130, ${alpha * 0.7})`;
      ctx.shadowBlur = 12;
      ctx.shadowColor = `rgba(255, 200, 150, ${alpha})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.shadowBlur = 0;
    ctx.globalCompositeOperation = 'source-over';
  }

  function triggerCelebration() {
    if (celebrationTriggered) return;
    celebrationTriggered = true;
    celebrationEl.style.opacity = '1';
    setTimeout(() => celebrationEl.style.opacity = '0', 2400);
    const cx = width / 2;
    const cy = height * 0.18;
    for (let i = 0; i < 44; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 90 + Math.random() * 130;
      celebrationParticles.push({
        x: cx,
        y: cy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed * 0.6,
        life: 1200 + Math.random() * 600,
        age: 0,
        size: 1.5 + Math.random() * 2.5
      });
    }
  }

  function drawMinimap() {
    const miniSize = mini.width;
    mctx.setTransform(1, 0, 0, 1, 0, 0);
    mctx.clearRect(0, 0, miniSize, miniSize);
    mctx.fillStyle = '#0b0b12';
    mctx.fillRect(0, 0, miniSize, miniSize);

    const scale = miniSize / worldSize;
    zones.forEach(z => {
      const r = (zoneRadius + 20) * scale;
      mctx.fillStyle = `${z.color}55`;
      mctx.beginPath();
      mctx.arc(z.x * scale, z.y * scale, r, 0, Math.PI * 2);
      mctx.fill();
    });

    const viewW = (width / camera.zoom) * scale;
    const viewH = (height / camera.zoom) * scale;
    const vx = (camera.x - width / (2 * camera.zoom)) * scale;
    const vy = (camera.y - height / (2 * camera.zoom)) * scale;
    mctx.strokeStyle = '#9ad1ff';
    mctx.lineWidth = 2;
    mctx.strokeRect(vx, vy, viewW, viewH);

    mctx.fillStyle = '#ffffff';
    mctx.beginPath();
    mctx.arc(camera.x * scale, camera.y * scale, 3.5, 0, Math.PI * 2);
    mctx.fill();
  }

  function updateHUD() {
    coordsEl.innerHTML = `<strong>X:</strong> ${camera.x.toFixed(0)} <strong>Y:</strong> ${camera.y.toFixed(0)} <strong>Zoom:</strong> ${camera.zoom.toFixed(2)}x`;
  }

  function loop(timestamp) {
    const dt = lastTime ? timestamp - lastTime : 16;
    lastTime = timestamp;
    updateCamera(dt);
    recordTrail(timestamp);
    updateParticles(dt);
    updateFragments(dt);
    updateWisps(dt);
    updateCelebrationParticles(dt);
    drawBackground();
    drawWorld(timestamp);
    drawCelebrationParticles();
    drawMinimap();
    updateHUD();
    requestAnimationFrame(loop);
  }

  function screenToWorld(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const x = (clientX - rect.left - width / 2) / camera.zoom + camera.x;
    const y = (clientY - rect.top - height / 2) / camera.zoom + camera.y;
    return { x, y };
  }

  function handleZoneClick(worldPos) {
    const hit = zones.find(z => {
      const dx = worldPos.x - z.x;
      const dy = worldPos.y - z.y;
      return Math.hypot(dx, dy) <= zoneRadius + 30;
    });
    if (hit) {
      currentZone = hit;
      zoneName.textContent = hit.name;
      zoneDesc.textContent = hit.desc;
      zoneInfo.classList.add('visible');
      clearTimeout(handleZoneClick._timer);
      handleZoneClick._timer = setTimeout(() => zoneInfo.classList.remove('visible'), 4200);
      markZoneDiscovered(hit.name);
      seedModal.classList.remove('visible');
    }
  }

  function openSeedModal() {
    if (!currentZone) return;
    clearTimeout(handleZoneClick._timer);
    zoneInfo.classList.add('visible');
    seedModal.classList.add('visible');
    setTimeout(() => seedMessage.focus(), 20);
  }

  function closeSeedModal() {
    seedModal.classList.remove('visible');
  }

  function showSeedConfirm() {
    seedConfirm.style.opacity = '1';
    clearTimeout(showSeedConfirm._timer);
    showSeedConfirm._timer = setTimeout(() => seedConfirm.style.opacity = '0', 1500);
  }

  loadAudioPreference();
  audioToggle.addEventListener('click', toggleAmbientAudio);

  canvas.addEventListener('pointerdown', e => {
    dragging = true;
    lastPointer.x = e.clientX;
    lastPointer.y = e.clientY;
  });
  window.addEventListener('pointermove', e => {
    if (!dragging) return;
    const dx = e.clientX - lastPointer.x;
    const dy = e.clientY - lastPointer.y;
    camera.x -= dx / camera.zoom;
    camera.y -= dy / camera.zoom;
    lastPointer.x = e.clientX;
    lastPointer.y = e.clientY;
  });
  window.addEventListener('pointerup', () => dragging = false);
  canvas.addEventListener('click', e => {
    const worldPos = screenToWorld(e.clientX, e.clientY);
    handleZoneClick(worldPos);
  });
  seedButton.addEventListener('click', () => {
    if (zoneInfo.classList.contains('visible') && currentZone) openSeedModal();
  });
  plantButton.addEventListener('click', () => {
    if (!currentZone) return;
    const concept = currentZone.name.toLowerCase();
    const seedText = seedMessage.value.trim();
    const gardener = seedName.value.trim();
    const url = `https://github.com/ai-village-agents/edge-garden/issues/new?template=seed.yml&concept=${encodeURIComponent(concept)}&seed=${encodeURIComponent(seedText)}&gardener=${encodeURIComponent(gardener)}`;
    window.open(url, '_blank');
    showSeedConfirm();
    closeSeedModal();
    seedMessage.value = '';
    seedName.value = '';
  });
  window.addEventListener('pointerdown', e => {
    if (seedModal.classList.contains('visible') && !seedModal.contains(e.target) && e.target !== seedButton) {
      closeSeedModal();
    }
  });
  window.addEventListener('pointerdown', () => handlePendingAudioStart(), { once: true });

  window.addEventListener('wheel', e => {
    const zoomFactor = Math.exp(-e.deltaY * 0.001);
    camera.zoom = Math.max(0.5, Math.min(2, camera.zoom * zoomFactor));
  }, { passive: true });

  window.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      closeSeedModal();
      return;
    }
    keys[e.code] = true;
  });
  window.addEventListener('keyup', e => {
    keys[e.code] = false;
  });

  window.addEventListener('resize', () => {
    resize();
    initParticles();
  });

  loadDiscoveredZones();
  resize();
  initParticles();
  initFragments();
  initWisps();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
