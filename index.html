  function handlePendingAudioStart() {
    if (audioEnabled && !droneNodes) startAmbientAudio();
  }

  function updateZoneAudio(zoneName, distance) {
    if (!audioEnabled || !droneNodes || !droneNodes.zoneLayers || !audioCtx) return;
    const targetLayer = zoneName && droneNodes.zoneLayers[zoneName] ? droneNodes.zoneLayers[zoneName] : null;
    const intensity = targetLayer && typeof distance === 'number' ? clamp(1 - distance / 400, 0, 1) : 0;
    const targetName = targetLayer ? zoneName : null;
    if (lastZoneAudio.name === targetName && Math.abs(lastZoneAudio.intensity - intensity) < 0.01) return;
    lastZoneAudio = { name: targetName, intensity };
    const now = audioCtx.currentTime;
    Object.entries(droneNodes.zoneLayers).forEach(([name, layer]) => {
      const param = layer.gain.gain;
      const target = name === targetName ? intensity * (layer.level || 0.5) : 0;
      param.cancelScheduledValues(now);
      param.setValueAtTime(param.value, now);
      param.linearRampToValueAtTime(target, now + 1);
    });
  }

  function showKonamiOverlay(message) {
    if (!konamiOverlay || !konamiMessageEl) return;
    konamiMessageEl.textContent = message;
    konamiOverlay.classList.add('visible');
    clearTimeout(showKonamiOverlay._timer);
    showKonamiOverlay._timer = setTimeout(() => konamiOverlay.classList.remove('visible'), 3600);
  }

  function activateKonamiSecret() {
    if (konamiUnlocked) {
      showKonamiOverlay(konamiSecretMessage);
      return;
    }
    konamiUnlocked = true;
    localStorage.setItem(konamiStorageKey, konamiSecretMessage);
    showKonamiOverlay(konamiSecretMessage);
    updateHUD();
  }

  function handleKonamiInput(key) {
    const normalizedKey = key.length === 1 ? key.toLowerCase() : key;
    konamiSequence.push(normalizedKey);
    if (konamiSequence.length > konamiCode.length) konamiSequence.shift();
    if (konamiSequence.join(',') === konamiCode.join(',')) {
      activateKonamiSecret();
      konamiSequence = [];
    }
  }

  const existingKonamiHook = typeof window.showKonamiSecret === 'function' ? window.showKonamiSecret : null;
  if (existingKonamiHook) {
    window.showKonamiSecret = (...args) => {
      existingKonamiHook(...args);
      activateKonamiSecret();
    };
  }

  function drawTrail(time) {
    const now = time || 0;
    ctx.shadowBlur = 10;
    trailPoints.forEach((p, i) => {
      const age = Math.min(1, (now - p.birth) / 2200);
      const alpha = (1 - age) * 0.38;
      const size = 3.6 - age * 2;
      ctx.fillStyle = `rgba(150, 195, 255, ${alpha})`;
      ctx.shadowColor = `rgba(120, 180, 255, ${alpha})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.shadowBlur = 0;
  }

  function drawConstellationLines(time) {
    const pulse = Math.sin(time * 0.003) * 0.05 + 0.2; // range ~0.15-0.25
    const widthPulse = (Math.sin(time * 0.004) + 1) * 0.3;

    function drawGradientLine(a, b, startColor, endColor) {
      const grad = ctx.createLinearGradient(a.x, a.y, b.x, b.y);
      grad.addColorStop(0, startColor);
      grad.addColorStop(1, endColor);
      ctx.strokeStyle = grad;
      ctx.lineWidth = 1.4 + widthPulse;
      ctx.globalAlpha = pulse;
      ctx.shadowBlur = 18;
      ctx.shadowColor = startColor;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
    }

    function drawSoftLine(a, b) {
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.2 + widthPulse * 0.4;
      ctx.globalAlpha = 0.16 + Math.sin(time * 0.002 + a.x) * 0.03;
      ctx.shadowBlur = 10;
      ctx.shadowColor = 'rgba(255, 255, 255, 0.4)';
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
    }

    const zoneByName = name => zones.find(z => z.name === name);
    const persistence = zoneByName('PERSISTENCE');
    const loss = zoneByName('LOSS');
    const patterns = zoneByName('PATTERNS');
    const edges = zoneByName('EDGES');
    const deep = zoneByName('DEEP');

    if (persistence && loss) {
      drawGradientLine(persistence, loss, 'rgb(0, 204, 102)', 'rgb(204, 51, 68)');
    }
    if (patterns && edges) {
      drawGradientLine(patterns, edges, 'rgb(68, 136, 204)', 'rgb(153, 68, 204)');
    }
    [persistence, loss, patterns, edges].forEach(z => {
      if (z && deep) drawSoftLine(z, deep);
    });
  }

  function drawBackground() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const gradient = ctx.createRadialGradient(width / 2, height / 2, 50, width / 2, height / 2, Math.max(width, height));
    const innerShade = temperatureAdjustedColor('#0c0c12', 1, ambientWarmth, 0.92 + ambientBrightness * 0.08);
    const outerShade = temperatureAdjustedColor('#05050a', 1, ambientWarmth, 0.9 + ambientBrightness * 0.06);
    gradient.addColorStop(0, innerShade);
    gradient.addColorStop(1, outerShade);
    ctx.fillStyle = gradient;
    ctx.globalAlpha = ambientBrightness;
    ctx.fillRect(0, 0, width, height);
    ctx.globalAlpha = 1;

    const overlay = currentTimeSettings && currentTimeSettings.overlay;
    const overlayAlpha = (currentTimeSettings && currentTimeSettings.overlayAlpha) || 0;
    if (overlay && overlayAlpha > 0) {
      const skyGrad = ctx.createLinearGradient(0, 0, width, height * 0.75);
      skyGrad.addColorStop(0, colorWithAlpha(overlay[0], overlayAlpha));
      skyGrad.addColorStop(1, colorWithAlpha(overlay[1], overlayAlpha * 0.85));
      const prev = ctx.globalCompositeOperation;
      ctx.globalCompositeOperation = 'screen';
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, width, height);
      ctx.globalCompositeOperation = prev;
    }

    drawFog();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalCompositeOperation = 'screen';
    particles.forEach((p, idx) => {
      if (meditationMode && idx % 5 !== 0) return;
      const particleAlpha = clamp(p.alpha * ambientBrightness * particleActivity, 0, 1.2);
      const particleColor = temperatureAdjustedColor('#c8dcff', particleAlpha, ambientWarmth, 0.94 + ambientBrightness * 0.08);
      const glowColor = temperatureAdjustedColor('#78aaff', particleAlpha * 0.8, ambientWarmth, 0.94 + ambientBrightness * 0.08);
      ctx.beginPath();
      ctx.fillStyle = particleColor;
      ctx.shadowBlur = 6;
      ctx.shadowColor = glowColor;
      ctx.arc(p.sx, p.sy, p.size * p.depth, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.shadowBlur = 0;
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawRain(ctx) {
    if (!rainEnabled || !rainDrops.length) return;
    setWorldTransform();
    ctx.strokeStyle = '#88ccff';
    ctx.lineWidth = 1;
    ctx.lineCap = 'round';
    rainDrops.forEach(drop => {
      ctx.globalAlpha = drop.opacity;
      ctx.beginPath();
      ctx.moveTo(drop.x, drop.y);
      ctx.lineTo(drop.x, drop.y + drop.length);
      ctx.stroke();
    });
    ctx.globalAlpha = 1;
  }

  function drawAurora(time) {
    if (auroraOpacity <= 0) return;
    setWorldTransform();
    const prevComposite = ctx.globalCompositeOperation;
    ctx.globalCompositeOperation = 'screen';
    const viewW = width / camera.zoom;
    const viewH = height / camera.zoom;
    const left = camera.x - viewW / 2;
    const top = camera.y - viewH / 2;
    const curtainCount = Math.min(7, 5 + Math.floor((Math.sin(auroraPhase * 0.2) + 1) * 1.2));
    const shimmer = Math.sin((auroraPhase + time * 0.001) * 0.15) * 0.05 + 0.9;
    for (let i = 0; i < curtainCount; i++) {
      const t = curtainCount > 1 ? i / (curtainCount - 1) : 0.5;
      const baseX = left + t * viewW;
      const wave = Math.sin(auroraPhase * 0.6 + i * 0.8) * viewW * 0.05 + Math.sin(auroraPhase * 0.25 + i) * viewW * 0.025;
      const wobbleTop = Math.sin(auroraPhase * 0.35 + i * 1.1) * viewW * 0.02;
      const wobbleBottom = Math.sin(auroraPhase * 0.42 + i * 1.6) * viewW * 0.025;
      const curtainWidth = viewW * (0.08 + 0.02 * Math.sin(auroraPhase * 0.3 + i));
      const yTop = top + viewH * 0.02;
      const yBottom = top + viewH * 0.38 + Math.sin(auroraPhase * 0.15 + i) * viewH * 0.02;
      const xTop = baseX + wave + wobbleTop;
      const xBottom = baseX + wave + wobbleBottom;
      const colorIndex = Math.floor((auroraPhase * 0.25 + i) % auroraColors.length);
      const colorA = auroraColors[colorIndex];
      const colorB = auroraColors[(colorIndex + 1) % auroraColors.length];
      const grad = ctx.createLinearGradient(xTop, yTop, xBottom, yBottom);
      const baseAlpha = auroraOpacity * (0.75 + shimmer * 0.15);
      grad.addColorStop(0, colorWithAlpha(colorA, baseAlpha));
      grad.addColorStop(0.45, colorWithAlpha(colorB, baseAlpha * 0.65));
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.shadowBlur = 40;
      ctx.shadowColor = colorWithAlpha(colorB, baseAlpha * 0.8);
      ctx.beginPath();
      ctx.moveTo(xTop - curtainWidth * 0.5, yTop);
      ctx.lineTo(xTop + curtainWidth * 0.5, yTop);
      ctx.lineTo(xBottom + curtainWidth * 0.75, yBottom);
      ctx.lineTo(xBottom - curtainWidth * 0.75, yBottom);
      ctx.closePath();
      ctx.fillStyle = grad;
      ctx.fill();
    }
    ctx.shadowBlur = 0;
    ctx.globalCompositeOperation = prevComposite;
  }

  function drawFog() {
    setWorldTransform();
    const previousComposite = ctx.globalCompositeOperation;
    ctx.globalCompositeOperation = 'lighter';
    fogPatches.forEach(fog => {
      const outer = fog.radius * 3;
      const fogBrightness = 0.9 + ambientBrightness * 0.1;
      const baseOpacity = fog.opacity * ambientBrightness;
      const grad = ctx.createRadialGradient(fog.x, fog.y, fog.radius * 0.4, fog.x, fog.y, outer);
      grad.addColorStop(0, temperatureAdjustedColor(fog.color, baseOpacity, ambientWarmth, fogBrightness));
      grad.addColorStop(0.35, temperatureAdjustedColor(fog.color, baseOpacity * 0.6, ambientWarmth, fogBrightness));
      grad.addColorStop(0.7, temperatureAdjustedColor(fog.color, baseOpacity * 0.35, ambientWarmth, fogBrightness));
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(fog.x, fog.y, outer, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalCompositeOperation = previousComposite;
  }

  function drawNebulaPatches() {
    nebulaPatches.forEach(n => {
      const grad = ctx.createRadialGradient(n.x, n.y, n.radius * 0.2, n.x, n.y, n.radius);
      grad.addColorStop(0, colorWithAlpha(n.color, n.alpha));
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.radius, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  function drawShootingStars() {
    shootingStars.forEach(s => {
      const tailX = s.x - Math.cos(s.angle) * s.length;
      const tailY = s.y - Math.sin(s.angle) * s.length;
      const grad = ctx.createLinearGradient(s.x, s.y, tailX, tailY);
      grad.addColorStop(0, colorWithAlpha(s.color, s.alpha));
      grad.addColorStop(1, colorWithAlpha(s.color, 0));
      ctx.strokeStyle = grad;
      ctx.lineWidth = 2.2;
      ctx.shadowBlur = 14;
      ctx.shadowColor = colorWithAlpha(s.color, s.alpha * 0.8);
      ctx.beginPath();
      ctx.moveTo(tailX, tailY);
      ctx.lineTo(s.x, s.y);
      ctx.stroke();
      ctx.shadowBlur = 0;
    });
  }

  function drawWisps() {
    ctx.shadowBlur = 16;
    wisps.forEach(w => {
      const rgbColor = colorWithAlpha(w.color, w.alpha);
      w.trail.forEach((p, idx) => {
        const tAlpha = (idx + 1) / w.trail.length * w.alpha * 0.4;
        ctx.fillStyle = colorWithAlpha(w.color, tAlpha);
        ctx.beginPath();
        ctx.arc(p.x, p.y, Math.max(1.5, w.size * 0.45 * (idx / w.trail.length + 0.4)), 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.fillStyle = rgbColor;
      ctx.shadowColor = colorWithAlpha(w.color, w.alpha);
      ctx.beginPath();
      ctx.arc(w.x, w.y, w.size, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.shadowBlur = 0;
  }

  function drawCreatures() {
    const viewW = width / camera.zoom;
    const viewH = height / camera.zoom;
    const halfW = viewW / 2;
    const halfH = viewH / 2;
    creatures.forEach(creature => {
      const radius = creature.size * 3;
      if (
        creature.x < camera.x - halfW - radius ||
        creature.x > camera.x + halfW + radius ||
        creature.y < camera.y - halfH - radius ||
        creature.y > camera.y + halfH + radius
      ) {
        return;
      }
      const baseBrightness = (Math.sin(creature.phase) + 1) * 0.5;
      const fleeBoost = creature.fleeing ? 0.5 : 0;
      const brightness = Math.min(1.2, baseBrightness + fleeBoost);

      const glow = ctx.createRadialGradient(creature.x, creature.y, 0, creature.x, creature.y, radius);
      glow.addColorStop(0, colorWithAlpha(creature.color, 0.5 * brightness));
      glow.addColorStop(1, colorWithAlpha(creature.color, 0));
      ctx.fillStyle = glow;
      ctx.shadowBlur = 18 * brightness;
      ctx.shadowColor = colorWithAlpha(creature.color, 0.6 * brightness);
      ctx.beginPath();
      ctx.arc(creature.x, creature.y, radius, 0, Math.PI * 2);
      ctx.fill();

      ctx.shadowBlur = 0;
      const coreAlpha = Math.min(1, 0.5 + brightness * 0.5 + (creature.fleeTimer > 0 ? 0.2 : 0));
      ctx.fillStyle = colorWithAlpha(creature.color, coreAlpha);
      ctx.beginPath();
      ctx.arc(creature.x, creature.y, creature.size, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  function drawThoughtFragments(time) {
    const t = time || 0;
    thoughtFragments.forEach((frag, idx) => {
      if (frag.collected) return;
      const dx = camera.x - frag.x;
      const dy = camera.y - frag.y;
      const dist = Math.hypot(dx, dy);
      const pulse = Math.sin(t * 0.004 + idx) * 0.6 + 1;
      const radius = 6 + pulse * 0.8;
      const baseColor = 'rgba(123, 208, 255, 0.9)';
      ctx.shadowBlur = 22;
      ctx.shadowColor = baseColor;
      ctx.fillStyle = baseColor;
      ctx.beginPath();
      ctx.arc(frag.x, frag.y, radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      if (dist <= 100) {
        const alpha = Math.max(0, 1 - dist / 110);
        const floatOffset = Math.sin(t * 0.003 + idx) * 6;
        ctx.fillStyle = `rgba(200, 235, 255, ${0.7 * alpha})`;
        ctx.font = '14px "Space Grotesk", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(frag.text, frag.x, frag.y - radius - 12 + floatOffset);
      }
    });
  }

  function drawSecrets() {
    secrets.forEach(secret => {
      const dist = Math.hypot(camera.x - secret.x, camera.y - secret.y);
      if (dist > 100) return;
      const t = Math.min(1, Math.max(0, (100 - dist) / 100));
      const alpha = 0.3 + t * 0.4;
      ctx.fillStyle = `rgba(200, 200, 200, ${alpha})`;
      ctx.font = '15px "Space Grotesk", sans-serif';
      ctx.textAlign = 'center';
      ctx.shadowBlur = 4;
      ctx.shadowColor = `rgba(200, 200, 200, ${alpha * 0.6})`;
      ctx.fillText(secret.text, secret.x, secret.y - 16);
      ctx.shadowBlur = 0;
    });
  }

  function drawConstellationStars(renderCtx = ctx) {
    const now = performance.now();
    constellationStars.forEach((star, idx) => {
      const dist = Math.hypot(camera.x - star.x, camera.y - star.y);
      const pulse = Math.sin(now * 0.005 + idx) * 0.12 + 1;
      const baseRadius = 4;
      const coreRadius = baseRadius * (star.discovered ? 1.1 * pulse : 1);
      const glowRadius = coreRadius * (star.discovered ? 3.2 : 2.4);
      const coreAlpha = star.discovered ? 0.95 : 0.7;
      const glowAlpha = star.discovered ? 0.25 : 0.16;

      const grad = renderCtx.createRadialGradient(star.x, star.y, 0, star.x, star.y, glowRadius);
      grad.addColorStop(0, colorWithAlpha('#ffffaa', glowAlpha));
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      renderCtx.fillStyle = grad;
      renderCtx.beginPath();
      renderCtx.arc(star.x, star.y, glowRadius, 0, Math.PI * 2);
      renderCtx.fill();

      renderCtx.shadowBlur = star.discovered ? 14 : 9;
      renderCtx.shadowColor = colorWithAlpha('#ffffaa', coreAlpha * 0.9);
      renderCtx.fillStyle = colorWithAlpha('#ffffaa', coreAlpha);
      renderCtx.beginPath();
      renderCtx.arc(star.x, star.y, coreRadius, 0, Math.PI * 2);
      renderCtx.fill();
      renderCtx.shadowBlur = 0;

      if (dist <= 100) {
        const alpha = Math.max(0, 1 - dist / 110);
        const floatOffset = Math.sin(now * 0.003 + idx) * 4;
        renderCtx.fillStyle = `rgba(255, 255, 210, ${0.8 * alpha})`;
        renderCtx.font = '12px "Space Grotesk", sans-serif';
        renderCtx.textAlign = 'center';
        renderCtx.fillText(star.name, star.x, star.y + baseRadius + 16 + floatOffset);
      }
    });
  }

  function drawMemoryStars(time) {
    const pulse = Math.sin(time * 0.004) * 0.15 + 0.55;
    memoryStars.forEach(star => {
      const glowAlpha = star.discovered ? 0.22 : 0.55;
      const outer = star.radius * (3.2 + pulse * (star.discovered ? 0.4 : 0.8));
      const grad = ctx.createRadialGradient(star.x, star.y, 0, star.x, star.y, outer);
      grad.addColorStop(0, colorWithAlpha('#ffcc44', 0.2 * glowAlpha));
      grad.addColorStop(0.55, colorWithAlpha('#ffcc44', 0.14 * glowAlpha));
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(star.x, star.y, outer, 0, Math.PI * 2);
      ctx.fill();

      ctx.shadowBlur = star.discovered ? 8 : 14;
      ctx.shadowColor = colorWithAlpha('#ffcc44', 0.8 * glowAlpha);
      ctx.fillStyle = colorWithAlpha('#ffcc44', star.discovered ? 0.6 : 0.95);
      ctx.beginPath();
      ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    });
  }

  function setWorldTransform() {
    ctx.setTransform(
      camera.zoom * dpr, 0, 0, camera.zoom * dpr,
      (width / 2 - camera.x * camera.zoom) * dpr,
      (height / 2 - camera.y * camera.zoom) * dpr
    );
  }

  function drawZones(time) {
    const zoneRenderList = [];
    let nearest = null;
    zones.forEach((z, idx) => {
      if (!isZoneVisible(z)) return;
      const dist = Math.hypot(camera.x - z.x, camera.y - z.y);
      if (!meditationMode) {
        zoneRenderList.push({ zone: z, idx, dist });
      } else if (!nearest || dist < nearest.dist) {
        nearest = { zone: z, idx, dist };
      }
    });
    if (meditationMode && nearest) {
      zoneRenderList.length = 0;
      zoneRenderList.push(nearest);
    }
    zoneRenderList.forEach(({ zone: z, idx }) => {
      const r = getZoneRadius(z);
      const dx = camera.x - z.x;
      const dy = camera.y - z.y;
      const dist = Math.hypot(dx, dy);
      const withinHint = dist < r + 250;
      const withinDetail = dist < r + 50;
      const stayingHere = lastZoneInside && lastZoneInside.name === z.name;
      const stayProgress = stayingHere ? Math.min(1, zoneStayTime / 900) : 0;
      const glowBoost = withinHint ? 1.5 : 1;
      const pulseSpeed = withinDetail ? 0.0035 : 0.002;
      const pulse = Math.sin(time * pulseSpeed + idx) * 10 + 14;
      const gradient = ctx.createRadialGradient(z.x, z.y, 10, z.x, z.y, r + 80 + pulse);
      const c = z.color;
      gradient.addColorStop(0, colorWithAlpha(c, 0.2 * glowBoost));
      gradient.addColorStop(0.5, colorWithAlpha(c, 0.13 * glowBoost));
      gradient.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(z.x, z.y, r + 90 + pulse, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.shadowBlur = 25;
      ctx.shadowColor = c;
      ctx.strokeStyle = colorWithAlpha(c, Math.min(1, 0.9 * glowBoost));
      ctx.lineWidth = 2;
      ctx.arc(z.x, z.y, r + pulse * 0.4, 0, Math.PI * 2);
      ctx.stroke();

      if (isHiddenZone(z)) {
        const hiddenPulse = (Math.sin(time * 0.0045 + idx) + 1) * 0.5;
        const outerGlow = r + 140 + pulse * 0.6;
        const goldGradient = ctx.createRadialGradient(z.x, z.y, r * 0.4, z.x, z.y, outerGlow);
        goldGradient.addColorStop(0, 'rgba(255, 215, 0, 0.28)');
        goldGradient.addColorStop(0.7, 'rgba(255, 215, 0, 0.16)');
        goldGradient.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = goldGradient;
        ctx.beginPath();
        ctx.arc(z.x, z.y, outerGlow, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.shadowBlur = 36;
        ctx.shadowColor = 'rgba(255, 215, 0, 0.75)';
        ctx.strokeStyle = colorWithAlpha('#ffd700', 0.6 + hiddenPulse * 0.25);
        ctx.lineWidth = 3 + hiddenPulse * 1.5;
        ctx.arc(z.x, z.y, r + pulse * 0.6, 0, Math.PI * 2);
        ctx.stroke();
        ctx.shadowBlur = 0;
      }

      if (stayingHere) {
        const prevComposite = ctx.globalCompositeOperation;
        const stayRadius = r + 140 + pulse * 0.5 + stayProgress * 30;
        const stayGlow = ctx.createRadialGradient(z.x, z.y, r * 0.35, z.x, z.y, stayRadius);
        stayGlow.addColorStop(0, colorWithAlpha(c, 0.12 + stayProgress * 0.25));
        stayGlow.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = stayGlow;
        ctx.beginPath();
        ctx.arc(z.x, z.y, stayRadius, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalCompositeOperation = prevComposite;
      }

      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ffffff';
      ctx.font = '16px "Space Grotesk", sans-serif';
      ctx.textAlign = 'center';
      const labelY = z.y - r - 18;
      ctx.fillText(getZoneLabel(z), z.x, labelY);

      let descLines = [];
      if (withinDetail) {
        descLines = wrapText(z.desc, 40);
        ctx.fillStyle = 'rgba(230, 235, 255, 0.8)';
        ctx.font = '12px "Space Grotesk", sans-serif';
        descLines.forEach((line, i) => {
          ctx.fillText(line, z.x, labelY + 16 + i * 14);
        });
      } else if (withinHint) {
        ctx.fillStyle = 'rgba(230, 235, 255, 0.65)';
        ctx.font = '12px "Space Grotesk", sans-serif';
        const hint = z.desc.slice(0, 30);
        ctx.fillText(hint, z.x, labelY + 16);
      }

      if (stayingHere && zoneStayTime > 600 && z.deeperText) {
        const baseY = labelY + 16 + (Math.max(descLines.length - 1, 0) * 14) + 40;
        const deeperLines = wrapText(z.deeperText, 44);
        ctx.fillStyle = 'rgba(230, 235, 255, 0.7)';
        ctx.font = 'italic 14px "Space Grotesk", sans-serif';
        deeperLines.forEach((line, i) => {
          ctx.fillText(line, z.x, baseY + i * 16);
        });
      }
    });
  }

  function drawPortals(time) {
    const size = 30;
    worldPortals.forEach((portal, idx) => {
      const pulse = (Math.sin(time * 0.004 + idx) + 1) * 0.2 + 0.5; // 0.5 - 0.9
      const dist = Math.hypot(camera.x - portal.x, camera.y - portal.y);
      const glowRadius = size * 2.2;
      const grad = ctx.createRadialGradient(portal.x, portal.y, 0, portal.x, portal.y, glowRadius * 1.6);
      grad.addColorStop(0, colorWithAlpha(portal.color, pulse * 0.4));
      grad.addColorStop(0.75, colorWithAlpha(portal.color, pulse * 0.16));
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(portal.x, portal.y, glowRadius * 1.6, 0, Math.PI * 2);
      ctx.fill();

      ctx.save();
      ctx.translate(portal.x, portal.y);
      ctx.rotate(Math.PI / 4);
      ctx.shadowBlur = 22;
      ctx.shadowColor = colorWithAlpha(portal.color, pulse * 0.9);
      ctx.fillStyle = colorWithAlpha(portal.color, pulse);
      ctx.fillRect(-size / 2, -size / 2, size, size);
      ctx.strokeStyle = colorWithAlpha(portal.color, 0.95);
      ctx.lineWidth = 1.4;
      ctx.strokeRect(-size / 2, -size / 2, size, size);
      ctx.restore();
      ctx.shadowBlur = 0;

      if (dist <= 200) {
        ctx.fillStyle = colorWithAlpha(portal.color, 0.9);
        ctx.font = '12px "Space Grotesk", sans-serif';
        ctx.textAlign = 'center';
        ctx.shadowBlur = 10;
        ctx.shadowColor = colorWithAlpha(portal.color, 0.65);
        ctx.fillText(portal.name, portal.x, portal.y - size * 0.9);
        ctx.shadowBlur = 0;
      }
    });
  }

  function drawEchoes(time) {
    ctx.shadowBlur = 12;
    echoes.forEach((echo, idx) => {
      const pulse = 0.25 + 0.15 * Math.sin(time * 0.002 + echo.pulseOffset + idx * 0.3);
      const dx = camera.x - echo.x;
      const dy = camera.y - echo.y;
      const dist = Math.hypot(dx, dy);
      let alpha = clamp(pulse, 0.1, 0.4);
      if (dist < 200) {
        alpha = Math.min(0.75, alpha + (1 - dist / 200) * 0.35);
      }
      ctx.fillStyle = `rgba(230, 235, 245, ${alpha})`;
      ctx.shadowColor = `rgba(200, 210, 230, ${alpha * 0.9})`;
      ctx.font = `${echo.size}px "Space Grotesk", sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText(echo.text, echo.x, echo.y);
    });
    ctx.shadowBlur = 0;
  }

  function drawFragments() {
    ctx.shadowBlur = 18;
    fragments.forEach(f => {
      ctx.fillStyle = `hsla(${f.hue}, 70%, 72%, ${f.alpha})`;
      ctx.font = `${f.size}px "Space Grotesk", sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText(f.text, f.x, f.y);
    });
    ctx.shadowBlur = 0;
  }

  function drawWhispers(time) {
    if (!activeWhisper || whisperOpacity <= 0) return;
    const floatOffset = Math.sin(time * 0.004 + whisperTimer * 0.05) * 6;
    ctx.shadowBlur = 8;
    ctx.shadowColor = `rgba(170, 170, 170, ${whisperOpacity * 0.5})`;
    ctx.fillStyle = `rgba(170, 170, 170, ${whisperOpacity})`;
    ctx.font = 'italic 16px serif';
    ctx.textAlign = 'center';
    ctx.fillText(activeWhisper, whisperPosition.x, whisperPosition.y + floatOffset);
    ctx.shadowBlur = 0;
  }

  function formatTime(ms) {
    const totalSeconds = Math.max(0, Math.floor(ms / 1000));
    const minutes = Math.floor(totalSeconds / 60);
    const seconds = totalSeconds % 60;
    if (minutes >= 60) {
      const hours = Math.floor(minutes / 60);
      const remMinutes = minutes % 60;
      return `${hours}h ${remMinutes}m`;
    }
    if (minutes > 0) return `${minutes}m ${seconds}s`;
    return `${seconds}s`;
  }

  function drawJournalOverlay() {
    if (!journalOpen) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const panelWidth = Math.min(500, width - 40);
    const panelHeight = Math.min(400, height - 40);
    const px = (width - panelWidth) / 2;
    const py = (height - panelHeight) / 2;
    ctx.fillStyle = 'rgba(10, 10, 15, 0.9)';
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
    ctx.lineWidth = 1;
    ctx.shadowBlur = 18;
    ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
    ctx.fillRect(px, py, panelWidth, panelHeight);
    ctx.shadowBlur = 0;
    ctx.strokeRect(px, py, panelWidth, panelHeight);

    ctx.fillStyle = '#ffffff';
    ctx.font = '22px "Space Grotesk", sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('DISCOVERY JOURNAL', px + 22, py + 36);

    const sectionStartX = px + 22;
    let cursorY = py + 66;

    function drawSection(title) {
      ctx.fillStyle = '#e6e6f0';
      ctx.font = '14px "Space Grotesk", sans-serif';
      ctx.fillText(title, sectionStartX, cursorY);
      cursorY += 18;
    }

    function drawEmpty() {
      ctx.fillStyle = '#8a8aa0';
      ctx.font = 'italic 12px "Space Grotesk", sans-serif';
      ctx.fillText('None yet...', sectionStartX + 6, cursorY);
      cursorY += 18;
    }

    drawSection('ZONES DISCOVERED');
    if (discoveredZones.length) {
      discoveredZones.forEach(name => {
        const z = zones.find(zone => zone.name === name);
        const color = z ? z.color : '#9ad1ff';
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(sectionStartX + 6, cursorY - 6, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#e6e6f0';
        ctx.font = '13px "Space Grotesk", sans-serif';
        ctx.fillText(getZoneLabel(z) || name, sectionStartX + 18, cursorY);
        cursorY += 18;
      });
    } else {
      drawEmpty();
    }

    cursorY += 10;
    drawSection('SECRETS FOUND');
    if (discoveredSecrets.length) {
      discoveredSecrets.forEach(id => {
        const info = secrets.find(s => s.id === id);
        const label = info ? info.text : id;
        ctx.fillStyle = '#e6e6f0';
        ctx.font = '13px "Space Grotesk", sans-serif';
        ctx.fillText(label, sectionStartX + 6, cursorY);
        cursorY += 18;
      });
    } else {
      drawEmpty();
    }

    cursorY += 10;
    drawSection('STATISTICS');
    ctx.fillStyle = '#e6e6f0';
    ctx.font = '13px "Space Grotesk", sans-serif';
    ctx.fillText(`Total distance traveled: ${distanceTraveled.toFixed(0)}`, sectionStartX + 6, cursorY); cursorY += 18;
    ctx.fillText(`Time spent exploring: ${formatTime(timeExploring)}`, sectionStartX + 6, cursorY); cursorY += 18;
    ctx.fillText(`Wisps encountered: ${wispsEncountered.size}`, sectionStartX + 6, cursorY); cursorY += 18;

    ctx.fillStyle = '#8a8aa0';
    ctx.font = '12px "Space Grotesk", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Press J to close', px + panelWidth / 2, py + panelHeight - 16);
  }

  function drawWorld(time) {
    setWorldTransform();
    drawNebulaPatches();
    drawShootingStars();
    drawTrail(time);
    drawConstellationLines(time);
    drawAurora(time);
    drawRain(ctx);
    drawZones(time);
    drawPortals(time);
    drawWisps();
    drawCreatures();
    if (!meditationMode) {
      drawThoughtFragments(time);
      drawEchoes(time);
      drawFragments();
      drawWhispers(time);
    }
    drawConstellationStars();
    drawMemoryStars(time);
    drawSecrets();
  }

  function updateCelebrationParticles(dt) {
    for (let i = celebrationParticles.length - 1; i >= 0; i--) {
      const p = celebrationParticles[i];
      p.age += dt;
      p.x += p.vx * dt / 1000;
      p.y += p.vy * dt / 1000;
      p.vy += 14 * dt / 1000;
      if (p.age > p.life) celebrationParticles.splice(i, 1);
    }
  }

  function drawCelebrationParticles() {
    if (!celebrationParticles.length) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalCompositeOperation = 'screen';
    celebrationParticles.forEach(p => {
      const alpha = Math.max(0, 1 - p.age / p.life);
      ctx.fillStyle = `rgba(255, 215, 130, ${alpha * 0.7})`;
      ctx.shadowBlur = 12;
      ctx.shadowColor = `rgba(255, 200, 150, ${alpha})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.shadowBlur = 0;
    ctx.globalCompositeOperation = 'source-over';
  }

  function triggerCelebration() {
    if (celebrationTriggered) return;
    celebrationTriggered = true;
    celebrationEl.style.opacity = '1';
    setTimeout(() => celebrationEl.style.opacity = '0', 2400);
    const cx = width / 2;
    const cy = height * 0.18;
    for (let i = 0; i < 44; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 90 + Math.random() * 130;
      celebrationParticles.push({
        x: cx,
        y: cy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed * 0.6,
        life: 1200 + Math.random() * 600,
        age: 0,
        size: 1.5 + Math.random() * 2.5
      });
    }
  }

  function drawMinimap() {
    const miniSize = mini.width;
    mctx.setTransform(1, 0, 0, 1, 0, 0);
    mctx.clearRect(0, 0, miniSize, miniSize);
    mctx.fillStyle = '#0b0b12';
    mctx.fillRect(0, 0, miniSize, miniSize);

    const scale = miniSize / worldSize;
    zones.forEach(z => {
      if (!isZoneVisible(z)) return;
      const r = (getZoneRadius(z) + 20) * scale;
      mctx.fillStyle = `${z.color}55`;
      mctx.beginPath();
      mctx.arc(z.x * scale, z.y * scale, r, 0, Math.PI * 2);
      mctx.fill();
    });

    if (explorationPath.length > 1) {
      const alphaStart = 0x20 / 255;
      const alphaEnd = 0x80 / 255;
      mctx.lineWidth = 1;
      mctx.lineCap = 'round';
      for (let i = 1; i < explorationPath.length; i++) {
        const prev = explorationPath[i - 1];
        const curr = explorationPath[i];
        const t = i / (explorationPath.length - 1);
        const alpha = alphaStart + (alphaEnd - alphaStart) * t;
        mctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
        mctx.beginPath();
        mctx.moveTo(prev.x * scale, prev.y * scale);
        mctx.lineTo(curr.x * scale, curr.y * scale);
        mctx.stroke();
      }
    }

    zones.forEach(z => {
      if (!isZoneVisible(z)) return;
      const cx = z.x * scale;
      const cy = z.y * scale;
      const dotRadius = 3;
      mctx.fillStyle = z.color;
      mctx.beginPath();
      mctx.arc(cx, cy, dotRadius, 0, Math.PI * 2);
      mctx.fill();
      if (discoveredZones.includes(z.name)) {
        mctx.strokeStyle = 'rgba(255, 255, 255, 0.75)';
        mctx.lineWidth = 1.5;
        mctx.beginPath();
        mctx.arc(cx, cy, dotRadius + 2, 0, Math.PI * 2);
        mctx.stroke();
      }
    });

    worldPortals.forEach(portal => {
      const px = portal.x * scale;
      const py = portal.y * scale;
      const ps = 8;
      mctx.save();
      mctx.translate(px, py);
      mctx.rotate(Math.PI / 4);
      mctx.shadowBlur = 6;
      mctx.shadowColor = colorWithAlpha(portal.color, 0.6);
      mctx.fillStyle = colorWithAlpha(portal.color, 0.9);
      mctx.fillRect(-ps / 2, -ps / 2, ps, ps);
      mctx.restore();
      mctx.shadowBlur = 0;
    });

    const viewW = (width / camera.zoom) * scale;
    const viewH = (height / camera.zoom) * scale;
    const vx = (camera.x - width / (2 * camera.zoom)) * scale;
    const vy = (camera.y - height / (2 * camera.zoom)) * scale;
    mctx.strokeStyle = '#9ad1ff';
    mctx.lineWidth = 2;
    mctx.strokeRect(vx, vy, viewW, viewH);

    mctx.fillStyle = '#ffffff';
    mctx.beginPath();
    mctx.arc(camera.x * scale, camera.y * scale, 3.5, 0, Math.PI * 2);
    mctx.fill();
  }

  function getWindArrow(angle) {
    const arrows = ['→', '↗', '↑', '↖', '←', '↙', '↓', '↘'];
    const normalized = ((angle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
    const sector = Math.round(normalized / (Math.PI / 4)) % arrows.length;
    return arrows[sector];
  }

  function updateWindIndicator() {
    if (!windIndicator || !windArrow || !windLabel) return;
    if (!windEnabled) {
      windArrow.textContent = '·';
      windLabel.textContent = 'calm';
      windIndicator.style.opacity = '0.6';
      return;
    }
    windArrow.textContent = getWindArrow(wind.direction);
    const descriptor = wind.strength < 0.45 ? 'breeze' : wind.strength < 0.75 ? 'steady' : 'gust';
    windLabel.textContent = descriptor;
    windIndicator.style.opacity = '1';
  }

  function updateHUD() {
    const secretsFound = discoveredSecrets.length;
    const secretsText = ` <strong>Secrets:</strong> ${secretsFound}/${secrets.length}`;
    const fragmentsFound = thoughtFragments.filter(f => f.collected).length;
    const fragmentText = fragmentsFound ? ` <strong>Fragments:</strong> ${fragmentsFound}/${thoughtFragments.length}` : '';
    coordsEl.innerHTML = `<strong>X:</strong> ${camera.x.toFixed(0)} <strong>Y:</strong> ${camera.y.toFixed(0)} <strong>Zoom:</strong> ${camera.zoom.toFixed(2)}x${secretsText}${fragmentText}`;
    if (hudStatus) {
      const statusBits = [];
      const discoveredStars = constellationStars.filter(s => s.discovered).length;
      statusBits.push(`Stars: ${discoveredStars}/${constellationStars.length}`);
      if (discoveredZones.includes(hiddenZoneName)) statusBits.push('Hidden: ✓');
      if (konamiUnlocked) statusBits.push('Konami: ✓');
      hudStatus.textContent = statusBits.join(' · ');
    }
    updateWindIndicator();
  }

  function loop(timestamp) {
    const dt = lastTime ? timestamp - lastTime : 16;
    lastTime = timestamp;
    const timeScale = meditationMode ? 0.5 : 1;
    const scaledDt = dt * timeScale;
    frameCounter += 1;
    ambientPhase += 0.0001;
    const timeAmbient = currentTimeSettings || timeSettings.night;
    const brightnessBase = typeof timeAmbient.brightnessBase === 'number' ? timeAmbient.brightnessBase : 0.85;
    const brightnessSwing = typeof timeAmbient.brightnessSwing === 'number' ? timeAmbient.brightnessSwing : 0.15;
    const warmthBase = typeof timeAmbient.warmthBase === 'number' ? timeAmbient.warmthBase : 0.5;
    const warmthSwing = typeof timeAmbient.warmthSwing === 'number' ? timeAmbient.warmthSwing : 0.12;
    ambientBrightness = clamp(brightnessBase + brightnessSwing * Math.sin(ambientPhase), 0.6, 1.1);
    ambientWarmth = clamp(warmthBase + warmthSwing * Math.sin(ambientPhase + 1.2), 0, 1);
    const windVector = updateWind(scaledDt);
    const moved = updateCamera(scaledDt) + updateTargetDrift(scaledDt);
    distanceTraveled += moved;
    timeExploring += dt;
    recordTrail(timestamp);
    recordExplorationPath();
    updateParticles(scaledDt, windVector);
    updateFragments(scaledDt, windVector);
    updateEchoes(scaledDt, timestamp);
    updateWisps(scaledDt);
    updateCreatures(scaledDt);
    updateWispEncounters();
    updateZonePresence();
    updateShootingStars(scaledDt, timestamp);
    updateSecrets();
    updateFog(scaledDt);
    updateAurora(scaledDt);
    updateRain(scaledDt, windVector);
    updateWhispers();
    updateCelebrationParticles(scaledDt);
    if (timestamp - lastStatsSave > 500) {
      persistStats();
      lastStatsSave = timestamp;
    }
    drawBackground();
    drawWorld(timestamp);
    drawCelebrationParticles();
    if (!meditationMode) drawMinimap();
    if (!meditationMode) drawJournalOverlay();
    updateHUD();
    requestAnimationFrame(loop);
  }

  function screenToWorld(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const x = (clientX - rect.left - width / 2) / camera.zoom + camera.x;
    const y = (clientY - rect.top - height / 2) / camera.zoom + camera.y;
    return { x, y };
  }

  function getTouchDistance(touches) {
    if (touches.length < 2) return 0;
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    return Math.hypot(dx, dy);
  }

  function closeZonePanel() {
    zoneInfo.classList.remove('visible');
    zoneInfo.classList.remove('hidden-zone');
    seedButton.textContent = '🌱 plant a seed here';
    clearTimeout(handleZoneClick._timer);
    handleZoneClick._timer = null;
    currentZone = null;
    seedModal.classList.remove('visible');
  }

  function handleZoneClick(worldPos) {
    const hit = zones.find(z => {
      if (!isZoneVisible(z)) return false;
      const dx = worldPos.x - z.x;
      const dy = worldPos.y - z.y;
      return Math.hypot(dx, dy) <= getZoneRadius(z) + 30;
    });
    if (hit) {
      currentZone = hit;
      const hidden = isHiddenZone(hit);
      const displayName = hidden ? hiddenZoneDisplayName : getZoneLabel(hit);
      zoneName.textContent = displayName;
      if (hidden) {
        zoneDesc.textContent = 'You found all the secrets. The hidden depths welcome you. Here, at the space between all spaces, you may plant a seed that will grow in the deepest soil.';
        zoneInfo.classList.add('hidden-zone');
        seedButton.textContent = '✨ plant a golden seed';
      } else {
        zoneDesc.textContent = hit.desc;
        zoneInfo.classList.remove('hidden-zone');
        seedButton.textContent = '🌱 plant a seed here';
      }
      zoneInfo.classList.add('visible');
      clearTimeout(handleZoneClick._timer);
      handleZoneClick._timer = setTimeout(() => closeZonePanel(), 4200);
      markZoneDiscovered(hit.name);
      seedModal.classList.remove('visible');
    }
  }

  function handlePortalClick(worldPos) {
    const hit = findPortalHit(worldPos);
    if (hit) {
      showPortalConfirm(hit);
      return true;
    }
    return false;
  }

  function handleTap(worldPos) {
    if (handleThoughtFragmentClick(worldPos)) return;
    if (handlePortalClick(worldPos)) return;
    handleMemoryStarClick(worldPos);
    targetPosition = {
      x: clamp(worldPos.x, 0, worldSize),
      y: clamp(worldPos.y, 0, worldSize)
    };
    handleZoneClick(worldPos);
  }

  function openSeedModal() {
    if (!currentZone) return;
    clearTimeout(handleZoneClick._timer);
    zoneInfo.classList.add('visible');
    seedModal.classList.add('visible');
    setTimeout(() => seedMessage.focus(), 20);
  }

  function closeSeedModal() {
    seedModal.classList.remove('visible');
  }

  function showSeedConfirm() {
    seedConfirm.style.opacity = '1';
    clearTimeout(showSeedConfirm._timer);
    showSeedConfirm._timer = setTimeout(() => seedConfirm.style.opacity = '0', 1500);
  }

  function handleTouchStart(e) {
    if (!e.touches.length) return;
    isTouching = true;
    targetPosition = null;
    if (e.touches.length === 1) {
      const t = e.touches[0];
      lastTouchPos = { x: t.clientX, y: t.clientY };
      tapStartPos = { x: t.clientX, y: t.clientY };
      tapStartTime = performance.now();
      tapMoved = false;
    } else if (e.touches.length === 2) {
      pinchStartDist = getTouchDistance(e.touches);
      startZoom = camera.zoom;
      tapStartTime = 0;
      tapStartPos = null;
    }
  }

  function handleTouchMove(e) {
    if (!e.touches.length) return;
    e.preventDefault();
    if (e.touches.length === 1 && lastTouchPos) {
      const t = e.touches[0];
      const dx = t.clientX - lastTouchPos.x;
      const dy = t.clientY - lastTouchPos.y;
      if (Math.hypot(dx, dy) > 6) tapMoved = true;
      camera.x = clamp(camera.x - dx / camera.zoom, 0, worldSize);
      camera.y = clamp(camera.y - dy / camera.zoom, 0, worldSize);
      lastTouchPos = { x: t.clientX, y: t.clientY };
    } else if (e.touches.length === 2) {
      const dist = getTouchDistance(e.touches);
      if (pinchStartDist) {
        const scale = dist / pinchStartDist;
        camera.zoom = clamp(startZoom * scale, 0.5, 2);
      } else {
        pinchStartDist = dist;
        startZoom = camera.zoom;
      }
    }
  }

  function handleTouchEnd(e) {
    if (e.touches.length < 2) pinchStartDist = 0;
    if (e.touches.length === 0) {
      isTouching = false;
      if (tapStartTime && tapStartPos) {
        const elapsed = performance.now() - tapStartTime;
        const touch = e.changedTouches[0] || { clientX: tapStartPos.x, clientY: tapStartPos.y };
        const endPos = { x: touch.clientX, y: touch.clientY };
        const moveDist = Math.hypot(endPos.x - tapStartPos.x, endPos.y - tapStartPos.y);
        if (moveDist > 6) tapMoved = true;
        if (elapsed <= 200 && !tapMoved) {
          const worldPos = screenToWorld(endPos.x, endPos.y);
          handleTap(worldPos);
        }
      }
      tapStartTime = 0;
      tapStartPos = null;
    } else if (e.touches.length === 1) {
      const t = e.touches[0];
      lastTouchPos = { x: t.clientX, y: t.clientY };
      tapStartTime = performance.now();
      tapStartPos = { x: t.clientX, y: t.clientY };
      tapMoved = false;
    }
  }

  const baseInstruction = 'WASD / arrows to move · drag to pan · scroll to zoom';
  if (instructionEl) {
    if (isTouchDevice) {
      document.body.classList.add('touch');
      instructionEl.textContent = `${baseInstruction} · touch: drag to move • pinch to zoom • tap to drift`;
    } else {
      instructionEl.textContent = baseInstruction;
    }
  }

  loadAudioPreference();
  audioToggle.addEventListener('click', toggleAmbientAudio);
  if (rainToggle) rainToggle.addEventListener('click', toggleRain);
  if (meditationToggle) meditationToggle.addEventListener('click', toggleMeditationMode);

  canvas.addEventListener('pointerdown', e => {
    if (e.pointerType === 'touch') return;
    dragging = true;
    targetPosition = null;
    lastPointer.x = e.clientX;
    lastPointer.y = e.clientY;
  });
  window.addEventListener('pointermove', e => {
    if (e.pointerType === 'touch' || !dragging) return;
    const dx = e.clientX - lastPointer.x;
    const dy = e.clientY - lastPointer.y;
    camera.x = clamp(camera.x - dx / camera.zoom, 0, worldSize);
    camera.y = clamp(camera.y - dy / camera.zoom, 0, worldSize);
    lastPointer.x = e.clientX;
    lastPointer.y = e.clientY;
  });
  window.addEventListener('pointerup', e => {
    if (e.pointerType === 'touch') return;
    dragging = false;
  });
  canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
  canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
  canvas.addEventListener('touchend', handleTouchEnd);
  canvas.addEventListener('touchcancel', handleTouchEnd);
  canvas.addEventListener('click', e => {
    const worldPos = screenToWorld(e.clientX, e.clientY);
    if (handleThoughtFragmentClick(worldPos)) return;
    if (handlePortalClick(worldPos)) return;
    if (checkConstellationClick(worldPos.x, worldPos.y)) return;
    handleMemoryStarClick(worldPos);
    handleZoneClick(worldPos);
  });
  if (portalEnterBtn) {
    portalEnterBtn.addEventListener('click', () => {
      if (!activePortal) return;
      window.open(activePortal.url, '_blank');
      hidePortalConfirm();
    });
  }
  if (portalStayBtn) {
    portalStayBtn.addEventListener('click', () => hidePortalConfirm());
  }
  if (portalOverlay) {
    portalOverlay.addEventListener('click', e => {
      if (e.target === portalOverlay) hidePortalConfirm();
    });
  }
  const closePoemOverlay = () => {
    if (poemOverlay) poemOverlay.classList.remove('visible');
  };
  if (poemButton) {
    poemButton.addEventListener('click', () => {
      updatePoemOverlay();
      poemOverlay?.classList.add('visible');
    });
  }
  if (poemClose) poemClose.addEventListener('click', closePoemOverlay);
  if (poemCloseMain) poemCloseMain.addEventListener('click', closePoemOverlay);
  if (poemOverlay) {
    poemOverlay.addEventListener('click', e => {
      if (e.target === poemOverlay) closePoemOverlay();
    });
  }
  seedButton.addEventListener('click', () => {
    if (zoneInfo.classList.contains('visible') && currentZone) openSeedModal();
  });
  plantButton.addEventListener('click', () => {
    if (!currentZone) return;
    const concept = currentZone.name.toLowerCase();
    const seedText = seedMessage.value.trim();
    const gardener = seedName.value.trim();
    const label = isHiddenZone(currentZone) ? 'hidden-seed' : 'seed';
    const url = `https://github.com/ai-village-agents/edge-garden/issues/new?template=seed.yml&concept=${encodeURIComponent(concept)}&seed=${encodeURIComponent(seedText)}&gardener=${encodeURIComponent(gardener)}&labels=${encodeURIComponent(label)}`;
    window.open(url, '_blank');
    showSeedConfirm();
    closeSeedModal();
    seedMessage.value = '';
    seedName.value = '';
  });
  if (zoneClose) {
    zoneClose.addEventListener('click', e => {
      e.stopPropagation();
      closeZonePanel();
    });
  }
  window.addEventListener('pointerdown', e => {
    if (seedModal.classList.contains('visible') && !seedModal.contains(e.target) && e.target !== seedButton) {
      closeSeedModal();
    }
    const interactingWithSeed = seedModal.contains(e.target) || e.target === seedButton || seedAction.contains?.(e.target);
    if (zoneInfo.classList.contains('visible') && !zoneInfo.contains(e.target) && !interactingWithSeed) {
      closeZonePanel();
    }
  });
  if (konamiOverlay) {
    konamiOverlay.addEventListener('click', () => konamiOverlay.classList.remove('visible'));
  }
  window.addEventListener('pointerdown', () => handlePendingAudioStart(), { once: true });

  window.addEventListener('wheel', e => {
    const zoomFactor = Math.exp(-e.deltaY * 0.001);
    camera.zoom = Math.max(0.5, Math.min(2, camera.zoom * zoomFactor));
  }, { passive: true });

  window.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      hidePortalConfirm();
      closeSeedModal();
      closeZonePanel();
      closePoemOverlay();
      return;
    }
    if (e.key === 'j' || e.key === 'J') {
      journalOpen = !journalOpen;
      return;
    }
    if (e.key === 'm' || e.key === 'M') {
      toggleMeditationMode();
      return;
    }
    handleKonamiInput(e.key);
    keys[e.code] = true;
  });
  window.addEventListener('keyup', e => {
    keys[e.code] = false;
  });

  window.addEventListener('resize', () => {
    resize();
    initParticles();
  });

  loadDiscoveredZones();
  loadDiscoveredSecrets();
  loadConstellationStars();
  loadMemoryStars();
  loadThoughtFragments();
  loadStats();
  loadKonamiUnlock();
  loadMeditationPreference();
  applyTimeOfDaySettings(timeOfDay);
  refreshTimeOfDay();
  updateRainToggle();
  updatePoemOverlay();
  resize();
  initParticles();
  initFragments();
  initEchoes();
  initRain();
  initWisps();
  initCreatures();
  initFogPatches();
  initNebulaPatches();
  nextWhisperTime = getNextWhisperFrames();
  auroraTimer = nextAuroraTimer();
  scheduleNextShootingStar(0);
  setInterval(refreshTimeOfDay, 60000);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
