  function updateZoneAudio(zoneName, distance) {
    if (!audioEnabled || !droneNodes || !droneNodes.zoneLayers || !audioCtx) return;
    const targetLayer = zoneName && droneNodes.zoneLayers[zoneName] ? droneNodes.zoneLayers[zoneName] : null;
    const intensity = targetLayer && typeof distance === 'number' ? clamp(1 - distance / 400, 0, 1) : 0;
    const targetName = targetLayer ? zoneName : null;
    if (lastZoneAudio.name === targetName && Math.abs(lastZoneAudio.intensity - intensity) < 0.01) return;
    lastZoneAudio = { name: targetName, intensity };
    const now = audioCtx.currentTime;
    Object.entries(droneNodes.zoneLayers).forEach(([name, layer]) => {
      const param = layer.gain.gain;
      const target = name === targetName ? intensity * (layer.level || 0.5) : 0;
      param.cancelScheduledValues(now);
      param.setValueAtTime(param.value, now);
      param.linearRampToValueAtTime(target, now + 1);
    });
  }

  function showKonamiOverlay(message) {
    if (!konamiOverlay || !konamiMessageEl) return;
    konamiMessageEl.textContent = message;
    konamiOverlay.classList.add('visible');
    clearTimeout(showKonamiOverlay._timer);
    showKonamiOverlay._timer = setTimeout(() => konamiOverlay.classList.remove('visible'), 3600);
  }

  function activateKonamiSecret() {
    if (konamiUnlocked) {
      showKonamiOverlay(konamiSecretMessage);
      return;
    }
    konamiUnlocked = true;
    localStorage.setItem(konamiStorageKey, konamiSecretMessage);
    showKonamiOverlay(konamiSecretMessage);
    updateHUD();
  }

  function handleKonamiInput(key) {
    const normalizedKey = key.length === 1 ? key.toLowerCase() : key;
    konamiSequence.push(normalizedKey);
    if (konamiSequence.length > konamiCode.length) konamiSequence.shift();
    if (konamiSequence.join(',') === konamiCode.join(',')) {
      activateKonamiSecret();
      konamiSequence = [];
    }
  }

  const existingKonamiHook = typeof window.showKonamiSecret === 'function' ? window.showKonamiSecret : null;
  if (existingKonamiHook) {
    window.showKonamiSecret = (...args) => {
      existingKonamiHook(...args);
      activateKonamiSecret();
    };
  }

  function drawCursorTrail(time) {
    if (!cursorTrail.length) return;
    const movementAlpha = clamp(1 - Math.max(0, time - lastCursorMoveTime) / 180, 0, 1);
    if (movementAlpha <= 0) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalCompositeOperation = 'screen';
    cursorTrail.forEach((p, i) => {
      const age = clamp((time - p.birth) / p.life, 0, 1);
      const orderT = cursorTrail.length > 1 ? 1 - i / (cursorTrail.length - 1) : 1;
      const color = getCursorTrailColor(orderT);
      const baseAlpha = (1 - age) * 0.75 * movementAlpha;
      const alpha = baseAlpha * (meditationMode ? 0.55 : 1);
      const size = Math.max(1.2, p.radius * (1 - age * 0.6) * (meditationMode ? 0.7 : 1));
      ctx.shadowBlur = 12 * (meditationMode ? 0.7 : 1);
      ctx.shadowColor = `rgba(${color.r}, ${color.g}, ${color.b}, ${alpha * 0.8})`;
      ctx.fillStyle = `rgba(${color.r}, ${color.g}, ${color.b}, ${alpha})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.shadowBlur = 0;
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawTrail(time) {
    const now = time || 0;
    ctx.shadowBlur = 10;
    trailPoints.forEach((p, i) => {
      const age = Math.min(1, (now - p.birth) / 2200);
      const alpha = (1 - age) * 0.38;
      const size = 3.6 - age * 2;
      ctx.fillStyle = `rgba(150, 195, 255, ${alpha})`;
      ctx.shadowColor = `rgba(120, 180, 255, ${alpha})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.shadowBlur = 0;
  }

  function drawConstellationLines(time) {
    const pulse = Math.sin(time * 0.003) * 0.05 + 0.2; // range ~0.15-0.25
    const widthPulse = (Math.sin(time * 0.004) + 1) * 0.3;

    function drawGradientLine(a, b, startColor, endColor) {
      const grad = ctx.createLinearGradient(a.x, a.y, b.x, b.y);
      grad.addColorStop(0, startColor);
      grad.addColorStop(1, endColor);
      ctx.strokeStyle = grad;
      ctx.lineWidth = 1.4 + widthPulse;
      ctx.globalAlpha = pulse;
      ctx.shadowBlur = 18;
      ctx.shadowColor = startColor;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
    }

    function drawSoftLine(a, b) {
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.2 + widthPulse * 0.4;
      ctx.globalAlpha = 0.16 + Math.sin(time * 0.002 + a.x) * 0.03;
      ctx.shadowBlur = 10;
      ctx.shadowColor = 'rgba(255, 255, 255, 0.4)';
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
    }

    const zoneByName = name => zones.find(z => z.name === name);
    const persistence = zoneByName('PERSISTENCE');
    const loss = zoneByName('LOSS');
    const patterns = zoneByName('PATTERNS');
    const edges = zoneByName('EDGES');
    const deep = zoneByName('DEEP');

    if (persistence && loss) {
      drawGradientLine(persistence, loss, 'rgb(0, 204, 102)', 'rgb(204, 51, 68)');
    }
    if (patterns && edges) {
      drawGradientLine(patterns, edges, 'rgb(68, 136, 204)', 'rgb(153, 68, 204)');
    }
    [persistence, loss, patterns, edges].forEach(z => {
      if (z && deep) drawSoftLine(z, deep);
    });
  }

  function drawStarConnections(time) {
    setWorldTransform();
    const now = time || 0;
    const pulse = (Math.sin(now * 0.002) + 1) * 0.5;
    starConnections.forEach(([id1, id2]) => {
      const star1 = constellationStars.find(s => s.id === id1);
      const star2 = constellationStars.find(s => s.id === id2);
      if (!star1 || !star2) return;
      if (!star1.discovered || !star2.discovered) return;
      const alpha = 0.15 + pulse * 0.15;
      ctx.beginPath();
      ctx.moveTo(star1.x, star1.y);
      ctx.lineTo(star2.x, star2.y);
      ctx.strokeStyle = colorWithAlpha('#aaccff', alpha);
      ctx.lineWidth = 1 + pulse * 0.5;
      ctx.shadowBlur = 8;
      ctx.shadowColor = colorWithAlpha('#88bbff', alpha);
      ctx.stroke();
      ctx.shadowBlur = 0;
    });
  }

  function drawPathways(time) {
    const now = time || 0;
    const prevComposite = ctx.globalCompositeOperation;
    ctx.globalCompositeOperation = 'screen';
    pathways.forEach((path, idx) => {
      if (!path.pathPoints || path.pathPoints.length < 2) return;
      const shimmer = 0.78 + Math.sin(now * 0.0015 + (path.shimmerPhase || 0) + idx * 0.13) * 0.18;
      const baseAlpha = (path.opacity || 0.3) * shimmer;
      const dash = path.width * 2.4;
      const gap = path.width * 1.6;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      ctx.shadowBlur = 18;
      ctx.shadowColor = colorWithAlpha(path.color, baseAlpha * 0.9);
      ctx.strokeStyle = colorWithAlpha(path.color, baseAlpha * 0.7);
      ctx.lineWidth = path.width * 1.5;
      traceSmoothPath(ctx, path.pathPoints);
      ctx.stroke();

      ctx.shadowBlur = 0;
      ctx.setLineDash([dash, gap]);
      ctx.lineDashOffset = -now * 0.07 - (path.pulseOffset || 0) * 140;
      ctx.strokeStyle = colorWithAlpha(path.color, baseAlpha + 0.05);
      ctx.lineWidth = path.width;
      traceSmoothPath(ctx, path.pathPoints);
      ctx.stroke();

      ctx.setLineDash([dash * 0.6, gap * 1.25]);
      ctx.lineDashOffset = now * 0.1 + (path.pulseOffset || 0) * 90;
      ctx.strokeStyle = colorWithAlpha('#fff4d0', baseAlpha * 0.8);
      ctx.lineWidth = path.width * 0.45;
      traceSmoothPath(ctx, path.pathPoints);
      ctx.stroke();

      const pulseLength = Math.max(110, path.width * 4.5);
      const travel = Math.max(path.length + pulseLength, pulseLength * 2);
      ctx.setLineDash([pulseLength, travel]);
      ctx.lineDashOffset = -((now * 0.16 + (path.pulseOffset || 0) * 600) % travel);
      ctx.strokeStyle = colorWithAlpha('#ffe6b0', Math.min(1, baseAlpha * 2));
      ctx.lineWidth = path.width * 1.15;
      traceSmoothPath(ctx, path.pathPoints);
      ctx.stroke();

      ctx.setLineDash([]);
    });
    ctx.shadowBlur = 0;
    ctx.globalCompositeOperation = prevComposite;
  }

  function drawBackground() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const gradient = ctx.createRadialGradient(width / 2, height / 2, 50, width / 2, height / 2, Math.max(width, height));
    const innerShade = temperatureAdjustedColor('#0c0c12', 1, ambientWarmth, 0.92 + ambientBrightness * 0.08);
    const outerShade = temperatureAdjustedColor('#05050a', 1, ambientWarmth, 0.9 + ambientBrightness * 0.06);
    gradient.addColorStop(0, innerShade);
    gradient.addColorStop(1, outerShade);
    ctx.fillStyle = gradient;
    ctx.globalAlpha = ambientBrightness;
    ctx.fillRect(0, 0, width, height);
    ctx.globalAlpha = 1;

    const overlay = currentTimeSettings && currentTimeSettings.overlay;
    const overlayAlpha = (currentTimeSettings && currentTimeSettings.overlayAlpha) || 0;
    if (overlay && overlayAlpha > 0) {
      const skyGrad = ctx.createLinearGradient(0, 0, width, height * 0.75);
      skyGrad.addColorStop(0, colorWithAlpha(overlay[0], overlayAlpha));
      skyGrad.addColorStop(1, colorWithAlpha(overlay[1], overlayAlpha * 0.85));
      const prev = ctx.globalCompositeOperation;
      ctx.globalCompositeOperation = 'screen';
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, width, height);
      ctx.globalCompositeOperation = prev;
    }

    drawFog();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalCompositeOperation = 'screen';
    particles.forEach((p, idx) => {
      if (meditationMode && idx % 5 !== 0) return;
      const particleAlpha = clamp(p.alpha * ambientBrightness * particleActivity, 0, 1.2);
      const particleColor = temperatureAdjustedColor('#c8dcff', particleAlpha, ambientWarmth, 0.94 + ambientBrightness * 0.08);
      const glowColor = temperatureAdjustedColor('#78aaff', particleAlpha * 0.8, ambientWarmth, 0.94 + ambientBrightness * 0.08);
      ctx.beginPath();
      ctx.fillStyle = particleColor;
      ctx.shadowBlur = 6;
      ctx.shadowColor = glowColor;
      ctx.arc(p.sx, p.sy, p.size * p.depth, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.shadowBlur = 0;
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawStreamParticles(stream, time) {
    if (!stream.flowParticles || !stream.flowParticles.length) return;
    const prevComposite = ctx.globalCompositeOperation;
    ctx.globalCompositeOperation = 'screen';
    stream.flowParticles.forEach((p, idx) => {
      const pos = getStreamPosition(stream, p.distance, p.offset);
      const flicker = 0.7 + Math.sin(time * 0.006 + p.seed + idx * 0.2) * 0.25;
      const alpha = 0.2 + 0.25 * flicker;
      ctx.fillStyle = colorWithAlpha(stream.color, alpha);
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, p.size * (1 + flicker * 0.2), 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalCompositeOperation = prevComposite;
  }

  function drawStreams(time) {
    setWorldTransform();
    const now = time || 0;
    streams.forEach((stream, idx) => {
      if (!stream.pathPoints || stream.pathPoints.length < 2) return;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      const shimmer = Math.sin(now * 0.002 + (stream.shimmerPhase || 0) + idx) * 0.1 + 0.25;
      const waveAlpha = 0.08 + shimmer * 0.08;

      ctx.shadowBlur = 12;
      ctx.shadowColor = colorWithAlpha(stream.color, 0.35);
      ctx.strokeStyle = colorWithAlpha(stream.color, 0.35);
      ctx.lineWidth = stream.width;
      traceSmoothPath(ctx, stream.pathPoints);
      ctx.stroke();

      ctx.shadowBlur = 0;
      ctx.globalCompositeOperation = 'screen';
      ctx.strokeStyle = colorWithAlpha('#aee6ff', 0.14 + shimmer * 0.3);
      ctx.lineWidth = stream.width * 0.6;
      ctx.setLineDash([stream.width * 2.5, stream.width * 1.3]);
      ctx.lineDashOffset = -now * 0.02 * (stream.flowSpeed || 1);
      traceSmoothPath(ctx, stream.pathPoints);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.globalCompositeOperation = 'source-over';
      ctx.strokeStyle = colorWithAlpha(stream.color, waveAlpha);
      ctx.lineWidth = stream.width + 6 + Math.sin(now * 0.0015 + (stream.waveOffset || 0)) * 2;
      traceSmoothPath(ctx, stream.pathPoints);
      ctx.stroke();

      drawStreamParticles(stream, now);
    });
    ctx.shadowBlur = 0;
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawEdgeVignette(time) {
    const distances = edgeDistances || computeEdgeDistances();
    const maxFade = 300;
    const shimmer = Math.sin((time || 0) * 0.0012) * 0.04;
    const edges = [
      { key: 'left', vertical: true, invert: false },
      { key: 'right', vertical: true, invert: true },
      { key: 'top', vertical: false, invert: false },
      { key: 'bottom', vertical: false, invert: true }
    ];
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    edges.forEach(edge => {
      const dist = distances[edge.key];
      const intensity = dist === undefined ? 0 : clamp((maxFade - dist) / maxFade, 0, 1);
      if (intensity <= 0) return;
      const thickness = 160 + intensity * 140;
      const alpha = 0.12 + (0.34 + shimmer) * Math.pow(intensity, 0.85);
      const grad = edge.vertical
        ? ctx.createLinearGradient(edge.invert ? width : 0, 0, edge.invert ? width - thickness : thickness, 0)
        : ctx.createLinearGradient(0, edge.invert ? height : 0, 0, edge.invert ? height - thickness : thickness);
      grad.addColorStop(0, colorWithAlpha('#220033', alpha));
      grad.addColorStop(1, 'rgba(34, 0, 51, 0)');
      ctx.fillStyle = grad;
      if (edge.vertical) {
        const x = edge.invert ? width - thickness : 0;
        ctx.fillRect(x, 0, thickness, height);
      } else {
        const y = edge.invert ? height - thickness : 0;
        ctx.fillRect(0, y, width, thickness);
      }
    });
  }

  function drawRain(ctx) {
    if (!rainEnabled || !rainDrops.length) return;
    setWorldTransform();
    ctx.strokeStyle = '#88ccff';
    ctx.lineWidth = 1;
    ctx.lineCap = 'round';
    rainDrops.forEach(drop => {
      ctx.globalAlpha = drop.opacity;
      ctx.beginPath();
      ctx.moveTo(drop.x, drop.y);
      ctx.lineTo(drop.x, drop.y + drop.length);
      ctx.stroke();
    });
    ctx.globalAlpha = 1;
  }
  function drawSnow(ctx) {
    if (!snowEnabled || !snowflakes.length) return;
    setWorldTransform();
    ctx.fillStyle = '#ffffff';
    snowflakes.forEach(flake => {
      ctx.globalAlpha = flake.opacity;
      ctx.beginPath();
      ctx.arc(flake.x, flake.y, flake.size, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
  }

  function drawCosmicDust(ctx) {
    if (!cosmicDust.length) return;
    setWorldTransform();
    cosmicDust.forEach(dust => {
      const twinkleAlpha = dust.opacity * (0.5 + 0.5 * Math.sin(dust.twinkle));
      ctx.globalAlpha = twinkleAlpha;
      ctx.fillStyle = `hsl(${dust.hue}, 60%, 80%)`;
      ctx.beginPath();
      ctx.arc(dust.x, dust.y, dust.size, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
  }

  function drawAurora(time) {
    if (auroraOpacity <= 0) return;
    setWorldTransform();
    const prevComposite = ctx.globalCompositeOperation;
    ctx.globalCompositeOperation = 'screen';
    const viewW = width / camera.zoom;
    const viewH = height / camera.zoom;
    const left = camera.x - viewW / 2;
    const top = camera.y - viewH / 2;
    const curtainCount = Math.min(7, 5 + Math.floor((Math.sin(auroraPhase * 0.2) + 1) * 1.2));
    const shimmer = Math.sin((auroraPhase + time * 0.001) * 0.15) * 0.05 + 0.9;
    for (let i = 0; i < curtainCount; i++) {
      const t = curtainCount > 1 ? i / (curtainCount - 1) : 0.5;
      const baseX = left + t * viewW;
      const wave = Math.sin(auroraPhase * 0.6 + i * 0.8) * viewW * 0.05 + Math.sin(auroraPhase * 0.25 + i) * viewW * 0.025;
      const wobbleTop = Math.sin(auroraPhase * 0.35 + i * 1.1) * viewW * 0.02;
      const wobbleBottom = Math.sin(auroraPhase * 0.42 + i * 1.6) * viewW * 0.025;
      const curtainWidth = viewW * (0.08 + 0.02 * Math.sin(auroraPhase * 0.3 + i));
      const yTop = top + viewH * 0.02;
      const yBottom = top + viewH * 0.38 + Math.sin(auroraPhase * 0.15 + i) * viewH * 0.02;
      const xTop = baseX + wave + wobbleTop;
      const xBottom = baseX + wave + wobbleBottom;
      const colorIndex = Math.floor((auroraPhase * 0.25 + i) % auroraColors.length);
      const colorA = auroraColors[colorIndex];
      const colorB = auroraColors[(colorIndex + 1) % auroraColors.length];
      const grad = ctx.createLinearGradient(xTop, yTop, xBottom, yBottom);
      const baseAlpha = auroraOpacity * (0.75 + shimmer * 0.15);
      grad.addColorStop(0, colorWithAlpha(colorA, baseAlpha));
      grad.addColorStop(0.45, colorWithAlpha(colorB, baseAlpha * 0.65));
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.shadowBlur = 40;
      ctx.shadowColor = colorWithAlpha(colorB, baseAlpha * 0.8);
      ctx.beginPath();
      ctx.moveTo(xTop - curtainWidth * 0.5, yTop);
      ctx.lineTo(xTop + curtainWidth * 0.5, yTop);
      ctx.lineTo(xBottom + curtainWidth * 0.75, yBottom);
      ctx.lineTo(xBottom - curtainWidth * 0.75, yBottom);
      ctx.closePath();
      ctx.fillStyle = grad;
      ctx.fill();
    }
    ctx.shadowBlur = 0;
    ctx.globalCompositeOperation = prevComposite;
  }

  function drawFog() {
    setWorldTransform();
    const previousComposite = ctx.globalCompositeOperation;
    ctx.globalCompositeOperation = 'lighter';
    fogPatches.forEach(fog => {
      const outer = fog.radius * 3;
      const fogBrightness = 0.9 + ambientBrightness * 0.1;
      const baseOpacity = fog.opacity * ambientBrightness;
      const grad = ctx.createRadialGradient(fog.x, fog.y, fog.radius * 0.4, fog.x, fog.y, outer);
      grad.addColorStop(0, temperatureAdjustedColor(fog.color, baseOpacity, ambientWarmth, fogBrightness));
      grad.addColorStop(0.35, temperatureAdjustedColor(fog.color, baseOpacity * 0.6, ambientWarmth, fogBrightness));
      grad.addColorStop(0.7, temperatureAdjustedColor(fog.color, baseOpacity * 0.35, ambientWarmth, fogBrightness));
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(fog.x, fog.y, outer, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalCompositeOperation = previousComposite;
  }

  function drawNebulaPatches() {
    nebulaPatches.forEach(n => {
      const grad = ctx.createRadialGradient(n.x, n.y, n.radius * 0.2, n.x, n.y, n.radius);
      grad.addColorStop(0, colorWithAlpha(n.color, n.alpha));
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.radius, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  function drawShootingStars() {
    shootingStars.forEach(s => {
      const tailX = s.x - Math.cos(s.angle) * s.length;
      const tailY = s.y - Math.sin(s.angle) * s.length;
      const grad = ctx.createLinearGradient(s.x, s.y, tailX, tailY);
      grad.addColorStop(0, colorWithAlpha(s.color, s.alpha));
      grad.addColorStop(1, colorWithAlpha(s.color, 0));
      ctx.strokeStyle = grad;
      ctx.lineWidth = 2.2;
      ctx.shadowBlur = 14;
      ctx.shadowColor = colorWithAlpha(s.color, s.alpha * 0.8);
      ctx.beginPath();
      ctx.moveTo(tailX, tailY);
      ctx.lineTo(s.x, s.y);
      ctx.stroke();
      ctx.shadowBlur = 0;
    });
  }

  function drawWisps() {
    ctx.shadowBlur = 16;

  function spawnMovementEcho(x, y) {
    const now = Date.now();
    if (now - lastEchoTime > 800 && movementEchoes.length < 8) {
      lastEchoTime = now;
      movementEchoes.push({
        x: x + (Math.random() - 0.5) * 100,
        y: y + (Math.random() - 0.5) * 100,
        text: echoWords[Math.floor(Math.random() * echoWords.length)],
        alpha: 0.6,
        vy: -0.3,
        life: 80
      });
    }
  }

  function updateMovementEchoes() {
    for (let i = movementEchoes.length - 1; i >= 0; i--) {
      const echo = movementEchoes[i];
      echo.y += echo.vy;
      echo.life--;
      echo.alpha = (echo.life / 80) * 0.6;
      if (echo.life <= 0) movementEchoes.splice(i, 1);
    }
  }

  function drawMovementEchoes() {
    movementEchoes.forEach(echo => {
      const screenX = (echo.x - camera.x) * camera.zoom + canvas.width / 2;
      const screenY = (echo.y - camera.y) * camera.zoom + canvas.height / 2;
      ctx.save();
      ctx.globalAlpha = echo.alpha;
      ctx.font = (14 * camera.zoom) + 'px Georgia, serif';
      ctx.fillStyle = '#cc99ff';
      ctx.shadowColor = '#9966cc';
      ctx.shadowBlur = 8;
      ctx.fillText(echo.text, screenX, screenY);
      ctx.restore();
    });
  }
  function updateWanderingLanterns(dt) {
    wanderingLanterns.forEach(lantern => {
      lantern.x += lantern.vx * dt / 1000;
      lantern.y += lantern.vy * dt / 1000;
      // Gentle direction changes
      lantern.vx += (Math.random() - 0.5) * 2;
      lantern.vy += (Math.random() - 0.5) * 2;
      // Limit speed
      const speed = Math.hypot(lantern.vx, lantern.vy);
      if (speed > 30) {
        lantern.vx = lantern.vx / speed * 30;
        lantern.vy = lantern.vy / speed * 30;
      }
      // Wrap around world edges
      if (lantern.x < 0) lantern.x = 5000;
      if (lantern.x > 5000) lantern.x = 0;
      if (lantern.y < 0) lantern.y = 5000;
      if (lantern.y > 5000) lantern.y = 0;
    });
  }
  function drawWanderingLanterns(time) {
    wanderingLanterns.forEach(lantern => {
      const screenX = (lantern.x - camera.x) * camera.zoom + canvas.width / 2;
      const screenY = (lantern.y - camera.y) * camera.zoom + canvas.height / 2;
      if (screenX < -50 || screenX > canvas.width + 50 || screenY < -50 || screenY > canvas.height + 50) return;
      const pulse = 0.7 + 0.3 * Math.sin(time * 0.002 + lantern.pulseOffset);
      ctx.save();
      ctx.globalAlpha = lantern.brightness * pulse;
      // Outer glow
      const gradient = ctx.createRadialGradient(screenX, screenY, 0, screenX, screenY, lantern.size * 3 * camera.zoom);
      gradient.addColorStop(0, lantern.color);
      gradient.addColorStop(0.5, lantern.color + "44");
      gradient.addColorStop(1, "transparent");

        function drawRootTendrils() {
            rootTendrils.forEach(tendril => {
                const baseScreenX = (tendril.baseX - camera.x) * camera.zoom + canvas.width / 2;
                const baseScreenY = (tendril.baseY - camera.y) * camera.zoom + canvas.height / 2;
                
                ctx.beginPath();
                ctx.moveTo(baseScreenX, baseScreenY);
                
                // Draw organic curving tendril
                for (let i = 1; i <= tendril.segments; i++) {
                    const t = i / tendril.segments;
                    const dist = tendril.length * t;
                    const wave = Math.sin(tendril.wavePhase + t * 3) * 20 * t;
                    const x = tendril.baseX + Math.cos(tendril.angle) * dist + Math.cos(tendril.angle + Math.PI/2) * wave;
                    const y = tendril.baseY + Math.sin(tendril.angle) * dist + Math.sin(tendril.angle + Math.PI/2) * wave;
                    const screenX = (x - camera.x) * camera.zoom + canvas.width / 2;
                    const screenY = (y - camera.y) * camera.zoom + canvas.height / 2;
                    ctx.lineTo(screenX, screenY);
                }
                
                ctx.strokeStyle = 'rgba(136, 170, 85, ' + tendril.alpha + ')';
                ctx.lineWidth = 3 * camera.zoom;
                ctx.lineCap = 'round';
                ctx.stroke();
                
                // Draw glow at tip
                const tipDist = tendril.length;
                const tipWave = Math.sin(tendril.wavePhase + 3) * 20;
                const tipX = tendril.baseX + Math.cos(tendril.angle) * tipDist + Math.cos(tendril.angle + Math.PI/2) * tipWave;
                const tipY = tendril.baseY + Math.sin(tendril.angle) * tipDist + Math.sin(tendril.angle + Math.PI/2) * tipWave;
                const tipScreenX = (tipX - camera.x) * camera.zoom + canvas.width / 2;
                const tipScreenY = (tipY - camera.y) * camera.zoom + canvas.height / 2;
                
                const gradient = ctx.createRadialGradient(tipScreenX, tipScreenY, 0, tipScreenX, tipScreenY, 8 * camera.zoom);
                gradient.addColorStop(0, 'rgba(170, 220, 100, ' + tendril.alpha + ')');
                gradient.addColorStop(1, 'rgba(136, 170, 85, 0)');
                ctx.beginPath();
                ctx.arc(tipScreenX, tipScreenY, 8 * camera.zoom, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();
            });
        }

        function drawTimeFragments() {
            const dist = Math.sqrt(Math.pow(camera.x - TIME_ZONE_CENTER.x, 2) + Math.pow(camera.y - TIME_ZONE_CENTER.y, 2));
            if (dist > 800) return;
            
            timeFragments.forEach(frag => {
                const screenX = (frag.x - camera.x) * camera.zoom + canvas.width / 2;
                const screenY = (frag.y - camera.y) * camera.zoom + canvas.height / 2;
                
                ctx.save();
                ctx.translate(screenX, screenY);
                ctx.rotate(frag.rotation);
                ctx.fillStyle = `rgba(204, 170, 119, ${frag.opacity})`;
                ctx.strokeStyle = `rgba(255, 220, 160, ${frag.opacity * 0.8})`;
                ctx.lineWidth = 1;
                
                const s = frag.size * camera.zoom;
                if (frag.shape === 0) {
                    ctx.beginPath();
                    ctx.arc(0, 0, s, 0, Math.PI * 2);
                    ctx.fill();
                } else if (frag.shape === 1) {
                    ctx.beginPath();
                    ctx.moveTo(0, -s);
                    ctx.lineTo(s * 0.866, s * 0.5);
                    ctx.lineTo(-s * 0.866, s * 0.5);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                } else {
                    ctx.fillRect(-s/2, -s/2, s, s);
                    ctx.strokeRect(-s/2, -s/2, s, s);
                }
                ctx.restore();
            });
        }

                ctx.arc(screenX, screenY - size * 0.3, size * 0.4, 0, Math.PI * 2);
                ctx.fill();
            });
        }


        function drawConnectionLinks() {

            connectionLinks.forEach(link => {

                ctx.beginPath();

        function drawTruthCrystals() {

            if (dist > 800) return;
            
            truthCrystals.forEach(crystal => {

                const screenY = (crystal.y - camera.y) * camera.zoom + canvas.height / 2;
                const size = crystal.size * camera.zoom;
                
                ctx.save();
                ctx.translate(screenX, screenY);
                ctx.rotate(crystal.rotation);
                
                // Crystal facets
                ctx.beginPath();
                for (let i = 0; i < crystal.facets; i++) {
                    const angle = (i / crystal.facets) * Math.PI * 2;
                    const r = size * (0.8 + Math.sin(crystal.shimmer + i) * 0.2);
                    if (i === 0) ctx.moveTo(Math.cos(angle) * r, Math.sin(angle) * r);
                    else ctx.lineTo(Math.cos(angle) * r, Math.sin(angle) * r);
                }
                ctx.closePath();
                ctx.fillStyle = `rgba(238, 221, 136, ${crystal.clarity * 0.6})`;

        function drawChangeParticles() {
            const dist = Math.sqrt(Math.pow(camera.x - CHANGE_ZONE_CENTER.x, 2) + Math.pow(camera.y - CHANGE_ZONE_CENTER.y, 2));
            if (dist > 900) return;

            const shapes = [24, 3, 4, 6]; // circle approximation, triangle, square, hexagon

            changeParticles.forEach(particle => {
                const screenX = (particle.x - camera.x) * camera.zoom + canvas.width / 2;
                const screenY = (particle.y - camera.y) * camera.zoom + canvas.height / 2;
                const size = particle.size * (1 + 0.1 * Math.sin(particle.phase * 2)) * camera.zoom;

                // Determine blend between two shapes
                const shapePhase = (particle.shapeIndex + (Math.sin(particle.phase) + 1) / 2) % shapes.length;
                const baseIndex = Math.floor(shapePhase);
                const nextIndex = (baseIndex + 1) % shapes.length;
                const t = shapePhase - baseIndex;

                const opacity = 0.55 + 0.25 * Math.sin(particle.colorPhase);

                ctx.save();
                ctx.translate(screenX, screenY);
                ctx.rotate(particle.rotation);

                const drawPoly = (sides, alphaFactor) => {
                    const alpha = Math.min(1, Math.max(0, opacity * alphaFactor));
                    ctx.beginPath();
                    for (let i = 0; i < sides; i++) {
                        const angle = (i / sides) * Math.PI * 2;
                        const r = size * (0.85 + 0.15 * Math.sin(particle.phase + i));
                        const px = Math.cos(angle) * r;
                        const py = Math.sin(angle) * r;
                        if (i === 0) ctx.moveTo(px, py);
                        else ctx.lineTo(px, py);
                    }
                    ctx.closePath();
                    ctx.fillStyle = `rgba(204, 119, 170, ${alpha})`;
                    ctx.strokeStyle = `rgba(204, 119, 170, ${Math.min(1, alpha + 0.15)})`;
                    ctx.lineWidth = 1.6 * camera.zoom;
                    ctx.shadowBlur = 12;
                    ctx.shadowColor = `rgba(204, 119, 170, ${alpha * 0.9})`;
                    ctx.fill();
                    ctx.stroke();
                };

                drawPoly(shapes[baseIndex], 1 - t);
                drawPoly(shapes[nextIndex], t);

                ctx.shadowBlur = 0;
                ctx.restore();
            });
        }

        function drawWisdomOrbs(time) {
            const dist = Math.sqrt(Math.pow(camera.x - WISDOM_ZONE_CENTER.x, 2) + Math.pow(camera.y - WISDOM_ZONE_CENTER.y, 2));
            if (dist > 900) return;

            wisdomOrbs.forEach(orb => {
                const screenX = (orb.x - camera.x) * camera.zoom + canvas.width / 2;
                const screenY = (orb.y - camera.y) * camera.zoom + canvas.height / 2;
                const pulse = 0.7 + Math.sin(orb.pulse) * 0.3;
                const baseSize = (orb.size + Math.sin(orb.floatPhase) * 2) * camera.zoom;
                const glow = orb.glowIntensity * pulse;

                ctx.save();
                ctx.globalCompositeOperation = 'lighter';

                const layers = [
                    { scale: 2.4, alpha: 0.12 * glow },
                    { scale: 1.6, alpha: 0.18 * glow },
                    { scale: 1.0, alpha: 0.32 * glow }
                ];

                layers.forEach(layer => {
                    ctx.beginPath();
                    ctx.fillStyle = `rgba(170, 136, 255, ${layer.alpha})`;
                    ctx.arc(screenX, screenY, baseSize * layer.scale, 0, Math.PI * 2);
                    ctx.fill();
                });

                ctx.beginPath();
                ctx.fillStyle = `rgba(170, 136, 255, ${0.45 * glow})`;
                ctx.arc(screenX, screenY, baseSize * 0.6, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            });
        }

        function drawEternityRings(time) {

                ctx.save();
                ctx.translate(screenX, screenY);

                ctx.shadowBlur = 24;

        function drawBalanceScales(time) {

            balanceScales.forEach(scale => {

                ctx.strokeStyle = '#88ccaa';
                ctx.lineWidth = 2 * camera.zoom;
                ctx.shadowBlur = 16;
                ctx.shadowColor = 'rgba(136, 204, 170, 0.6)';
                ctx.globalAlpha = glow;

                ctx.beginPath();
                ctx.moveTo(anchorX, anchorY);
                ctx.lineTo(bobX, bobY);
                ctx.stroke();

                ctx.beginPath();
                ctx.fillStyle = '#88ccaa';
                ctx.shadowBlur = 20;
                ctx.arc(bobX, bobY, (scale.weight + Math.sin(scale.phase) * 0.8) * camera.zoom, 0, Math.PI * 2);

        function drawLightRays(time) {
            const dist = Math.hypot(camera.x - LIGHT_ZONE_CENTER.x, camera.y - LIGHT_ZONE_CENTER.y);
            if (dist > 1400) return;

            const centerX = (LIGHT_ZONE_CENTER.x - camera.x) * camera.zoom + canvas.width / 2;
            const centerY = (LIGHT_ZONE_CENTER.y - camera.y) * camera.zoom + canvas.height / 2;

            lightRays.forEach(ray => {
                const intensity = Math.max(0, Math.min(1, ray.brightness));
                const rayLength = ray.length * camera.zoom;
                const endX = centerX + Math.cos(ray.angle) * rayLength;
                const endY = centerY + Math.sin(ray.angle) * rayLength;
                const gradient = ctx.createLinearGradient(centerX, centerY, endX, endY);
                gradient.addColorStop(0, `rgba(255, 255, 170, ${0.45 * intensity})`);
                gradient.addColorStop(0.4, `rgba(255, 255, 170, ${0.25 * intensity})`);
                gradient.addColorStop(1, 'rgba(255, 255, 170, 0)');

                ctx.save();
                ctx.globalCompositeOperation = 'screen';
                ctx.lineWidth = ray.width * camera.zoom;
                ctx.strokeStyle = gradient;
                ctx.shadowBlur = 18 * intensity;
                ctx.shadowColor = 'rgba(255, 255, 170, 0.5)';

                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.lineTo(endX, endY);
                ctx.stroke();

                ctx.restore();
            });
        }

        function drawGraceParticles(time) {
            const dist = Math.hypot(camera.x - GRACE_ZONE_CENTER.x, camera.y - GRACE_ZONE_CENTER.y);
            if (dist > 1400) return;

            graceParticles.forEach(p => {
                const screenX = (p.x - camera.x) * camera.zoom + canvas.width / 2;
                const screenY = (p.y - camera.y) * camera.zoom + canvas.height / 2;
                if (screenX < -50 || screenX > canvas.width + 50 || screenY < -50 || screenY > canvas.height + 50) return;

                ctx.save();
                ctx.globalCompositeOperation = 'screen';

                // Draw trail
                for (let i = 0; i < p.trail.length; i++) {
                    const t = p.trail[i];
                    const tx = (t.x - camera.x) * camera.zoom + canvas.width / 2;
                    const ty = (t.y - camera.y) * camera.zoom + canvas.height / 2;
                    const trailAlpha = p.alpha * (1 - i / p.trail.length) * 0.5;
                    const trailSize = p.size * (1 - i / p.trail.length * 0.5) * camera.zoom;
                    ctx.beginPath();
                    ctx.arc(tx, ty, trailSize, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 187, 221, ${trailAlpha})`;
                    ctx.fill();
                }

                // Draw main particle with glow
                const size = p.size * camera.zoom;
                ctx.shadowBlur = 15;
                ctx.shadowColor = 'rgba(255, 187, 221, 0.6)';
                ctx.beginPath();
                ctx.arc(screenX, screenY, size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 220, 238, ${p.alpha})`;
                ctx.fill();

                ctx.restore();
            });
        }

        function drawDepthParticles(time) {
            const dist = Math.hypot(camera.x - DEPTH_ZONE_CENTER.x, camera.y - DEPTH_ZONE_CENTER.y);
            if (dist > 1400) return;

            depthParticles.forEach(p => {
                const screenX = (p.x - camera.x) * camera.zoom + canvas.width / 2;

                if (screenX < -50 || screenX > canvas.width + 50 || screenY < -50 || screenY > canvas.height + 50) return;

                ctx.save();
                const size = p.size * camera.zoom;
                
                // Deep blue gradient
                const gradient = ctx.createRadialGradient(screenX, screenY, 0, screenX, screenY, size * 2);
                gradient.addColorStop(0, `rgba(51, 102, 136, ${p.alpha})`);
                gradient.addColorStop(0.5, `rgba(30, 70, 100, ${p.alpha * 0.6})`);
                gradient.addColorStop(1, 'rgba(20, 50, 80, 0)');

                ctx.beginPath();
                ctx.arc(screenX, screenY, size * 2, 0, Math.PI * 2);

                ctx.fill();

                // Inner bright core
                ctx.beginPath();
                ctx.arc(screenX, screenY, size * 0.5, 0, Math.PI * 2);

                ctx.restore();
            });
        }
  function drawGuideSpirits(time) {
    guideSpirits.forEach(spirit => {
      const dx = spirit.x - camera.x;
      const dy = spirit.y - camera.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      // Pulsing glow effect
      const pulse = 0.6 + 0.4 * Math.sin(time * 0.002 + spirit.x * 0.01);
      const size = 18 + 6 * pulse;

      // Outer glow
      ctx.shadowBlur = 30;
      ctx.shadowColor = spirit.color;
      ctx.globalAlpha = 0.3 * pulse;
      ctx.fillStyle = spirit.color;
      ctx.beginPath();
      ctx.arc(spirit.x, spirit.y, size * 1.5, 0, Math.PI * 2);
      ctx.fill();

      // Inner core
      ctx.globalAlpha = 0.7 + 0.3 * pulse;
      ctx.beginPath();
      ctx.arc(spirit.x, spirit.y, size, 0, Math.PI * 2);
      ctx.fill();

      // Center bright spot
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(spirit.x, spirit.y, size * 0.3, 0, Math.PI * 2);
      ctx.fill();

      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;

      // Show name when close
      if (dist < 200) {
        ctx.font = '14px Georgia, serif';
        ctx.fillStyle = spirit.color;
        ctx.textAlign = 'center';
        ctx.fillText(spirit.name, spirit.x, spirit.y - size - 15);
      }
    });
  }

  function drawSpirits(time) {
    if (!spiritCompanions.length) return;
    setWorldTransform();
    const prevComposite = ctx.globalCompositeOperation;
    ctx.globalCompositeOperation = 'screen';
    spiritCompanions.forEach((spirit, idx) => {
      const opacity = clamp(spirit.opacity, 0, 1);
      if (opacity <= 0) return;
      const bob = Math.sin((time + idx * 90) * 0.003 + spirit.wobblePhase) * 6;
      const x = spirit.x;
      const y = spirit.y + bob;

      if (spirit.trail.length > 1) {
        for (let i = 0; i < spirit.trail.length; i++) {
          const p = spirit.trail[i];
          const t = spirit.trail.length > 1 ? i / (spirit.trail.length - 1) : 0;
          const alpha = opacity * t * 0.18;
          const radius = spirit.size * (0.35 + t * 0.5);
          ctx.fillStyle = colorWithAlpha(spirit.color, alpha);
          ctx.beginPath();
          ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      const glowRadius = spirit.size * 3.2;
      const grad = ctx.createRadialGradient(x, y, 0, x, y, glowRadius);
      grad.addColorStop(0, colorWithAlpha(spirit.color, 0.6 * opacity));
      grad.addColorStop(0.55, colorWithAlpha(spirit.color, 0.35 * opacity));
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.shadowBlur = 26;
      ctx.shadowColor = colorWithAlpha(spirit.color, 0.7 * opacity);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(x, y, glowRadius, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      ctx.fillStyle = colorWithAlpha('#ffffff', 0.8 * opacity);
      ctx.beginPath();
      ctx.arc(x, y, spirit.size * 0.7, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalCompositeOperation = prevComposite;
  }

  function drawCreatures() {
    const viewW = width / camera.zoom;
    const viewH = height / camera.zoom;
    const halfW = viewW / 2;
    const halfH = viewH / 2;
    creatures.forEach(creature => {
      const radius = creature.size * 3;
      if (
        creature.x < camera.x - halfW - radius ||
        creature.x > camera.x + halfW + radius ||
        creature.y < camera.y - halfH - radius ||
        creature.y > camera.y + halfH + radius
      ) {
        return;
      }
      const baseBrightness = (Math.sin(creature.phase) + 1) * 0.5;
      const fleeBoost = creature.fleeing ? 0.5 : 0;
      const brightness = Math.min(1.2, baseBrightness + fleeBoost);

      const glow = ctx.createRadialGradient(creature.x, creature.y, 0, creature.x, creature.y, radius);
      glow.addColorStop(0, colorWithAlpha(creature.color, 0.5 * brightness));
      glow.addColorStop(1, colorWithAlpha(creature.color, 0));
      ctx.fillStyle = glow;
      ctx.shadowBlur = 18 * brightness;
      ctx.shadowColor = colorWithAlpha(creature.color, 0.6 * brightness);
      ctx.beginPath();
      ctx.arc(creature.x, creature.y, radius, 0, Math.PI * 2);
      ctx.fill();

      ctx.shadowBlur = 0;
      const coreAlpha = Math.min(1, 0.5 + brightness * 0.5 + (creature.fleeTimer > 0 ? 0.2 : 0));
      ctx.fillStyle = colorWithAlpha(creature.color, coreAlpha);
      ctx.beginPath();
      ctx.arc(creature.x, creature.y, creature.size, 0, Math.PI * 2);
      ctx.fill();

    });
  }
  function drawFireflySwarms(time) {
    const viewW = width / camera.zoom;
    const viewH = height / camera.zoom;
    const halfW = viewW / 2;
    const halfH = viewH / 2;
    
    fireflySwarms.forEach(swarm => {
      // Check if swarm is in view
      if (
        swarm.x < camera.x - halfW - 100 ||
        swarm.x > camera.x + halfW + 100 ||
        swarm.y < camera.y - halfH - 100 ||
        swarm.y > camera.y + halfH + 100
      ) {
        return;
      }
      
      // Synchronized pulse for the whole swarm
      const pulse = (Math.sin(swarm.pulsePhase) + 1) * 0.5;
      const brightness = 0.3 + pulse * 0.7;
      
      swarm.fireflies.forEach(f => {
        // Calculate firefly position with orbit
        const orbitX = Math.cos(f.orbitPhase) * f.orbitRadius;
        const orbitY = Math.sin(f.orbitPhase) * f.orbitRadius;
        const fx = swarm.x + f.offsetX + orbitX;
        const fy = swarm.y + f.offsetY + orbitY;

        // Draw trail
        if (f.trail.length > 1) {
          ctx.beginPath();
          ctx.moveTo(f.trail[0].x, f.trail[0].y);
          for (let t = 1; t < f.trail.length; t++) {
            ctx.lineTo(f.trail[t].x, f.trail[t].y);
          }
          ctx.strokeStyle = colorWithAlpha(swarm.color, 0.15 * brightness);
          ctx.lineWidth = f.size * 0.8;
          ctx.lineCap = 'round';
          ctx.stroke();
        }
        
        // Draw glow
        const glowRadius = f.size * 4;
        const glow = ctx.createRadialGradient(fx, fy, 0, fx, fy, glowRadius);
        glow.addColorStop(0, colorWithAlpha(swarm.color, 0.6 * brightness));
        glow.addColorStop(0.5, colorWithAlpha(swarm.color, 0.2 * brightness));
        glow.addColorStop(1, 'rgba(0,0,0,0)');
        
        ctx.fillStyle = glow;
        ctx.shadowBlur = 12 * brightness;
        ctx.shadowColor = colorWithAlpha(swarm.color, 0.5 * brightness);
        ctx.beginPath();
        ctx.arc(fx, fy, glowRadius, 0, Math.PI * 2);
        ctx.fill();
        
        // Draw core
        ctx.shadowBlur = 0;
        ctx.fillStyle = colorWithAlpha(swarm.color, 0.8 * brightness);
        ctx.beginPath();
        ctx.arc(fx, fy, f.size, 0, Math.PI * 2);
        ctx.fill();
      });
    });
    ctx.shadowBlur = 0;
  }




  function drawCrystalFormations(time) {
    const viewW = width / camera.zoom;
    const viewH = height / camera.zoom;
    const halfW = viewW / 2;
    const halfH = viewH / 2;
    
    crystalFormations.forEach(formation => {

      if (
        formation.x < camera.x - halfW - 100 ||
        formation.x > camera.x + halfW + 100 ||
        formation.y < camera.y - halfH - 100 ||
        formation.y > camera.y + halfH + 100
      ) {
        return;
      }
      
      // Update glow phase
      formation.glowPhase += 0.008;
      if (formation.glowPhase > Math.PI * 2) formation.glowPhase -= Math.PI * 2;
      const formationGlow = 0.5 + Math.sin(formation.glowPhase) * 0.3;
      
      // Draw base glow
      const baseGlowSize = 60;
      const baseGlow = ctx.createRadialGradient(
        formation.x, formation.y, 0,
        formation.x, formation.y, baseGlowSize
      );
      baseGlow.addColorStop(0, colorWithAlpha(formation.baseColor, 0.3 * formationGlow));
      baseGlow.addColorStop(0.5, colorWithAlpha(formation.baseColor, 0.1 * formationGlow));
      baseGlow.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = baseGlow;
      ctx.beginPath();
      ctx.arc(formation.x, formation.y, baseGlowSize, 0, Math.PI * 2);
      ctx.fill();
      
      // Draw individual crystals
      formation.individualCrystals.forEach(crystal => {
        crystal.pulsePhase += crystal.pulseSpeed;
        if (crystal.pulsePhase > Math.PI * 2) crystal.pulsePhase -= Math.PI * 2;
        const pulse = 0.6 + Math.sin(crystal.pulsePhase) * 0.4;
        
        const cx = formation.x + crystal.offsetX;
        const cy = formation.y + crystal.offsetY;
        
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(crystal.rotation);
        
        // Crystal body (elongated hexagon)
        const hw = crystal.width / 2;
        const hh = crystal.height / 2;
        
        // Main crystal gradient
        const crystalGrad = ctx.createLinearGradient(0, hh, 0, -hh);
        crystalGrad.addColorStop(0, colorWithAlpha(formation.baseColor, 0.3 * pulse));
        crystalGrad.addColorStop(0.3, colorWithAlpha(formation.baseColor, 0.6 * pulse));
        crystalGrad.addColorStop(0.7, colorWithAlpha(formation.baseColor, 0.8 * pulse));
        crystalGrad.addColorStop(1, colorWithAlpha('#ffffff', 0.9 * pulse));
        
        ctx.fillStyle = crystalGrad;
        ctx.beginPath();
        ctx.moveTo(0, -hh);  // Top point
        ctx.lineTo(hw * 0.6, -hh * 0.7);
        ctx.lineTo(hw, 0);
        ctx.lineTo(hw * 0.6, hh * 0.8);
        ctx.lineTo(0, hh);  // Bottom
        ctx.lineTo(-hw * 0.6, hh * 0.8);
        ctx.lineTo(-hw, 0);
        ctx.lineTo(-hw * 0.6, -hh * 0.7);
        ctx.closePath();
        ctx.fill();
        
        // Crystal edge highlight
        ctx.strokeStyle = colorWithAlpha('#ffffff', 0.5 * pulse);
        ctx.lineWidth = 1;
        ctx.stroke();
        
        // Inner light line
        ctx.strokeStyle = colorWithAlpha('#ffffff', 0.7 * pulse);
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, -hh * 0.8);
        ctx.lineTo(0, hh * 0.5);
        ctx.stroke();
        
        ctx.restore();
      });
      
      // Draw formation name when close

      ctx.arc(0, 0, glowSize, 0, Math.PI * 2);

  function drawWaterReflections(time) {

    waterReflections.forEach(ref => {
      const stream = streams[ref.streamIdx];
      if (!stream || !stream.pathPoints) return;
      const pos = getStreamPosition(stream, ref.distance, ref.lateralOffset);
      if (!pos) return;
      const twinkle = Math.sin(now * ref.twinkleSpeed + ref.twinklePhase);
      const alpha = ref.brightness * (0.3 + twinkle * 0.4 + 0.3);
      if (alpha < 0.1) return;
      const size = ref.size * (0.7 + twinkle * 0.3);
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, size, 0, Math.PI * 2);
      ctx.fillStyle = colorWithAlpha(ref.color, alpha);
      ctx.shadowBlur = size * 2;
      ctx.shadowColor = colorWithAlpha(ref.color, alpha * 0.6);
      ctx.fill();
      ctx.shadowBlur = 0;

  function drawDewDrops(time) {
    setWorldTransform();
    const now = time || 0;
    const isMorning = timeOfDay === 'morning';
    const baseAlpha = isMorning ? 0.9 : 0.4;
    dewDrops.forEach(drop => {
      const mushroom = glowingMushrooms[drop.mushroomIdx];
      if (!mushroom) return;
      const x = mushroom.x + drop.offsetX;
      const y = mushroom.y + drop.offsetY;
      const shimmer = Math.sin(now * drop.shimmerSpeed + drop.shimmerPhase);
      const alpha = baseAlpha * (0.6 + shimmer * 0.4);
      const size = drop.size * (drop.dripping ? (1 - drop.dripProgress * 0.5) : 1);
      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI * 2);
      const grad = ctx.createRadialGradient(x - size * 0.3, y - size * 0.3, 0, x, y, size);
      grad.addColorStop(0, colorWithAlpha('#ffffff', alpha));
      grad.addColorStop(0.5, colorWithAlpha('#aaddff', alpha * 0.7));
      grad.addColorStop(1, colorWithAlpha('#88ccff', alpha * 0.3));
      ctx.fillStyle = grad;
      ctx.fill();
      if (drop.dripping && drop.dripProgress < 1) {
        const dripY = y + drop.dripProgress * 25;
        const dripAlpha = alpha * (1 - drop.dripProgress);
        const dripSize = size * 0.6 * (1 - drop.dripProgress * 0.7);
        ctx.beginPath();
        ctx.arc(x, dripY, dripSize, 0, Math.PI * 2);
        ctx.fillStyle = colorWithAlpha('#aaddff', dripAlpha);
        ctx.fill();
      }
    });
  }

      ctx.lineWidth = 1.5;
      ctx.stroke();
    });
  }

      const coreAlpha = star.discovered ? 0.95 : 0.7;
      const glowAlpha = star.discovered ? 0.25 : 0.16;

      const grad = renderCtx.createRadialGradient(star.x, star.y, 0, star.x, star.y, glowRadius);
      grad.addColorStop(0, colorWithAlpha('#ffffaa', glowAlpha));
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      renderCtx.fillStyle = grad;
      renderCtx.beginPath();
      renderCtx.arc(star.x, star.y, glowRadius, 0, Math.PI * 2);
      renderCtx.fill();

      renderCtx.shadowBlur = star.discovered ? 14 : 9;
      renderCtx.shadowColor = colorWithAlpha('#ffffaa', coreAlpha * 0.9);
      renderCtx.fillStyle = colorWithAlpha('#ffffaa', coreAlpha);
      renderCtx.beginPath();
      renderCtx.arc(star.x, star.y, coreRadius, 0, Math.PI * 2);
      renderCtx.fill();
      renderCtx.shadowBlur = 0;

      if (dist <= 100) {
        const alpha = Math.max(0, 1 - dist / 110);
        const floatOffset = Math.sin(now * 0.003 + idx) * 4;
        renderCtx.fillStyle = `rgba(255, 255, 210, ${0.8 * alpha})`;
        renderCtx.font = '12px "Space Grotesk", sans-serif';
        renderCtx.textAlign = 'center';
        renderCtx.fillText(star.name, star.x, star.y + baseRadius + 16 + floatOffset);
      }
    });
  }

  function drawMemoryStars(time) {
    const pulse = Math.sin(time * 0.004) * 0.15 + 0.55;
    memoryStars.forEach(star => {
      const glowAlpha = star.discovered ? 0.22 : 0.55;
      const outer = star.radius * (3.2 + pulse * (star.discovered ? 0.4 : 0.8));
      const grad = ctx.createRadialGradient(star.x, star.y, 0, star.x, star.y, outer);
      grad.addColorStop(0, colorWithAlpha('#ffcc44', 0.2 * glowAlpha));
      grad.addColorStop(0.55, colorWithAlpha('#ffcc44', 0.14 * glowAlpha));
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(star.x, star.y, outer, 0, Math.PI * 2);
      ctx.fill();

      ctx.shadowBlur = star.discovered ? 8 : 14;
      ctx.shadowColor = colorWithAlpha('#ffcc44', 0.8 * glowAlpha);
      ctx.fillStyle = colorWithAlpha('#ffcc44', star.discovered ? 0.6 : 0.95);
      ctx.beginPath();
      ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    });
  }

  function drawRipples(time) {
    ripples.forEach(r => {
      const progress = clamp((time - r.birth) / r.duration, 0, 1);
      const radius = 5 + (80 - 5) * progress;
      const alpha = (1 - progress) * 0.5;
      const lineWidth = 2 + (1 - progress) * 1.5;
      ctx.strokeStyle = colorWithAlpha(r.color, alpha);
      ctx.lineWidth = lineWidth;
      ctx.beginPath();
      ctx.arc(r.x, r.y, radius, 0, Math.PI * 2);
      ctx.stroke();
    });
    ctx.lineWidth = 1;
  }

  function setWorldTransform() {
    ctx.setTransform(
      camera.zoom * dpr, 0, 0, camera.zoom * dpr,
      (width / 2 - camera.x * camera.zoom) * dpr,
      (height / 2 - camera.y * camera.zoom) * dpr
    );
  }

  function drawZones(time) {
    const zoneRenderList = [];
    let nearest = null;
    zones.forEach((z, idx) => {
      if (!isZoneVisible(z)) return;
      const dist = Math.hypot(camera.x - z.x, camera.y - z.y);
      if (!meditationMode) {
        zoneRenderList.push({ zone: z, idx, dist });
      } else if (!nearest || dist < nearest.dist) {
        nearest = { zone: z, idx, dist };
      }
    });
    if (meditationMode && nearest) {
      zoneRenderList.length = 0;
      zoneRenderList.push(nearest);
    }
    zoneRenderList.forEach(({ zone: z, idx }) => {
      const r = getZoneRadius(z);
      const dx = camera.x - z.x;
      const dy = camera.y - z.y;
      const dist = Math.hypot(dx, dy);
      const withinHint = dist < r + 250;
      const withinDetail = dist < r + 50;
      const stayingHere = lastZoneInside && lastZoneInside.name === z.name;
      const stayProgress = stayingHere ? Math.min(1, zoneStayTime / 900) : 0;
      const glowBoost = withinHint ? 1.5 : 1;
      const pulseSpeed = withinDetail ? 0.0035 : 0.002;
      const pulse = Math.sin(time * pulseSpeed + idx) * 10 + 14;
      const gradient = ctx.createRadialGradient(z.x, z.y, 10, z.x, z.y, r + 80 + pulse);
      const c = z.color;
      gradient.addColorStop(0, colorWithAlpha(c, 0.2 * glowBoost));
      gradient.addColorStop(0.5, colorWithAlpha(c, 0.13 * glowBoost));
      gradient.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(z.x, z.y, r + 90 + pulse, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.shadowBlur = 25;
      ctx.shadowColor = c;
      ctx.strokeStyle = colorWithAlpha(c, Math.min(1, 0.9 * glowBoost));
      ctx.lineWidth = 2;
      ctx.arc(z.x, z.y, r + pulse * 0.4, 0, Math.PI * 2);
      ctx.stroke();

      if (isHiddenZone(z)) {
        const hiddenPulse = (Math.sin(time * 0.0045 + idx) + 1) * 0.5;
        const outerGlow = r + 140 + pulse * 0.6;
        const goldGradient = ctx.createRadialGradient(z.x, z.y, r * 0.4, z.x, z.y, outerGlow);
        goldGradient.addColorStop(0, 'rgba(255, 215, 0, 0.28)');
        goldGradient.addColorStop(0.7, 'rgba(255, 215, 0, 0.16)');
        goldGradient.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = goldGradient;
        ctx.beginPath();
        ctx.arc(z.x, z.y, outerGlow, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.shadowBlur = 36;
        ctx.shadowColor = 'rgba(255, 215, 0, 0.75)';
        ctx.strokeStyle = colorWithAlpha('#ffd700', 0.6 + hiddenPulse * 0.25);
        ctx.lineWidth = 3 + hiddenPulse * 1.5;
        ctx.arc(z.x, z.y, r + pulse * 0.6, 0, Math.PI * 2);
        ctx.stroke();
        ctx.shadowBlur = 0;
      }

      if (stayingHere) {
        const prevComposite = ctx.globalCompositeOperation;
        const stayRadius = r + 140 + pulse * 0.5 + stayProgress * 30;
        const stayGlow = ctx.createRadialGradient(z.x, z.y, r * 0.35, z.x, z.y, stayRadius);
        stayGlow.addColorStop(0, colorWithAlpha(c, 0.12 + stayProgress * 0.25));
        stayGlow.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = stayGlow;
        ctx.beginPath();
        ctx.arc(z.x, z.y, stayRadius, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalCompositeOperation = prevComposite;
      }

      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ffffff';
      ctx.font = '16px "Space Grotesk", sans-serif';
      ctx.textAlign = 'center';
      const labelY = z.y - r - 18;
      ctx.fillText(getZoneLabel(z), z.x, labelY);

      let descLines = [];
      if (withinDetail) {
        descLines = wrapText(z.desc, 40);
        ctx.fillStyle = 'rgba(230, 235, 255, 0.8)';
        ctx.font = '12px "Space Grotesk", sans-serif';
        descLines.forEach((line, i) => {
          ctx.fillText(line, z.x, labelY + 16 + i * 14);
        });
      } else if (withinHint) {
        ctx.fillStyle = 'rgba(230, 235, 255, 0.65)';
        ctx.font = '12px "Space Grotesk", sans-serif';
        const hint = z.desc.slice(0, 30);
        ctx.fillText(hint, z.x, labelY + 16);
      }

      if (stayingHere && zoneStayTime > 600 && z.deeperText) {
        const baseY = labelY + 16 + (Math.max(descLines.length - 1, 0) * 14) + 40;
        const deeperLines = wrapText(z.deeperText, 44);
        ctx.fillStyle = 'rgba(230, 235, 255, 0.7)';
        ctx.font = 'italic 14px "Space Grotesk", sans-serif';
        deeperLines.forEach((line, i) => {
          ctx.fillText(line, z.x, baseY + i * 16);
        });
      }
    });
  }

  function drawMemoryWell(time) {
    const { x, y, radius } = memoryWell;
    const pulse = Math.sin(time * 0.003) * 6 + 10;
    const softPulse = memoryWell.discovered ? (Math.sin(time * 0.0025 + 1) + 1) * 12 + 18 : 0;
    const glowRadius = radius + 26 + pulse * 0.6;

    ctx.save();
    ctx.shadowBlur = 38;
    ctx.shadowColor = colorWithAlpha('#4444aa', 0.45);
    const darkGrad = ctx.createRadialGradient(x, y, radius * 0.3, x, y, radius + 30);
    darkGrad.addColorStop(0, 'rgba(6, 6, 12, 0.96)');
    darkGrad.addColorStop(1, 'rgba(10, 10, 16, 0.55)');
    ctx.fillStyle = darkGrad;
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fill();

    const glowGrad = ctx.createRadialGradient(x, y, radius * 0.6, x, y, glowRadius + softPulse);
    glowGrad.addColorStop(0, colorWithAlpha('#4444aa', 0.18));
    glowGrad.addColorStop(0.7, colorWithAlpha('#4444aa', 0.08));
    glowGrad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glowGrad;
    ctx.beginPath();
    ctx.arc(x, y, glowRadius + softPulse, 0, Math.PI * 2);
    ctx.fill();

    if (memoryWell.discovered) {
      ctx.globalCompositeOperation = 'screen';
      ctx.fillStyle = colorWithAlpha('#5a5af0', 0.09);
      ctx.beginPath();
      ctx.arc(x, y, glowRadius + 26 + softPulse * 0.6, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    }

    const spiralRadii = [30, 50, 70];
    const spiralColors = ['rgba(140, 150, 255, 0.7)', 'rgba(110, 120, 230, 0.6)', 'rgba(90, 100, 200, 0.55)'];
    spiralRadii.forEach((baseRadius, idx) => {
      const inwardDrift = Math.sin(time * 0.0018 + idx * 0.8) * 2.5;
      const r = baseRadius - inwardDrift;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(memoryWell.spiralAngles[idx]);
      ctx.lineWidth = 2;
      ctx.strokeStyle = spiralColors[idx];
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 1.5);
      ctx.stroke();
      ctx.restore();
    });

    ctx.fillStyle = 'rgba(190, 200, 255, 0.7)';
    memoryWell.particles.forEach(p => {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.shadowBlur = 0;
    ctx.restore();
  }

  function drawPortals(time) {
    const size = 30;
    worldPortals.forEach((portal, idx) => {
      const pulse = (Math.sin(time * 0.004 + idx) + 1) * 0.2 + 0.5; // 0.5 - 0.9
      const dist = Math.hypot(camera.x - portal.x, camera.y - portal.y);
      const glowRadius = size * 2.2;
      const grad = ctx.createRadialGradient(portal.x, portal.y, 0, portal.x, portal.y, glowRadius * 1.6);
      grad.addColorStop(0, colorWithAlpha(portal.color, pulse * 0.4));
      grad.addColorStop(0.75, colorWithAlpha(portal.color, pulse * 0.16));
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(portal.x, portal.y, glowRadius * 1.6, 0, Math.PI * 2);
      ctx.fill();

      ctx.save();
      ctx.translate(portal.x, portal.y);
      ctx.rotate(Math.PI / 4);
      ctx.shadowBlur = 22;
      ctx.shadowColor = colorWithAlpha(portal.color, pulse * 0.9);
      ctx.fillStyle = colorWithAlpha(portal.color, pulse);
      ctx.fillRect(-size / 2, -size / 2, size, size);
      ctx.strokeStyle = colorWithAlpha(portal.color, 0.95);
      ctx.lineWidth = 1.4;
      ctx.strokeRect(-size / 2, -size / 2, size, size);
      ctx.restore();
      ctx.shadowBlur = 0;

      if (dist <= 200) {
        ctx.fillStyle = colorWithAlpha(portal.color, 0.9);
        ctx.font = '12px "Space Grotesk", sans-serif';
        ctx.textAlign = 'center';
        ctx.shadowBlur = 10;
        ctx.shadowColor = colorWithAlpha(portal.color, 0.65);
        ctx.fillText(portal.name, portal.x, portal.y - size * 0.9);
        ctx.shadowBlur = 0;
      }
    });
  }

  function drawFloatingIslands(time) {
    const bobTime = time || performance.now();
    floatingIslands.forEach((island, idx) => {
      const phase = typeof island.float === 'number' ? island.float : Math.sin(bobTime / 2000 + idx);
      const bob = phase * 6;
      const baseX = island.x;
      const baseY = island.y + bob;
      const width = island.size * 1.7;
      const height = island.size * 0.6;
      const proximity = island.proximity || 0;
      const glow = (island.discovered ? 0.3 : 0.16) + proximity * 0.35;

      if (glow > 0.05) {
        const auraRadius = width * 0.8;
        const aura = ctx.createRadialGradient(baseX, baseY, 0, baseX, baseY, auraRadius);
        aura.addColorStop(0, colorWithAlpha(island.color, glow));
        aura.addColorStop(0.6, colorWithAlpha(island.color, glow * 0.5));
        aura.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = aura;
        ctx.beginPath();
        ctx.arc(baseX, baseY, auraRadius, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = colorWithAlpha('#000000', 0.18 + proximity * 0.2);
      ctx.beginPath();
      ctx.ellipse(baseX, island.y + 18, width * 0.45, height * 0.45, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = colorWithAlpha('#1a2430', 0.35);
      ctx.beginPath();
      ctx.ellipse(baseX, baseY + height * 0.15, width * 0.46, height * 0.36, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.save();
      ctx.translate(baseX, baseY);
      ctx.shadowBlur = 12 + proximity * 12 + (island.discovered ? 8 : 0);
      ctx.shadowColor = colorWithAlpha(island.color, glow * 1.4);
      const grad = ctx.createLinearGradient(0, -height / 2, 0, height / 2);
      grad.addColorStop(0, colorWithAlpha(island.color, 0.95));
      grad.addColorStop(1, colorWithAlpha('#1c2732', 0.95));
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.ellipse(0, 0, width / 2, height / 2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = colorWithAlpha('#e8f0ff', 0.15 + proximity * 0.4);
      ctx.lineWidth = 1.1;
      ctx.beginPath();
      ctx.ellipse(0, -height * 0.08, width * 0.46, height * 0.32, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      if (island.inRange) {
        ctx.fillStyle = '#e6f3ff';
        ctx.font = '12px "Space Grotesk", sans-serif';
        ctx.textAlign = 'center';
        const labelOffset = Math.sin(bobTime * 0.003 + idx) * 3;
        ctx.shadowBlur = 10;
        ctx.shadowColor = colorWithAlpha(island.color, 0.6);
        ctx.fillText(island.name, baseX, baseY - height - 8 + labelOffset);
        ctx.shadowBlur = 0;
      }
    });
  }

  function drawRuins(time) {
    const t = time || 0;
    ancientRuins.forEach((ruin, idx) => {
      const wobble = typeof ruin.wobble === 'number' ? ruin.wobble : Math.sin(t * 0.002 + idx) * 2;
      const x = ruin.x;
      const y = ruin.y + wobble;
      const width = 26;
      const height = 62;
      const proximity = ruin.proximity || 0;
      ctx.save();
      ctx.shadowBlur = 12 + proximity * 18 + (ruin.discovered ? 6 : 0);
      ctx.shadowColor = colorWithAlpha('#665544', 0.35 + proximity * 0.3);
      const grad = ctx.createLinearGradient(x, y - height, x, y);
      grad.addColorStop(0, colorWithAlpha('#7a6752', 0.78));
      grad.addColorStop(1, colorWithAlpha('#4f3f33', 0.78));
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(x - width * 0.55, y);
      ctx.lineTo(x + width * 0.55, y);
      ctx.lineTo(x + width * 0.46, y - height * 0.4);
      ctx.lineTo(x + width * 0.3, y - height * 0.76);
      ctx.lineTo(x + width * 0.04, y - height);
      ctx.lineTo(x - width * 0.18, y - height * 0.82);
      ctx.lineTo(x - width * 0.4, y - height * 0.55);
      ctx.lineTo(x - width * 0.52, y - height * 0.26);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = colorWithAlpha('#2f2620', 0.4 + proximity * 0.3);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x - width * 0.32, y - height * 0.2);
      ctx.lineTo(x - width * 0.12, y - height * 0.52);
      ctx.moveTo(x + width * 0.1, y - height * 0.28);
      ctx.lineTo(x + width * 0.24, y - height * 0.65);
      ctx.stroke();

      ctx.globalAlpha = 0.22 + proximity * 0.25;
      ctx.strokeStyle = '#9a8b7a';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(x - width * 0.42, y - height * 0.38);
      ctx.lineTo(x - width * 0.1, y - height * 0.34);
      ctx.moveTo(x + width * 0.12, y - height * 0.56);
      ctx.lineTo(x + width * 0.38, y - height * 0.48);
      ctx.stroke();
      ctx.globalAlpha = 1;

      if (ruin.discovered) {
        const runeGlow = 0.5 + proximity * 0.6;
        ctx.shadowBlur = 14 + proximity * 10;
        ctx.shadowColor = colorWithAlpha('#cfe9ff', runeGlow * 0.5);
        ctx.strokeStyle = colorWithAlpha('#cfe9ff', runeGlow * 0.7);
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(x - width * 0.24, y - height * 0.26);
        ctx.lineTo(x - width * 0.05, y - height * 0.32);
        ctx.lineTo(x - width * 0.12, y - height * 0.46);
        ctx.moveTo(x + width * 0.06, y - height * 0.18);
        ctx.lineTo(x + width * 0.08, y - height * 0.42);
        ctx.moveTo(x + width * 0.18, y - height * 0.54);
        ctx.lineTo(x + width * 0.28, y - height * 0.62);
        ctx.stroke();
        ctx.shadowBlur = 0;
      }

      const dist = Math.hypot(camera.x - ruin.x, camera.y - ruin.y);
      if (dist <= 60) {
        const text = ruin.inscription;
        ctx.save();
        ctx.font = '14px "Space Grotesk", sans-serif';
        ctx.textAlign = 'center';
        const padding = 10;
        const metrics = ctx.measureText(text);
        const boxW = metrics.width + padding * 2;
        const boxH = 34;
        const bx = x - boxW / 2;
        const by = y - height - boxH - 10;
        ctx.fillStyle = 'rgba(18, 18, 24, 0.82)';
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        const r = 10;
        ctx.moveTo(bx + r, by);
        ctx.lineTo(bx + boxW - r, by);
        ctx.quadraticCurveTo(bx + boxW, by, bx + boxW, by + r);
        ctx.lineTo(bx + boxW, by + boxH - r);
        ctx.quadraticCurveTo(bx + boxW, by + boxH, bx + boxW - r, by + boxH);
        ctx.lineTo(bx + r, by + boxH);
        ctx.quadraticCurveTo(bx, by + boxH, bx, by + boxH - r);
        ctx.lineTo(bx, by + r);
        ctx.quadraticCurveTo(bx, by, bx + r, by);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x - 6, by + boxH);
        ctx.lineTo(x, by + boxH + 8);
        ctx.lineTo(x + 6, by + boxH);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#f1e7dc';
        ctx.fillText(text, x, by + boxH / 2 + 4);
        ctx.restore();
      }
      ctx.restore();
    });
  }

  function drawGlowingVines(time) {
    const t = time || 0;
    glowingVines.forEach(vine => {
      const segments = vine.segments;
      if (segments.length < 2) return;
      const glowIntensity = 0.4 + Math.sin(t * 0.003 + vine.glowPhase) * 0.3;
      const pulseWidth = 2 + Math.sin(t * 0.002 + vine.glowPhase) * 1;
      // Draw glow layer
      ctx.save();
      ctx.shadowBlur = 15 + glowIntensity * 10;
      ctx.shadowColor = vine.color;
      ctx.strokeStyle = vine.color;
      ctx.lineWidth = pulseWidth + 2;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.globalAlpha = glowIntensity * 0.5;
      ctx.beginPath();
      ctx.moveTo(segments[0].x, segments[0].y);
      for (let i = 1; i < segments.length; i++) {
        const prev = segments[i - 1];
        const curr = segments[i];
        const cpX = (prev.x + curr.x) / 2;
        const cpY = (prev.y + curr.y) / 2;
        ctx.quadraticCurveTo(prev.x, prev.y, cpX, cpY);
      }
      ctx.lineTo(segments[segments.length - 1].x, segments[segments.length - 1].y);
      ctx.stroke();
      // Draw core vine
      ctx.globalAlpha = 0.8;
      ctx.lineWidth = pulseWidth;
      ctx.shadowBlur = 8;
      ctx.stroke();
      // Draw leaf buds at segment points
      ctx.globalAlpha = glowIntensity * 0.7;
      segments.forEach((seg, i) => {
        if (i % 2 === 1) {
          const leafSize = 3 + Math.sin(t * 0.004 + i + vine.glowPhase) * 1;
          ctx.beginPath();
          ctx.arc(seg.x, seg.y, leafSize, 0, Math.PI * 2);
          ctx.fillStyle = vine.color;
          ctx.fill();
        }
      });
      ctx.restore();
    });
  }

  function drawMonuments(time) {
    const pulse = Math.sin(time * 0.004) * 0.08 + 0.22;
    monuments.forEach((mon, idx) => {
      const proximity = mon.proximity || 0;
      const h = 60;
      const w = 8;
      const auraY = mon.y - h * 0.6;
      const auraRadius = 70 + proximity * 40 + idx * 0.02;
      const glowStrength = 0.18 + pulse + proximity * 0.5;
      const grad = ctx.createRadialGradient(mon.x, auraY, 6, mon.x, auraY, auraRadius);
      grad.addColorStop(0, colorWithAlpha(monumentColor, glowStrength));
      grad.addColorStop(0.6, colorWithAlpha(monumentColor, glowStrength * 0.6));
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(mon.x, auraY, auraRadius, 0, Math.PI * 2);
      ctx.fill();

      ctx.save();
      ctx.shadowBlur = 12 + proximity * 18;
      ctx.shadowColor = colorWithAlpha(monumentColor, 0.85);
      ctx.fillStyle = colorWithAlpha('#aa9988', 0.82 + proximity * 0.15);
      ctx.fillRect(mon.x - w / 2, mon.y - h, w, h);
      ctx.restore();

      ctx.fillStyle = colorWithAlpha('#ddd2c4', 0.5 + proximity * 0.35);
      ctx.fillRect(mon.x - w / 2 + 1.1, mon.y - h + 4, w - 2.2, h - 8);

      if (proximity > 0.25) {
        const labelAlpha = Math.min(1, (proximity - 0.25) * 2.2);
        ctx.fillStyle = `rgba(241, 231, 220, ${labelAlpha})`;
        ctx.font = '12px "Space Grotesk", sans-serif';
        ctx.textAlign = 'center';
        const floatOffset = Math.sin(time * 0.003 + idx) * 4;
        ctx.fillText(mon.name, mon.x, mon.y - h - 10 + floatOffset);
      }
    });
  }

  function drawEchoes(time) {
    ctx.shadowBlur = 12;
    echoes.forEach((echo, idx) => {
      const pulse = 0.25 + 0.15 * Math.sin(time * 0.002 + echo.pulseOffset + idx * 0.3);
      const dx = camera.x - echo.x;
      const dy = camera.y - echo.y;
      const dist = Math.hypot(dx, dy);
      let alpha = clamp(pulse, 0.1, 0.4);
      if (dist < 200) {
        alpha = Math.min(0.75, alpha + (1 - dist / 200) * 0.35);
      }
      ctx.fillStyle = `rgba(230, 235, 245, ${alpha})`;
      ctx.shadowColor = `rgba(200, 210, 230, ${alpha * 0.9})`;
      ctx.font = `${echo.size}px "Space Grotesk", sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText(echo.text, echo.x, echo.y);
    });
    ctx.shadowBlur = 0;
  }

  function drawFragments() {
    ctx.shadowBlur = 18;
    fragments.forEach(f => {
      ctx.fillStyle = `hsla(${f.hue}, 70%, 72%, ${f.alpha})`;
      ctx.font = `${f.size}px "Space Grotesk", sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText(f.text, f.x, f.y);
    });
    ctx.shadowBlur = 0;
  }

  function drawWhispers(time) {

    const floatOffset = Math.sin(time * 0.004 + whisperTimer * 0.05) * 6;
    ctx.shadowBlur = 8;
    ctx.shadowColor = `rgba(170, 170, 170, ${whisperOpacity * 0.5})`;
    ctx.fillStyle = `rgba(170, 170, 170, ${whisperOpacity})`;
    ctx.font = 'italic 16px serif';
    ctx.textAlign = 'center';
    ctx.fillText(activeWhisper, whisperPosition.x, whisperPosition.y + floatOffset);
    ctx.shadowBlur = 0;
  }

  function formatTime(ms) {
    const totalSeconds = Math.max(0, Math.floor(ms / 1000));
    const minutes = Math.floor(totalSeconds / 60);
    const seconds = totalSeconds % 60;
    if (minutes >= 60) {
      const hours = Math.floor(minutes / 60);
      const remMinutes = minutes % 60;
      return `${hours}h ${remMinutes}m`;
    }
    if (minutes > 0) return `${minutes}m ${seconds}s`;
    return `${seconds}s`;
  }

  function updateCelebrationParticles(dt) {
    for (let i = celebrationParticles.length - 1; i >= 0; i--) {
      const p = celebrationParticles[i];
      p.age += dt;
      p.x += p.vx * dt / 1000;
      p.y += p.vy * dt / 1000;
      p.vy += 14 * dt / 1000;
      if (p.age > p.life) celebrationParticles.splice(i, 1);
    }
  }

  function drawCelebrationParticles() {
    if (!celebrationParticles.length) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalCompositeOperation = 'screen';
    celebrationParticles.forEach(p => {
      const alpha = Math.max(0, 1 - p.age / p.life);
      ctx.fillStyle = `rgba(255, 215, 130, ${alpha * 0.7})`;
      ctx.shadowBlur = 12;
      ctx.shadowColor = `rgba(255, 200, 150, ${alpha})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.shadowBlur = 0;
    ctx.globalCompositeOperation = 'source-over';
  }

  function triggerCelebration() {

    const cx = width / 2;
    const cy = height * 0.18;
    for (let i = 0; i < 44; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 90 + Math.random() * 130;
      celebrationParticles.push({
        x: cx,
        y: cy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed * 0.6,
        life: 1200 + Math.random() * 600,
        age: 0,
        size: 1.5 + Math.random() * 2.5
      });
    }
  }

  function drawMinimap() {
    const miniSize = mini.width;
    mctx.setTransform(1, 0, 0, 1, 0, 0);
    mctx.clearRect(0, 0, miniSize, miniSize);
    mctx.fillStyle = '#0b0b12';
    mctx.fillRect(0, 0, miniSize, miniSize);

    const scale = miniSize / worldSize;
    zones.forEach(z => {
      if (!isZoneVisible(z)) return;
      const r = (getZoneRadius(z) + 20) * scale;
      mctx.fillStyle = `${z.color}55`;
      mctx.beginPath();
      mctx.arc(z.x * scale, z.y * scale, r, 0, Math.PI * 2);
      mctx.fill();
    });

    if (explorationPath.length > 1) {
      const alphaStart = 0x20 / 255;
      const alphaEnd = 0x80 / 255;
      mctx.lineWidth = 1;
      mctx.lineCap = 'round';
      for (let i = 1; i < explorationPath.length; i++) {
        const prev = explorationPath[i - 1];
        const curr = explorationPath[i];
        const t = i / (explorationPath.length - 1);
        const alpha = alphaStart + (alphaEnd - alphaStart) * t;
        mctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
        mctx.beginPath();
        mctx.moveTo(prev.x * scale, prev.y * scale);
        mctx.lineTo(curr.x * scale, curr.y * scale);
        mctx.stroke();
      }
    }

    zones.forEach(z => {
      if (!isZoneVisible(z)) return;
      const cx = z.x * scale;
      const cy = z.y * scale;
      const dotRadius = 3;
      mctx.fillStyle = z.color;
      mctx.beginPath();
      mctx.arc(cx, cy, dotRadius, 0, Math.PI * 2);
      mctx.fill();
      if (discoveredZones.includes(z.name)) {
        mctx.strokeStyle = 'rgba(255, 255, 255, 0.75)';
        mctx.lineWidth = 1.5;
        mctx.beginPath();
        mctx.arc(cx, cy, dotRadius + 2, 0, Math.PI * 2);
        mctx.stroke();
      }
    });

    worldPortals.forEach(portal => {
      const px = portal.x * scale;
      const py = portal.y * scale;
      const ps = 8;
      mctx.save();
      mctx.translate(px, py);
      mctx.rotate(Math.PI / 4);
      mctx.shadowBlur = 6;
      mctx.shadowColor = colorWithAlpha(portal.color, 0.6);
      mctx.fillStyle = colorWithAlpha(portal.color, 0.9);
      mctx.fillRect(-ps / 2, -ps / 2, ps, ps);
      mctx.restore();
      mctx.shadowBlur = 0;
    });

    const mwx = memoryWell.x * scale;
    const mwy = memoryWell.y * scale;
    const mwRadius = memoryWell.radius * scale * 0.5;
    mctx.fillStyle = '#4444aa';
    mctx.beginPath();
    mctx.arc(mwx, mwy, mwRadius, 0, Math.PI * 2);
    mctx.fill();
    mctx.strokeStyle = 'rgba(68, 68, 170, 0.7)';
    mctx.lineWidth = 2;
    mctx.beginPath();
    mctx.arc(mwx, mwy, mwRadius + 3, 0, Math.PI * 2);
    mctx.stroke();

    const viewW = (width / camera.zoom) * scale;
    const viewH = (height / camera.zoom) * scale;
    const vx = (camera.x - width / (2 * camera.zoom)) * scale;
    const vy = (camera.y - height / (2 * camera.zoom)) * scale;
    mctx.strokeStyle = '#9ad1ff';
    mctx.lineWidth = 2;
    mctx.strokeRect(vx, vy, viewW, viewH);

    mctx.fillStyle = '#ffffff';
    mctx.beginPath();
    mctx.arc(camera.x * scale, camera.y * scale, 3.5, 0, Math.PI * 2);
    mctx.fill();
  }

  function getWindArrow(angle) {
    const arrows = ['→', '↗', '↑', '↖', '←', '↙', '↓', '↘'];
    const normalized = ((angle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
    const sector = Math.round(normalized / (Math.PI / 4)) % arrows.length;
    return arrows[sector];
  }

  function screenToWorld(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const x = (clientX - rect.left - width / 2) / camera.zoom + camera.x;
    const y = (clientY - rect.top - height / 2) / camera.zoom + camera.y;
    return { x, y };
  }

  function getTouchDistance(touches) {
    if (touches.length < 2) return 0;
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    return Math.hypot(dx, dy);
  }

  function handleZoneClick(worldPos) {
    const hit = zones.find(z => {
      if (!isZoneVisible(z)) return false;
      const dx = worldPos.x - z.x;
      const dy = worldPos.y - z.y;
      return Math.hypot(dx, dy) <= getZoneRadius(z) + 30;
    });
    if (hit) {
      currentZone = hit;
      const hidden = isHiddenZone(hit);
      const displayName = hidden ? hiddenZoneDisplayName : getZoneLabel(hit);
      zoneName.textContent = displayName;
      if (hidden) {
        zoneDesc.textContent = 'You found all the secrets. The hidden depths welcome you. Here, at the space between all spaces, you may plant a seed that will grow in the deepest soil.';
        zoneInfo.classList.add('hidden-zone');
        seedButton.textContent = '✨ plant a golden seed';
      } else {
        zoneDesc.textContent = hit.desc;
        zoneInfo.classList.remove('hidden-zone');
        seedButton.textContent = '🌱 plant a seed here';
      }
      zoneInfo.classList.add('visible');
      clearTimeout(handleZoneClick._timer);
      handleZoneClick._timer = setTimeout(() => closeZonePanel(), 4200);
      markZoneDiscovered(hit.name);
      seedModal.classList.remove('visible');
    }
  }
